ySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>{const id=x.dataset.answer;st.answers[id.includes('-')?id:id]=x.value})}

function grade(si){const st=state[si],s=sections[si];st.score=s.items.reduce((n,it,ii)=>n+itemResult(st,it,ii).earned,0);renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(x=>x.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'][si]} 採点結果</h2>`;s.items.forEach((it,ii)=>{const r=itemResult(st,it,ii),row=document.createElement('div');row.className=`result-item ${r.ok?'result-correct':'result-incorrect'}`;row.innerHTML=`<span class="res-badge">${r.ok?`正解（${r.earned}点）`:r.earned?`一部正解（${r.earned}/${it.points}点）`:'不正解（0点）'}</span><div><strong>${esc(it.q)}</strong></div><div>あなたの回答：${esc(r.user)}</div><div>正解：${esc(r.answer)}</div>`;card.appendChild(row)});card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：${st.score} / ${maxPoints(s)}点</div>`);const back=document.createElement('button');back.className='btn-submit';back.textContent='回答に戻る';back.onclick=()=>renderQuestion(si);card.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn-submit';next.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'][si+1]}へ進む`;next.onclick=()=>renderQuestion(si+1);card.appendChild(next)}else{const end=document.createElement('button');end.className='btn-submit';end.textContent='最終結果を見る';end.onclick=renderFinal;card.appendChild(end)}document.getElementById('quiz').appendChild(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(x=>x.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner ${total>=passMark?'pass':''}">総合得点：${total} / ${nominalTotal}点<div style="font-size:1.1rem;margin-top:8px">${total>=passMark?'合格':'不合格'}</div><div style="font-size:.85rem">合格ライン：${passMark}点以上</div></div>`;sections.forEach((s,i)=>{const d=document.createElement('div');d.className='result-section-title';d.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'][i]}：${state[i].score} / ${maxPoints(s)}点`;card.appendChild(d)});const home=document.createElement('a');home.className='btn-submit';home.href='https://hena-choco.github.io';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card)}
renderQuestion(0);
</script></body></html>
