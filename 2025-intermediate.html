function sectionScore(si){const st=state[si];return st.score+sections[si].fields.reduce((n,f,i)=>n+(f.type==='self'&&st.checks[i]?f.pts:0),0)}
function renderQuestion(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} <span class="points">（${s.max}点満点）</span></h2><div class="reading">${esc(s.reading)}${s.passage?`\n\n${esc(s.passage)}`:''}</div>`;
s.fields.forEach((f,i)=>{const b=document.createElement('div');b.className='question-block';let ctl;if(f.type==='tf')ctl=`<div class="options-grid">${['〇','×'].map((x,j)=>`<button type="button" class="opt-btn ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${x}</button>`).join('')}</div>`;else if(f.type==='choice')ctl=`<div class="options-vertical">${f.options.map((x,j)=>`<button type="button" class="opt-btn-v ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${j+1}. ${esc(x)}</button>`).join('')}</div>`;else ctl=`<input class="text-input" type="text" data-answer="${i}" value="${esc(st.answers[i]||'')}" placeholder="回答を入力">`;b.innerHTML=`<div class="q-title">${esc(f.q)} <span class="points">（${f.pts}点）</span></div>${ctl}`;card.append(b)});
const nav=document.createElement('div');nav.className='nav-row';if(si){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.append(back)}else{const x=document.createElement('span');x.className='nav-placeholder';nav.append(x)}const go=document.createElement('button');go.className='btn';go.textContent='回答を採点する →';go.onclick=()=>grade(si);nav.append(go);card.append(nav);document.getElementById('quiz').append(card);
card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.answers[+x.dataset.choice]=+x.dataset.value;x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))});card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[+x.dataset.answer]=x.value)}
function grade(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[+x.dataset.answer]=x.value);st.score=0;s.fields.forEach((f,i)=>{if(f.type!=='self'&&correct(f,st,i))st.score+=f.pts});renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} 採点結果</h2>`;s.fields.forEach((f,i)=>{const manual=f.type==='self';let ok=manual?false:correct(f,st,i);if(manual&&correct(f,st,i))st.checks[i]=true;const earned=manual?(st.checks[i]?f.pts:0):(ok?f.pts:0),user=f.type==='tf'?(st.answers[i]===undefined?'未選択':['〇','×'][st.answers[i]]):f.type==='choice'?(st.answers[i]===undefined?'未選択':`${st.answers[i]+1}. ${f.options[st.answers[i]]}`):(st.answers[i]||'未入力'),answer=f.type==='choice'?`${f.answer+1}. ${f.options[f.answer]}`:f.answer,row=document.createElement('div');row.className='result-item';row.classList.add(manual?(st.checks[i]?'result-correct':'result-pending'):(ok?'result-correct':'result-wrong'));row.innerHTML=`<span class="badge">${manual?'自己採点':ok?'✓ 正解':'× 不正解'}（${earned}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${esc(user)}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${i}" ${st.checks[i]?'checked':''}> 模範解答と同等の内容を書けていた（${f.pts}点）</label>`:''}`;card.append(row);if(manual)row.querySelector('[data-check]').onchange=event=>{st.checks[i]=event.target.checked;renderResult(si)}});card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：${sectionScore(si)} / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const edit=document.createElement('button');edit.className='btn';edit.textContent='← 回答を修正';edit.onclick=()=>renderQuestion(si);nav.append(edit);const next=document.createElement('button');next.className='btn';next.textContent=si<sections.length-1?'次の大問 →':'最終結果を見る →';next.onclick=()=>si<sections.length-1?renderQuestion(si+1):renderFinal();nav.append(next);card.append(nav);document.getElementById('quiz').append(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=sections.reduce((a,s,i)=>a+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner ${total>=PASS_SCORE?'pass':''}">総合得点：${total} / 100点<br><span style="font-size:1rem">${total>=PASS_SCORE?'合格':'不合格'}（合格点：${PASS_SCORE}点）</span></div>`;sections.forEach((s,i)=>{const d=document.createElement('div');d.className='summary-title';d.textContent=`大問 ${s.title}：${sectionScore(i)} / ${s.max}点`;card.append(d)});const a=document.createElement('section');a.className='account-card';a.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数と解答を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.append(a);document.getElementById('quiz').append(card);setupAccount(total)}
function setupAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='点数と解答は保存済みです。';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数と解答を自動保存しています…';const answers=sections.map((s,si)=>({section:s.title,score:sectionScore(si),answers:s.fields.map((f,i)=>({question:f.q,answer:state[si].answers[i]===undefined?'未回答':f.type==='choice'?`${state[si].answers[i]+1}. ${f.options[state[si].answers[i]]}`:f.type==='tf'?(['〇','×'][state[si].answers[i]]||'未回答'):state[si].answers[i],correctAnswer:f.type==='choice'?`${f.answer+1}. ${f.options[f.answer]}`:f.answer,correct:f.type==='self'?null:correct(f,state[si],i),earned:f.type==='self'?(state[si].checks[i]?f.pts:0):correct(f,state[si],i)?f.pts:0,maxPoints:f.pts,selfCheck:f.type==='self'}))}));finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2025-intermediate',quizTitle:'ドラえもん検定 2025年度 中級',score:total,total:100,passThreshold:PASS_SCORE,answers}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数と解答を保存しました。';saveStatus.dataset.kind='success'}).catch(e=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error(e)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{const email=$('account-email').value.trim(),password=$('account-password').value;await window.DoraemonAuth[mode==='register'?'register':'login'](email,password);form.reset();setStatus('ログインしました。','success')}catch(error){setStatus(error.code==='auth/invalid-credential'?'メールアドレスまたはパスワードを確認してください。':'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=!!user;$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数と解答を自動で記録します。'}},()=>setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error'))}
renderQuestion(0);

</script>
