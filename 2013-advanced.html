<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ドラえもん検定 2013 上級</title>
<meta name="description" content="ドラえもん検定 2013 上級の全6大問に挑戦。正誤・選択問題は自動採点、記述問題は模範解答を見ながら自己採点できます。">
<link rel="icon" href="https://hena-choco.github.io/favicon.png" type="image/png">
<style>
:root { --main:#6B9DFF; --bg:#f4f7f9; --card:#fff; --text:#333; --accent:#FFD43B; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.65; padding:20px 12px; }
.container { max-width:680px; margin:auto; }
.site-nav { position:sticky; top:8px; z-index:5; display:flex; justify-content:flex-start; margin-bottom:10px; }
.home-link { display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:8px; background:#fff; color:#6B9DFF; border:1px solid #d6e3f8; font-weight:700; text-decoration:none; box-shadow:0 2px 8px #0000000d; }
header { text-align:center; margin-bottom:20px; padding:18px; background:var(--main); color:#fff; border-radius:12px; }
h1 { font-size:1.35rem; }
.card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 2px 8px #0000000d; margin-bottom:18px; }
h2 { font-size:1.12rem; margin-bottom:12px; }
.reading { white-space:pre-line; background:#f9fbfd; border:1px solid #e1ecff; border-radius:8px; padding:14px; margin-bottom:18px; }
.question-group { border:1px solid #e1ecff; border-radius:8px; background:#fff; padding:14px; margin:14px 0; }
.group-title { font-size:1rem; margin-bottom:10px; white-space:pre-line; }
.question-block { margin-bottom:20px; padding-bottom:14px; border-bottom:1px dashed #e5e5e5; }
.question-block:last-child { border-bottom:0; }
.q-title { font-weight:700; margin-bottom:8px; white-space:pre-line; }
.options-grid { display:flex; gap:10px; margin-top:8px; }
.opt-btn { flex:1; padding:12px; border:2px solid var(--main); background:var(--card); color:var(--main); font-size:1.1rem; font-weight:bold; border-radius:8px; cursor:pointer; }
.opt-btn.selected,.opt-btn-v.selected { background:var(--main); color:var(--card); }
.options-vertical { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.order-sequence { margin-top:8px; padding:9px; border-radius:6px; background:#f4f7f9; }
.order-reset { margin-top:8px; padding:7px 10px; border:1px solid #d6e3f8; border-radius:6px; background:#fff; color:#315a9d; font:inherit; cursor:pointer; }
.opt-btn-v { text-align:left; padding:12px 16px; border:2px solid var(--main); background:var(--card); color:var(--text); font-size:1rem; border-radius:8px; cursor:pointer; }
.text-input { width:100%; padding:11px; font-size:1rem; border:2px solid var(--main); border-radius:8px; margin-top:5px; font-family:inherit; }
.points,.muted { color:#666; font-size:.88rem; font-weight:400; }
.btn { display:block; width:100%; padding:16px; background:var(--main); color:var(--card); border:0; border-radius:8px; font-size:1.05rem; font-weight:bold; cursor:pointer; margin-top:10px; text-align:center; text-decoration:none; }
.btn:hover { background:#5689e8; }
.nav-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.nav-row .btn { margin:0; min-height:54px; display:flex; align-items:center; justify-content:center; }
.nav-placeholder { visibility:hidden; }
.result-item { padding:12px; border-radius:8px; margin:10px 0; font-size:.95rem; border:1px solid #d8dde5; background:#f7f8fa; }
.result-item.result-correct { border:0; background:#6B9DFF; color:#fff; }
.result-item.result-correct .answer-key { color:#fff; }
.result-item.result-correct .badge { background:rgba(255,255,255,.2); color:#fff; }
.result-item.result-wrong { border:0; background:#f1f2f4; color:#333; }
.result-item.result-wrong .badge { background:transparent; color:#6B9DFF; }
.result-item.result-pending { border:1px solid #d8dde5; background:#fff; color:#333; }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-weight:700; font-size:.8rem; margin-bottom:4px; background:#eaf1ff; color:#335f9e; }
.answer-key { margin-top:5px; color:#444; white-space:pre-line; overflow-wrap:anywhere; }
.self-check { display:block; margin-top:9px; padding:9px; background:#f4f7f9; border-radius:6px; }
.score-banner { text-align:center; background:var(--main); color:var(--card); padding:20px; border-radius:12px; font-size:1.3rem; font-weight:700; margin:12px 0 18px; }
.summary-title { border-bottom:2px solid var(--main); padding:0 0 4px; margin:20px 0 10px; font-weight:700; }
.account-card { background:#fff; border:1px solid #e4e9f0; border-radius:12px; padding:18px; margin-top:22px; }
.account-card h2 { margin-bottom:6px; }
.account-status { min-height:1.5em; margin:7px 0 12px; font-size:.9rem; }
.account-status[data-kind="error"] { color:#a33; }
.account-status[data-kind="success"] { color:#176b45; }
.account-form { display:grid; gap:10px; }
.account-form[hidden], [hidden] { display:none !important; }
.account-form label { display:grid; gap:4px; font-size:.9rem; font-weight:600; }
.account-form input { width:100%; padding:11px; border:1px solid #cfd6df; border-radius:7px; font:inherit; }
.account-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.account-button { border:0; border-radius:7px; padding:10px 14px; font:inherit; font-weight:700; cursor:pointer; }
.account-button.primary { background:var(--main); color:#fff; }
.account-button.secondary { background:#eef3fb; color:#315a9d; }
.account-button:disabled { opacity:.55; cursor:not-allowed; }
.account-switch { margin-top:10px; font-size:.88rem; }
.account-switch button { border:0; background:none; color:#315a9d; text-decoration:underline; font:inherit; font-weight:700; cursor:pointer; }
.account-signed-in { padding:10px; background:#f4f8ff; border-radius:7px; overflow-wrap:anywhere; }
@media(max-width:480px) { body { padding:12px 8px; } .card { padding:16px; } .nav-row { gap:7px; } .nav-row .btn { padding:12px 8px; font-size:.95rem; } }
</style>
</head>

  card.querySelectorAll('[data-multi]').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.multi),j=Number(x.dataset.value),selected=st.answers[i]||[];if(selected.includes(j))st.answers[i]=selected.filter(v=>v!==j);else if(selected.length<(s.fields[i].maxSelections||2))st.answers[i]=[...selected,j];x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',(st.answers[i]||[]).includes(Number(y.dataset.value))))});
  const syncOrder=(i)=>{const f=s.fields[i],sequence=st.answers[i]||[];card.querySelectorAll(`[data-order="${i}"]`).forEach(button=>button.classList.toggle('selected',sequence.includes(Number(button.dataset.value))));const display=card.querySelector(`[data-order-sequence="${i}"]`);if(display)display.textContent='選択順：'+(sequence.length?sequence.map(j=>f.optionLabels[j]).join(' → '):'未選択')};
  card.querySelectorAll('[data-order]').forEach(button=>button.onclick=()=>{const i=Number(button.dataset.order),j=Number(button.dataset.value),sequence=st.answers[i]||[];st.answers[i]=sequence.includes(j)?sequence.filter(v=>v!==j):[...sequence,j];syncOrder(i)});
  card.querySelectorAll('[data-order-reset]').forEach(button=>button.onclick=()=>{const i=Number(button.dataset.orderReset);st.answers[i]=[];syncOrder(i)});
  card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.answers[Number(x.dataset.choice)]=Number(x.dataset.value);x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))});
  card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[Number(x.dataset.answer)]=x.value);
}
function sectionScore(si){const st=state[si];return st.score+sections[si].fields.reduce((n,f,i)=>n+(f.type==='self'&&f.rubric?f.rubric.reduce((m,p,j)=>m+(st.checks[i+'_'+j]?p[1]:0),0):f.type==='self'&&st.checks[i]?f.pts:0),0)}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[Number(x.dataset.answer)]=x.value);st.score=0;s.fields.forEach((f,i)=>{if(f.type==='tf')st.score+=(['〇','×'][st.answers[i]]===f.answer?f.pts:0);else if(f.type==='choice')st.score+=(st.answers[i]===f.answer?f.pts:0);else if(f.type==='multi')st.score+=(Array.isArray(st.answers[i])&&st.answers[i].length===f.answer.length&&f.answer.every(v=>st.answers[i].includes(v))?f.pts:0);else if(f.type==='order')st.score+=(f.answer.reduce((n,v,j)=>n+((st.answers[i]||[])[j]===v?f.itemPts:0),0))});renderResult(si)}
function renderResult(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} 採点結果</h2>`;
  let currentGroup=null,groupContainer=null;s.fields.forEach((f,i)=>{if(f.group&&f.group!==currentGroup){currentGroup=f.group;groupContainer=document.createElement('section');groupContainer.className='question-group';const heading=document.createElement('h3');heading.className='group-title';heading.textContent=currentGroup;groupContainer.appendChild(heading);card.appendChild(groupContainer)}const row=document.createElement('div');row.className='result-item';const manual=f.type==='self';let ok=false,user='',answer=f.answer||'';
    if(f.type==='tf'){ok=['〇','×'][st.answers[i]]===f.answer;user=st.answers[i]===undefined?'未選択':['〇','×'][st.answers[i]]}
    else if(f.type==='choice'){ok=st.answers[i]===f.answer;user=st.answers[i]===undefined?'未選択':`${(f.optionLabels&&f.optionLabels[st.answers[i]])||String.fromCharCode(65+st.answers[i])}. ${f.options[st.answers[i]]}`;answer=`${(f.optionLabels&&f.optionLabels[f.answer])||String.fromCharCode(65+f.answer)}. ${f.options[f.answer]}`}
    else if(f.type==='multi'){const selected=Array.isArray(st.answers[i])?st.answers[i]:[];ok=selected.length===f.answer.length&&f.answer.every(v=>selected.includes(v));user=selected.length?selected.map(j=>String.fromCharCode(65+j)+'. '+f.options[j]).join('、'):'未選択';answer=f.answer.map(j=>String.fromCharCode(65+j)+'. '+f.options[j]).join('、')}
    else if(f.type==='order'){const selected=st.answers[i]||[];ok=selected.length===f.answer.length&&selected.every((v,j)=>v===f.answer[j]);user=selected.length?selected.map(j=>f.optionLabels[j]).join(' → '):'未選択';answer=f.answer.map(j=>f.optionLabels[j]).join(' → ')}
    else{user=st.answers[i]||'';st.checks[i]=matches(user,f.aliases||[f.answer])}
    const earned=f.type==='order'?f.answer.reduce((n,v,j)=>n+((st.answers[i]||[])[j]===v?f.itemPts:0),0):manual?(f.rubric?f.rubric.reduce((n,p,j)=>n+(st.checks[i+'_'+j]?p[1]:0),0):(st.checks[i]?f.pts:0)):(ok?f.pts:0);row.classList.add(manual?(earned===f.pts?'result-correct':'result-pending'):(earned===f.pts?'result-correct':'result-wrong'));
    row.innerHTML=`<span class="badge">${manual?'自己採点':f.type==='order'?'順番ごとに採点':ok?'✓ 正解':'× 不正解'}（${earned}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${user?esc(user):'未入力'}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${i}" ${st.checks[i]?'checked':''}> ${f.complete?'指定された4つをすべて答えられていた':'模範解答と同等の内容を書けていた'}（${f.pts}点）</label>`:''}`;(groupContainer||card).appendChild(row);
    if(manual&&f.rubric){row.querySelector('.self-check').remove();f.rubric.forEach((part,j)=>{const label=document.createElement('label');label.className='self-check';const check=document.createElement('input');check.type='checkbox';check.checked=Boolean(st.checks[i+'_'+j]);check.onchange=()=>{st.checks[i+'_'+j]=check.checked;const itemPoints=f.rubric.reduce((n,p,k)=>n+(st.checks[i+'_'+k]?p[1]:0),0);document.getElementById('subtotal').textContent=sectionScore(si);row.querySelector('.badge').textContent='自己採点（'+itemPoints+' / '+f.pts+'点）';row.classList.toggle('result-correct',itemPoints===f.pts);row.classList.toggle('result-pending',itemPoints!==f.pts)};label.append(check,document.createTextNode(' '+part[0]+'（'+part[1]+'点）'));row.append(label)})}
    if(manual&&!f.rubric)row.querySelector('[data-check]').onchange=ev=>{st.checks[i]=ev.target.checked;row.classList.toggle('result-correct',ev.target.checked);row.classList.toggle('result-pending',!ev.target.checked);row.querySelector('.badge').textContent=`自己採点（${ev.target.checked?f.pts:0}/${f.pts}点）`;document.getElementById('subtotal').textContent=sectionScore(si)};
  });
  card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${sectionScore(si)}</span> / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);const next=document.createElement('button');next.className='btn';next.textContent=si<sections.length-1?'次の大問 →':'最終結果を見る →';next.onclick=()=>si<sections.length-1?renderQuestion(si+1):renderFinal();nav.appendChild(next);card.appendChild(nav);document.getElementById('quiz').appendChild(card);
}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=sections.reduce((n,s,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 100点<br><span style="font-size:1rem">${total>=70?'合格':'不合格'}（合格点：70点）</span></div>`;sections.forEach((s,i)=>{const title=document.createElement('div');title.className='summary-title';title.textContent=`大問 ${s.title}：${sectionScore(i)} / ${s.max}点`;card.appendChild(title)});
  const saveCard=document.createElement('section');saveCard.className='account-card';saveCard.setAttribute('aria-labelledby','account-heading');saveCard.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.appendChild(saveCard);document.getElementById('quiz').appendChild(card);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);setupFinalAccount(total)}
function setupFinalAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(message,kind='')=>{status.textContent=message;status.dataset.kind=kind};const saveFinalScore=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数を自動保存しています…';saveStatus.dataset.kind='';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2013-advanced',quizTitle:'ドラえもん検定 2013 上級',score:total,total:100,passThreshold:70}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};const setMode=next=>{mode=next;const registering=mode==='register';submit.textContent=registering?'アカウントを作成':'ログイン';$('switch-prompt').textContent=registering?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=registering?'ログイン':'新規アカウント作成';$('account-password').autocomplete=registering?'new-password':'current-password';setStatus(registering?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').addEventListener('click',()=>setMode(mode==='login'?'register':'login'));form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{const email=$('account-email').value.trim(),password=$('account-password').value;if(mode==='register')await window.DoraemonAuth.register(email,password);else await window.DoraemonAuth.login(email,password);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const messages={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(messages[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}});$('logout-button').addEventListener('click',async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}});retry.addEventListener('click',saveFinalScore);window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');saveFinalScore()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error('Firebase auth state error',error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')})}
