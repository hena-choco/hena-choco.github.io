{title:'1',max:5,reading:'1 22巻、43巻などによると、のび太のお小遣いは月500円である。それを踏まえ、以下の問に答えよ。限定一個のプラモデルがどうしても欲しくなったのび太は、珍しく貯めていたふた月分のお小遣いを全てフエール銀行に預金した。2時間後にそれを取り出したが、そこで税金鳥に税を徴収されてしまい、お金が足りなくなったのでデビルカードで身長を1mm犠牲にして補填した。しかし模型屋に行く途中、そのプラモデルを買いに行くスネ夫を発見したため、ころばし屋で念入りに9回転ばして足止めした。その後、プラモデルを買ったところ、7円余った。さて、プラモデルの値段は何円だったか。',fields:[{q:'プラモデルの値段',kind:'text',answer:'1110 円',aliases:['1110円','1110'],pts:5}]},

{title:'3',max:5,reading:'3 ひみつ道具に関する以下の記述が正しい場合は〇で、間違っている場合は×で答えよ。',fields:[['(1) 桃太郎印のきびだんごはヒトにも効く。','〇'],['(2) お医者さんカバンから出てくる薬は不味い。','×'],['(3) どこでもドアには鍵が付いている。','〇'],['(4) ほんやくコンニャクを食べると動物の言葉も分かる。','〇'],['(5) ゴーホーム・オルゴールからは「家路」のメロディーが流れる。','×']].map(([q,answer])=>({q,kind:'tf',answer,pts:1}))},
{title:'4',max:25,reading:'4 以下の図は、作中におけるおおまかな時系列を示したものである。グラフ中のそれぞれの時点1〜25に最もふさわしい出来事を、下記の語群ア〜ノから選べ。（※グラフは現実的に正確なものではありません。上部の時代区分は選択肢の時点に該当するものだけを記載しています。）',table:[['1','石炭紀・三畳紀','3億年前','セ'],['2','石炭紀・三畳紀','3億年前','ウ'],['3','白亜紀','1億年前','ネ'],['4','白亜紀','1億年前','タ'],['5','白亜紀','6500万年前','テ'],['6','石器時代','10万年前','シ'],['7','石器時代','7万年前','ケ'],['8','石器時代','2万年前','ニ'],['9','弥生時代','120年ごろ','ス'],['10','飛鳥時代','630年','ア'],['11','平安時代','794年','ヌ'],['12','室町時代','1049年','ノ'],['13','室町時代','1338年','キ'],['14','室町時代','1476年','ク'],['15','安土桃山','1580年','コ'],['16','安土桃山','1600年頃','オ'],['17','江戸時代','17世紀後半','ナ'],['18','江戸時代','1826年','ソ'],['19','明治','1880年','ツ'],['20','明治','1910年','イ'],['21','昭和','1945年','ト'],['22','昭和','1948年','エ'],['23','10年前','','カ'],['24','10年前','','チ'],['25','未来','2112年','サ']],options:'ア 三蔵法師と出会い、牛魔王と戦う／イ のび吉が子孫のために庭に浮き輪を埋める／ウ ネコジャラと対決し、ワンニャン国民が他の星へ移住する／エ のび太のママがダイヤを無くす／オ 宮本武蔵に名刀電光丸を渡してしまう／カ おばあちゃんに会ってランドセル姿を見せる／キ 桃太郎伝説の謎を解く／ク ミュンヒハウゼン男爵をこの時代から現代に連れてくる／ケ ギガゾンビと戦い、ヒカリ族を日本へ案内する／コ ドラミが少年山賊団と過ごす／サ ドラえもん誕生／シ 南極でブリザーガと戦い、ヒョーガヒョーガ星の氷が解ける／ス ヤマタノオロチを退治する／セ 「ゴキブリカバー」で増えたゴキブリがこの時代に送られる／ソ のび佐エ門が息子 のび作のために小遣いを埋める／タ ピー助をめぐり恐竜ハンターと対決する／チ 酔いつぶれたパパを叱ってもらうために、この時代からおばあちゃんに来てもらう／ツ モルグシティでのび太がガンマンとして活躍する／テ 地底人たちに風雲ドラえもん城で対抗する／ト のび太のパパが「白百合のような女の子」に出会う／ナ カリブ海で海賊たちと共に時間犯罪者と戦う／ニ この時代のホテルで過ごすも、火山の噴火に巻き込まれる／ヌ 砂漠の中でシンドバッドと出会う／ネ この時代の中国から「招待錠」で恐竜を連れてこようとするも、失敗する／ノ 海岸で浦島太郎を見つけ、竜宮へ行く船を尾行する',fields:[]},
{title:'5',max:34,reading:'5 以下の問の答えを記述せよ。',fields:[{q:'(1) 以下の選択肢は、大長編に登場したマスコット的キャラクターの特徴的な鳴き声である。それぞれの名前を答えよ。 A「ピューイ」 B「ポルポル」 C「フーン」',kind:'group',answers:['ピー助','ポポル','フー子'],pts:2},{q:'(2) 以下の文章をミニドラが話した場合、どのような文章になるか答えよ。「どこでもドアで高井山に行こう」',kind:'group',answers:['ドードー','ターター','イーイー'],partPts:[1,1,1],pts:3},{q:'(3) のび太は、作中時点から100年後にある出来事が起きることが確定している。それは何か。',kind:'text',answer:'百苦タイマーの7回目以降が来る。',pts:2},{q:'(4) 以下の映画・大長編の冒頭の元ネタとなった短編のタイトルをそれぞれ答えよ。A『南極カチコチ大冒険』 B『ワンニャン時空伝』 C『月面探査記』',kind:'group',answers:['大氷山の小さな家','のら犬「イチ」の国','異説クラブメンバーズバッジ'],pts:3},{q:'(5) 「コエカタマリン」が作中で使用された際、それぞれの場合においてどのような文字が使われたか。A. 高井山まで空を飛んでいった時 B. どろぼう猫を捕まえた時 C. ジャイアンとスネ夫を捕まえた時 D. ジャイアンを吹っ飛ばした時',kind:'group',answers:['ワ','コラ','ロ（ロロも可）','バカ／マヌケ／トンマ／ウスラデブ／ノータリン／イタ'],partPts:[1,1,1,1],pts:4},{q:'(6) 「新宿区北新宿二○一くずれ荘五号室」に居住していた人物',kind:'text',answer:'土路坊太',pts:2},{q:'(7) シャーロック・ホームズセットを構成する4つのひみつ道具を答えよ。',kind:'group',answers:['手がかりレンズ','レーダーステッキ','推理ぼう','ズバリパイプ'],partPts:[1,1,1,1],pts:4},{q:'(8) 「真実の旗印」を解答用紙に描画せよ。',kind:'text',answer:'正正正',pts:2},{q:'(9) 今年公開の映画『のび太の月面探査記』において新しく誕生したひみつ道具を答えよ。',kind:'text',answer:'定説クラブメンバーズバッジ',pts:2},{q:'(10) 「ザ・ドラえもんズ」のメンバー、ドラ・ザ・キッドが尊敬している人物を答えよ。',kind:'text',answer:'チャック・イェーガー',pts:2},{q:'(11) TC6巻「ネッシーが来る！」などドラミちゃんが登場する話のいくつかは、1974年に姉妹作品として連載された「ドラミちゃん」から設定変更と修正を加え、「ドラえもん」のエピソードとして収録されたものである。その際、以下のドラえもんの登場人物に置き換えられた元々の人物名を答えよ。 A. のび太 B. ジャイアン',kind:'group',answers:['のび太郎','カバ田（ゴリブリ）'],partPts:[1,1],pts:2},{q:'(12) 入り込み鏡と出入り鏡の効果の違い',kind:'text',answer:'入り込み鏡は現実に影響がない。出入り鏡は影響がある。',pts:2},{q:'(13) 本日、11月3日は、作中においてはある記念日である。それは何か。',kind:'text',answer:'のび太のパパとママの婚約記念日',pts:2},{q:'(14) 『空飛ぶうす手じゅうたん』で、しずかちゃんの服が飛んでいってしまったのは、ある歌のある歌詞にひみつ道具が反応したからであるが、その部分の歌詞を答えよ。',kind:'text',answer:'空を自由に飛びたいな',pts:2}]},

{title:'7',max:8,reading:'7 以下の状況を、ひみつ道具以外の手段を使わずにどう解決するか、考えて記述しなさい。\n「夏休みに中国の西安で兵馬俑を見てきた」とスネ夫に自慢されたのび太は、つい「自分も見たことがある」と嘘をついてしまう。証拠写真を要求するスネ夫に対し「2時間で写真を持ってくる」と約束してドラえもんに相談したのび太だったが、あいにくと、どこでもドアを含め殆どの道具が修理中だった。さらに、焦りだすのび太を尻目に、ドラえもんはスペアポケットだけを渡し、近くの公園へタマちゃんとのデートに行ってしまった。さて、この状況で、今あるひみつ道具をどのように使えば、のび太は2時間で中国・西安に行って兵馬俑とのツーショットを撮ってくることが出来るだろうか？\n北緯40度、東京、西安、2800kmの地図情報。東京〜西安間の距離は約2800km。図中の経線は地球一周360度のうち東経110度から140度まで10度ごと。緯線は赤道を0度、北極点を北緯90度とする。写真撮影や地理的な微妙なズレなど細かいことは考えなくてよい。ひみつ道具の効果はTVシリーズを除いた作品中の描写に準じる。スペアポケットの道具：タケコプター、ネンドロン、快速シューズ、断層ビジョン、リニアモーターカーごっこ、コピーロボット、スピード増感ゴーグル、道路光線、天地逆転オイル、地球下車マシン、テキオー灯、三倍時計ペタンコ、電車ごっこロープ。',fields:[{q:'解決策と道具の使い方・所要時間を説明する',kind:'essay',answer:'地球下車マシンを使って西安まで行く（2時間）。スペアポケットからドラえもんのポケットにワープ（0分）。地球下車マシンは同緯度のラインに沿って24時間で地球を一周する。東京〜西安はほぼ東経140度〜110度の移動で経度30度分なので、360÷30＝12、1日の1/12＝2時間で移動できる。南北移動分の誤差は他の移動系道具を併用して解消する。',pts:8}]}

const matches=(v,answers=[])=>answers.some(a=>normalize(v)===normalize(a));
const partKey=(i,j)=>`${i}_${j}`;
function isGroupPartCorrect(f,st,i,j){const raw=f.answers[j]??'';const accepted=String(raw).split(/[／/]/).map(x=>x.trim()).filter(Boolean);return matches(st.answers[partKey(i,j)],accepted)}
function autoScore(f,st,i){
  if(f.kind==='tf')return ['〇','×'][st.answers[i]]===f.answer?f.pts:0;
  if(f.kind==='choice')return st.answers[i]===f.answer?f.pts:0;
  if(f.kind==='multiChoice'){const selected=f.options.map((_,j)=>j).filter(j=>st.answers[partKey(i,j)]);return selected.length===f.answers.length&&f.answers.every(j=>selected.includes(j))?f.pts:0}
  return 0;
}
function fieldScore(f,st,i){
  if(['tf','choice','multiChoice'].includes(f.kind))return autoScore(f,st,i);
  if(f.kind==='group'&&f.partPts)return f.partPts.reduce((n,p,j)=>n+(st.checks[partKey(i,j)]?p:0),0);
  if(f.kind==='table-item')return st.answers[i]===f.answer?f.pts:0;
  return st.checks[i]?f.pts:0;
}
function sectionScore(si){const s=sections[si],st=state[si];return s.fields.reduce((n,f,i)=>n+fieldScore(f,st,i),0)+(s.table?s.table.reduce((n,r,j)=>n+(st.answers[`table_${j}`]===r[3]?1:0),0):0)}

  s.fields.forEach((f,i)=>{
    const block=document.createElement('div');block.className='question-block';block.innerHTML=`<div class="q-title">${esc(f.q)} <span class="points">（${f.pts}点）</span></div>`;

function gradeSection(si){const s=sections[si],st=state[si];s.fields.forEach((f,i)=>{if(f.kind==='text'||f.kind==='essay'||f.kind==='order')st.checks[i]=matches(st.answers[i],[f.answer,...(f.aliases||[])]);if(f.kind==='group'){if(f.partPts)f.answers.forEach((a,j)=>st.checks[partKey(i,j)]=isGroupPartCorrect(f,st,i,j));else st.checks[i]=f.answers.every((a,j)=>isGroupPartCorrect(f,st,i,j))}});st.score=sectionScore(si);renderResult(si)}
function addResultRow(card,{question,user,answer,pts,earned,manual,checkId,si}){const row=document.createElement('div');row.className='result-item';row.classList.add(manual?(earned?'result-correct':'result-pending'):(earned===pts?'result-correct':'result-wrong'));row.innerHTML=`<span class="badge">${manual?'自己採点':earned===pts?'✓ 正解':'× 不正解'}（${earned}/${pts}点）</span><div><strong>${esc(question)}</strong></div><div class="answer-key">あなたの回答：${esc(user||'未入力')}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${esc(checkId)}" ${earned?'checked':''}> 模範解答と同等の内容を書けていた（${pts}点）</label>`:''}`;card.append(row);const cb=row.querySelector('[data-check]');if(cb)cb.onchange=()=>{state[si].checks[checkId]=cb.checked;const value=cb.checked?pts:0;row.querySelector('.badge').textContent=`自己採点（${value}/${pts}点）`;row.classList.toggle('result-correct',cb.checked);row.classList.toggle('result-pending',!cb.checked);document.getElementById('subtotal').textContent=sectionScore(si)}}
function renderResult(si){

  card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${sectionScore(si)}</span> / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.append(back);const next=document.createElement('button');next.className='btn';next.textContent=si<sections.length-1?'次の大問 →':'最終結果を見る →';next.onclick=()=>si<sections.length-1?renderQuestion(si+1):renderFinal();nav.append(next);card.append(nav);document.getElementById('quiz').append(card);
}
function renderFinal(){const total=sections.reduce((n,_,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / ${totalPoints}点<br><span style="font-size:1rem">${total>=passMark?'合格':'不合格'}（合格点：${passMark}点）</span></div>`;sections.forEach((s,i)=>{const d=document.createElement('div');d.className='summary-title';d.textContent=`大問 ${s.title}：${sectionScore(i)} / ${s.max}点`;card.append(d)});const account=document.createElement('section');account.className='account-card';account.setAttribute('aria-labelledby','account-heading');account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数と解答を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.append(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.append(home);document.querySelectorAll('.screen').forEach(e=>e.remove());document.getElementById('quiz').append(card);setupFinal(total)}
function setupFinal(total){const $=id=>document.getElementById(id),form=$('account-form'),submit=$('submit-account'),status=$('account-status'),saveStatus=$('score-save-status'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数と解答は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;const answers=sections.map((s,i)=>({section:s.title,answers:state[i].answers,selfCheck:state[i].checks,score:sectionScore(i)}));saveStatus.textContent='点数と解答を自動保存しています…';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2019-super-advanced',quizTitle:'ドラえもん検定 超上級',score:total,total:totalPoints,passThreshold:passMark,answers}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数と解答を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{if(mode==='register')await window.DoraemonAuth.register($('account-email').value.trim(),$('account-password').value);else await window.DoraemonAuth.login($('account-email').value.trim(),$('account-password').value);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const m={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(m[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数と解答を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error(error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')})}
renderQuestion(0);
