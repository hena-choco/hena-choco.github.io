    @media(max-width:480px) { body { padding:12px 8px; } .card { padding:16px; } .nav-row { gap:7px; } .nav-row .btn { padding:12px 8px; font-size:.95rem; } }

function initializeDoraemonAuth(){if(window.DoraemonAuth)return Promise.resolve(window.DoraemonAuth);if(!window.firebase||!firebase.auth||!firebase.firestore)return Promise.reject(new Error('Firebase SDK not loaded'));return import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js').then(()=>import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')).then(()=>import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')).then(()=>{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);window.DoraemonAuth={firebase};return window.DoraemonAuth;}).catch(err=>{console.error(err);throw new Error('Firebase initialization failed');});}

const sections=[
{title:'1',max:5,reading:'1 22巻、43巻などによると、のび太のお小遣いは月500円である。それを踏まえ、以下の問に答えよ。限定一個のプラモデルがどうしても欲しいというのび太に、ドラえもんがくれたお小遣いは何円か。',fields:[{q:'(1) 何円か',kind:'text',answer:'500円',pts:1},{q:'(2) 何円か2',kind:'text',answer:'500円',pts:1},{q:'(3) 何円か3',kind:'text',answer:'500円',pts:1},{q:'(4) 何円か4',kind:'text',answer:'500円',pts:1},{q:'(5) 何円か5',kind:'text',answer:'500円',pts:1}]},
{title:'2',max:5,reading:'2 以下の画像の空欄①〜⑦に当てはまる語句を答えよ。なお、同じ語句が複数の空欄に当てはまることもある。',image:'media/2019-super-advanced-q2.png',fields:[{q:'①',kind:'text',answer:'ドラえもん',pts:1},{q:'②',kind:'text',answer:'野比のび太',pts:1},{q:'③',kind:'text',answer:'骨川スネ夫',pts:1},{q:'④',kind:'text',answer:'源静香',pts:1},{q:'⑤',kind:'text',answer:'剛田武',pts:1}]},
{title:'3',max:5,reading:'3 ひみつ道具に関する以下の記述が正しい場合は〇で、間違っている場合は×で答えよ。',fields:[{q:'(1) 桃太郎印のきびだんごはヒトの耳から入ると、耳の中に残る。',kind:'tf',answer:'×',pts:1},{q:'(2) たらしこみ装置は、山からの落下で急加速したときに働く。',kind:'tf',answer:'〇',pts:1},{q:'(3) 机の背中を押して発火させる装置は、書きかけの作文の面白さを増す。',kind:'tf',answer:'×',pts:1},{q:'(4) ふとんの上に寝ると七つの小さな夢を見る機械がある。',kind:'tf',answer:'〇',pts:1},{q:'(5) どこでもドアに入ると、あっという間に、帰りの時間がくる。',kind:'tf',answer:'×',pts:1}]},
{title:'4',max:25,reading:'4 以下の図は、作中におけるおおまかな時系列を示したものである。グラフ中のそれぞれの時点1〜25に最もふさわしい出来事を、正しい順に並べたものを選べ。',fields:[{q:'1〜25の時点の並び',kind:'choice',options:['A','B','C','D'],answer:'C',pts:25}]},
{title:'5',max:34,reading:'5 以下の問の答えを記述せよ。',fields:[{q:'(1) どのキャラクターの鳴き声が「キキキキ」か。',kind:'text',answer:'マスコット',pts:17},{q:'(2) どのキャラクターの鳴き声が「ガーッ」か。',kind:'text',answer:'ドラえもん',pts:17}]},
{title:'6',max:18,reading:'6 以下の問の答えとなる記号を記せ。',fields:[{q:'(1) 「ミニドラSOS！」のスポーツ',kind:'choice',options:['野球','サッカー','ラグビー','陸上'],answer:'野球',pts:9},{q:'(2) 「ドラミちゃん」役の声優',kind:'choice',options:['A','B','C','D'],answer:'B',pts:9}]},
{title:'7',max:8,reading:'7 以下の状況を、ひみつ道具以外の手段を使わずにどう解決するか、考えて記述しなさい。\n「夏休みに中国の西安で兵馬俑を見に行ったが、土の匂いが気にならず、全然楽しめなかった。」',fields:[{q:'考え方',kind:'essay',answer:'土の匂いを避ける方法',pts:8}]}];
const state=sections.map(s=>({answers:{},checks:{},score:0}));let finalScoreSavePromise=null,finalScoreSaved=false,screen=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、，,.!?！？ 　]/g,'');
function renderQuestion(si){screen=si;const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} <span class="points">(${s.fields.length}問 / ${s.max}点)</span></h2>${s.reading?`<div class="reading">${esc(s.reading)}</div>`:''}${s.image?`<div class="reading"><img src="${s.image}" alt="問題画像" style="max-width:100%; height:auto; display:block; margin:0 auto;"></div>`:''}${(s.fields||[]).map((f,i)=>`<div class="question-block" data-index="${i}">${f.q?`<div class="q-title">${esc(f.q)}</div>`:''}${renderFieldInput(s,st,f,i)}</div>`).join('')}<div class="nav-row"><button class="btn" type="button" data-nav="prev">前へ</button><button class="btn" type="button" data-nav="next">次へ</button></div>`;document.getElementById('app').innerHTML='';document.getElementById('app').appendChild(card);bindNav();}
function renderFieldInput(s,st,f,i){if(f.kind==='choice')return `<div class="options-grid">${(f.options||[]).map((o,idx)=>`<button type="button" class="opt-btn ${st.answers[i]===o?'selected':''}" data-field="${i}" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;if(f.kind==='tf')return `<div class="options-grid">${['〇','×'].map((o,idx)=>`<button type="button" class="opt-btn ${st.answers[i]===o?'selected':''}" data-field="${i}" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;if(f.kind==='multiChoice')return `<div class="options-vertical">${(f.answers||[]).map((o,idx)=>`<button type="button" class="opt-btn-v ${st.answers[`${i}_${o}`]?'selected':''}" data-field="${i}" data-key="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;return `<input class="text-input" type="text" data-field="${i}" value="${esc(st.answers[i]||'')}" placeholder="解答を入力">`;}
function bindNav(){document.querySelectorAll('[data-nav]').forEach(btn=>btn.onclick=()=>{const dir=btn.dataset.nav;const next=dir==='next'?Math.min(sections.length-1,screen+1):Math.max(0,screen-1);renderQuestion(next);});document.querySelectorAll('.opt-btn').forEach(btn=>btn.onclick=()=>{const field=Number(btn.dataset.field);const value=btn.dataset.value;const s=sections[screen],st=state[screen];st.answers[field]=value;renderQuestion(screen);});document.querySelectorAll('.opt-btn-v').forEach(btn=>btn.onclick=()=>{const field=Number(btn.dataset.field);const key=btn.dataset.key;const s=sections[screen],st=state[screen];st.answers[`${field}_${key}`]=!st.answers[`${field}_${key}`];renderQuestion(screen);});document.querySelectorAll('.text-input').forEach(input=>input.oninput=()=>{const field=Number(input.dataset.field);const s=sections[screen],st=state[screen];st.answers[field]=input.value;});}
function earnedField(s,st,i){const f=s.fields[i];if(f.kind==='tf')return(['〇','×'][st.answers[i]]===f.answer?f.pts:0);if(f.kind==='choice')return(st.answers[i]===f.answer?f.pts:0);if(f.kind==='multiChoice'){const answers=f.answers||[];const selectedCount=answers.filter(j=>st.answers[`${i}_${j}`]).length;return(selectedCount===answers.length&&answers.every(j=>st.answers[`${i}_${j}`]))?f.pts:0;}if(f.kind==='group')return(st.checks[i]?f.pts:0);if(f.kind==='essay'||f.kind==='text')return(st.checks[i]?f.pts:0);return 0}
function sectionScore(si){const s=sections[si],st=state[si];let score=s.fields.reduce((n,_,i)=>n+earnedField(s,st,i),0);if(s.table)score+=s.table.reduce((n,r,i)=>n+(st.checks[`table${i}`]?1:0),0);return score}
function gradeSection(si){const s=sections[si],st=state[si];if(s.table)s.table.forEach((r,i)=>{st.checks[`table${i}`]=st.answers[i]===r[3]});s.fields.forEach((f,i)=>{if(f.kind==='text'||f.kind==='essay')st.checks[i]=normalize(st.answers[i])===normalize(f.answer);if(f.kind==='group'){st.checks[i]=f.answers.every((a,j)=>normalize(st.answers[`${i}_${j}`])===normalize(a))}});renderResult(si)}
function renderResult(si){const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} 採点結果</h2>`;s.fields.forEach((f,i)=>{const userAnswer=st.answers[i] ?? '' ;const isCorrect=(f.kind==='choice' ? st.answers[i]===f.answer : (f.kind==='tf' ? ['〇','×'][st.answers[i]]===f.answer : st.checks[i]));const badge=isCorrect?'正解':'不正解';const answerText=f.kind==='choice'||f.kind==='tf'?`正解: ${f.answer}`:(f.kind==='Essay' ? '' : `正解: ${f.answer}`);card.innerHTML+=`<div class="result-item ${isCorrect?'result-correct':'result-wrong'}"><div class="badge">${badge}</div><div>${esc(f.q||`問題${i+1}`)}</div><div class="answer-key">あなたの解答：${esc(userAnswer)}<br> ${answerText}</div></div>`;});card.innerHTML+=`<div class="nav-row"><button class="btn" type="button" data-nav="prev">前へ</button><button class="btn" type="button" data-nav="next">次へ</button></div>`;document.getElementById('app').innerHTML='';document.getElementById('app').appendChild(card);bindNav();}
function renderFinal(){const total=sections.reduce((n,s,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総得点: ${total} / ${sections.reduce((n,s)=>n+s.max,0)}</div>`;document.getElementById('app').innerHTML='';document.getElementById('app').appendChild(card);} 
renderQuestion(0);
</script></body></html>
