{title:'Ⅵ 図の隠された部分',max:12,media:'https://hena-choco.github.io/2023-intermediateVI.png',items:[{q:'Ⅵ 下図の隠された部分の全文を書け。',manual:true,fields:[{answer:'カー',pts:12}]}]}
];
const state=sections.map(()=>({answers:{},choices:{},manual:{},score:0}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeText(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s　。、,，.！!「」『』（）()［］【】「」・:：\-‐‑‒–—]/g,'');}
function accepted(field){return [field.answer,...(field.aliases||[])].filter(Boolean)}
function matchUnordered(item,st,ii){const owner=Array(item.fields.length).fill(-1);const assign=(slot,seen)=>{const val=st.answers[`${ii}_${slot}`];for(let fi=0;fi<item.fields.length;fi++){if(seen.has(fi)||!accepted(item.fields[fi]).some(a=>normalizeText(a)===normalizeText(val)))continue;seen.add(fi);if(owner[fi]===-1||assign(owner[fi],seen)){owner[fi]=slot;return true}}return false};item.fields.forEach((_,slot)=>{if(String(st.answers[`${ii}_${slot}`]||'').trim())assign(slot,new Set())});const slotToField=Array(item.fields.length).fill(-1);let score=0;owner.forEach((slot,fi)=>{if(slot>=0){slotToField[slot]=fi;score+=item.fields[fi].pts}});return{slotToField,score}}
function fieldCorrect(field,value){return accepted(field).some(a=>normalizeText(a)===normalizeText(value))}
let current=0;
function renderQuestion(si){current=si;document.querySelectorAll('.screen').forEach(e=>e.remove());const section=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${esc(section.title)} <span class="muted">（${section.max}点満点）</span></h2><p class="muted">大問 ${si+1} / ${sections.length}</p>`;if(section.reading)card.insertAdjacentHTML('beforeend',`<div class="reading-text">${esc(section.reading)}</div>`);if(section.media)card.insertAdjacentHTML('beforeend',`<div class="image-container"><img src="${esc(section.media)}" alt="${esc(section.title)}の問題画像" loading="lazy"></div>`);section.items.forEach((item,ii)=>{const block=document.createElement('div');block.className='question-block';let html=`<div class="q-title">${esc(item.q)} <span class="muted">（${item.fields.reduce((a,f)=>a+f.pts,0)}点）</span></div>`;if(item.extra)html+=`<div class="reading-text">${esc(item.extra)}</div>`;item.fields.forEach((f,fi)=>{const lab=f.label?`<div class="field-label">${esc(f.label)}</div>`:'';if(f.kind==='choice')html+=`${lab}<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[`${ii}_${fi}`]===j?'selected':''}" data-choice="${ii}_${fi}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`;else html+=`${lab}<input class="text-input" data-answer="${ii}_${fi}" value="${esc(st.answers[`${ii}_${fi}`]||'')}" placeholder="回答を入力">`});block.innerHTML=html;card.appendChild(block)});const submit=document.createElement('button');submit.className='btn-submit';submit.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]}を採点する`;submit.onclick=()=>gradeSection(si);card.appendChild(submit);if(si>0){const back=document.createElement('button');back.className='btn-submit';back.textContent='前の大問に戻る';back.onclick=()=>renderResult(si-1);card.appendChild(back)}document.getElementById('quiz').appendChild(card);card.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('input',()=>{st.answers[el.dataset.answer]=el.value}));card.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{st.choices[el.dataset.choice]=Number(el.dataset.value);el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===el))}))}
function scoreItem(item,st,ii){if(item.unordered)return matchUnordered(item,st,ii).score;if(item.allOrNothing){const ok=item.fields.every((f,fi)=>f.kind==='choice'?st.choices[`${ii}_${fi}`]===f.key:fieldCorrect(f,st.answers[`${ii}_${fi}`]));return ok?item.fields.reduce((n,f)=>n+f.pts,0):0}return item.fields.reduce((n,f,fi)=>n+(f.kind==='choice'?(st.choices[`${ii}_${fi}`]===f.key?f.pts:0):item.manual?(Number(st.manual[`${ii}_${fi}`]||0)):fieldCorrect(f,st.answers[`${ii}_${fi}`])?f.pts:0),0)}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(el=>{st.answers[el.dataset.answer]=el.value});st.score=s.items.reduce((n,item,ii)=>n+scoreItem(item,st,ii),0);renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]} 採点結果</h2><p class="muted">${s.title}：${s.max}点満点</p>`;s.items.forEach((item,ii)=>{const points=scoreItem(item,st,ii),row=document.createElement('div');row.className=`result-item ${points?'result-correct':'result-incorrect'}`;let html=`<span class="res-badge">${item.manual?'自己採点 ':''}${points} / ${item.fields.reduce((n,f)=>n+f.pts,0)}点</span><div><strong>${esc(item.q)}</strong></div>`;if(item.extra)html+=`<div class="reading-text">${esc(item.extra)}</div>`;let unordered=item.unordered?matchUnordered(item,st,ii):null;item.fields.forEach((f,fi)=>{const label=f.label?`${esc(f.label)} `:'';if(item.manual){html+=`<div class="self-eval-box"><div class="self-eval-title">模範解答</div><div>${esc(f.answer)}</div><label class="field-label" for="score-${si}-${ii}-${fi}">自己採点（${f.pts}点満点）</label><select class="score-select" id="score-${si}-${ii}-${fi}" data-manual="${ii}_${fi}">${Array.from({length:f.pts+1},(_,n)=>`<option value="${n}" ${Number(st.manual[`${ii}_${fi}`]||0)===n?'selected':''}>${n}点</option>`).join('')}</select></div><div class="answer-line">あなたの回答：${esc(st.answers[`${ii}_${fi}`]||'未入力')}</div>`}else if(f.kind==='choice'){const val=st.choices[`${ii}_${fi}`];html+=`<div>${label}あなたの回答：${val===undefined?'未選択':esc(f.options[val])} ／ 正解：${esc(f.options[f.key])}</div>`}else{const val=st.answers[`${ii}_${fi}`]||'未入力';if(item.unordered){const found=unordered.slotToField[fi];html+=`<div>${label}あなたの回答：${esc(val)} ／ ${found>=0?`正解：${esc(item.fields[found].answer)}`:`正解例：${item.fields.map(x=>esc(x.answer)).join('、')}`}</div>`}else html+=`<div>${label}あなたの回答：${esc(val)} ／ 正解：${esc(f.answer)}</div>`}});if(!item.manual&&!item.unordered&&!item.allOrNothing&&item.fields.some(f=>f.kind!=='choice'&&!fieldCorrect(f,st.answers[`${ii}_${item.fields.indexOf(f)}`]))){/* correct answer is shown above */}if(item.allOrNothing&&points===0)html+=`<div>正解：${item.fields.map((f,i)=>`${f.label||`(${i+1})`}${f.kind==='choice'?f.options[f.key]:f.answer}`).join(' ／ ')}</div>`;row.innerHTML=html;card.appendChild(row);if(item.manual){row.querySelectorAll('[data-manual]').forEach(sel=>sel.addEventListener('change',()=>{st.manual[sel.dataset.manual]=Number(sel.value);st.score=s.items.reduce((n,x,j)=>n+scoreItem(x,st,j),0);row.querySelector('.res-badge').textContent=`自己採点 ${scoreItem(item,st,ii)} / ${item.fields.reduce((n,f)=>n+f.pts,0)}点`;document.getElementById('section-total').textContent=`${st.score} / ${s.max}点`}))}});card.insertAdjacentHTML('beforeend',`<div id="section-total" class="score-banner">大問得点：${st.score} / ${s.max}点</div>`);const back=document.createElement('button');back.className='btn-submit';back.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]}の回答に戻る`;back.onclick=()=>renderQuestion(si);card.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn-submit';next.textContent=`${['Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]}へ進む`;next.onclick=()=>renderQuestion(si+1);card.appendChild(next)}else{const final=document.createElement('button');final.className='btn-submit';final.textContent='最終結果を見る';final.onclick=renderFinal;card.appendChild(final)}document.getElementById('quiz').appendChild(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=state.reduce((n,st)=>n+st.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 200点<div class="pass-status">${total>=passMark?'合格':'不合格'}</div><div class="muted" style="color:#fff">合格基準：${passMark}点以上</div></div>`;sections.forEach((s,si)=>{const h=document.createElement('div');h.className='result-section-title';h.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]} ${s.title}：${state[si].score} / ${s.max}点`;card.appendChild(h)});const back=document.createElement('button');back.className='btn-submit';back.textContent='Ⅵの採点結果に戻る';back.onclick=()=>renderResult(5);card.appendChild(back);const list=document.createElement('a');list.className='btn-submit';list.href='https://hena-choco.github.io';list.textContent='問題一覧へ戻る';card.appendChild(list);document.getElementById('quiz').appendChild(card)}
renderQuestion(0);
</script>
