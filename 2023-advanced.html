const state=sections.map(()=>({answers:{},choices:{},manual:{},score:0}));
const romans=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()［］【】・:：\-‐‑‒–—]/g,'');
const accepted=f=>[f.answer,...(f.aliases||[])].filter(Boolean);
const fieldCorrect=(f,value)=>accepted(f).some(a=>norm(a)===norm(value));
function matchUnordered(item,st,ii){
  const slotToField=Array(item.fields.length).fill(-1),used=new Set();let score=0;
  item.fields.forEach((_,slot)=>{const value=st.answers[`${ii}_${slot}`]||'';const found=item.fields.findIndex((f,fi)=>!used.has(fi)&&fieldCorrect(f,value));if(found>=0){used.add(found);slotToField[slot]=found;score+=item.fields[found].pts;}});
  return{slotToField,score};
}
function itemScore(item,st,ii){
  if(item.unordered)return matchUnordered(item,st,ii).score;
  if(item.allOrNothing){const correct=item.fields.every((f,fi)=>f.kind==='choice'?st.choices[`${ii}_${fi}`]===f.key:fieldCorrect(f,st.answers[`${ii}_${fi}`]));return correct?item.fields.reduce((n,f)=>n+f.pts,0):0;}
  return item.fields.reduce((n,f,fi)=>{
    if(f.kind==='choice')return n+(st.choices[`${ii}_${fi}`]===f.key?f.pts:0);
    return n+Number(st.manual[`${ii}_${fi}`]||0);
  },0);
}
function renderQuestion(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const section=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';
  card.innerHTML=`<h2>${esc(section.title)} <span class="points">（${section.max}点満点）</span></h2>`;
  if(section.reading)card.insertAdjacentHTML('beforeend',`<div class="reading">${esc(section.reading)}</div>`);
  if(section.media)card.insertAdjacentHTML('beforeend',`<img class="quiz-image" src="${esc(section.media)}" alt="${esc(section.title)}の問題画像">`);
  section.items.forEach((item,ii)=>{const block=document.createElement('div');block.className='question-block';const pts=item.fields.reduce((n,f)=>n+f.pts,0);let html=`<div class="q-title">${esc(item.q)} <span class="points">（${pts}点）</span></div>`;
    if(item.extra)html+=`<div class="reading">${esc(item.extra)}</div>`;
    if(item.media)html+=`<img class="quiz-image" src="${esc(item.media)}" alt="${esc(item.q)}">`;
    item.fields.forEach((f,fi)=>{const label=f.label?`<div class="q-title" style="margin-top:10px">${esc(f.label)}</div>`:'';if(f.kind==='choice')html+=`${label}<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[`${ii}_${fi}`]===j?'selected':''}" data-choice="${ii}_${fi}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`;else html+=`${label}<input class="text-input" type="text" data-answer="${ii}_${fi}" value="${esc(st.answers[`${ii}_${fi}`]||'')}" placeholder="回答を入力">`});
    block.innerHTML=html;card.appendChild(block);
  });
  const nav=document.createElement('div');nav.className='nav-row';if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.appendChild(spacer)}const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);document.getElementById('quiz').appendChild(card);
  card.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.choices[b.dataset.choice]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[x.dataset.answer]=x.value);
}
function gradeSection(si){const section=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[x.dataset.answer]=x.value);st.score=section.items.reduce((n,item,ii)=>n+itemScore(item,st,ii),0);renderResult(si)}
function renderResult(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const section=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${romans[si]} 採点結果</h2>`;
  section.items.forEach((item,ii)=>{const points=itemScore(item,st,ii),max=item.fields.reduce((n,f)=>n+f.pts,0),row=document.createElement('div');row.className='result-item';let html=`<span class="badge">${item.manual?'自己採点：':''}${points} / ${max}点</span><div><strong>${esc(item.q)}</strong></div>`;if(item.extra)html+=`<div class="answer-key">${esc(item.extra)}</div>`;if(item.media)html+=`<img class="quiz-image" src="${esc(item.media)}" alt="${esc(item.q)}">`;
    const unordered=item.unordered?matchUnordered(item,st,ii):null;
    item.fields.forEach((f,fi)=>{const key=`${ii}_${fi}`,label=f.label?`${esc(f.label)}：`:'';if(f.kind==='choice'){const selected=st.choices[key];html+=`<div class="answer-key">${label}あなたの回答：${selected===undefined?'未選択':esc(f.options[selected])}<br>正解：${esc(f.options[f.key])}</div>`;}else if(item.unordered){const val=st.answers[key]||'未入力',match=unordered.slotToField[fi];html+=`<div class="answer-key">${label}あなたの回答：${esc(val)}<br>${match>=0?`正解：${esc(item.fields[match].answer)}`:`正解例：${item.fields.map(x=>esc(x.answer)).join('、')}`}</div>`;}else{const val=st.answers[key]||'未入力';html+=`<div class="answer-key">${label}あなたの回答：${esc(val)}<br>模範解答：${esc(f.answer)}</div>`;if(!item.allOrNothing){const awarded=Number(st.manual[key]||0);html+=`<label class="self-check"><input type="checkbox" data-manual="${key}" ${awarded?'checked':''}> 模範解答と同等の内容を書けていた（${f.pts}点）</label>`;}}});
    if(item.allOrNothing){html+=`<div class="answer-key">全て正解の場合のみ得点：${item.fields.map((f,fi)=>`${esc(f.label||`(${fi+1})`)} ${f.kind==='choice'?esc(f.options[f.key]):esc(f.answer)}`).join(' ／ ')}</div>`;}
    row.innerHTML=html;const isManual=item.fields.some((f,fi)=>f.kind!=='choice'&&!item.unordered&&!item.allOrNothing&&Number(st.manual[`${ii}_${fi}`]||0)>0);row.classList.add(points===max&&max>0?'result-correct':points===0?'result-wrong':'result-pending');card.appendChild(row);
    row.querySelectorAll('[data-manual]').forEach(check=>check.onchange=()=>{st.manual[check.dataset.manual]=check.checked?item.fields[Number(check.dataset.manual.split('_')[1])].pts:0;st.score=section.items.reduce((n,x,j)=>n+itemScore(x,st,j),0);const current=itemScore(item,st,ii);row.classList.toggle('result-correct',current===max&&max>0);row.classList.toggle('result-wrong',current===0);row.classList.toggle('result-pending',current>0&&current<max);row.querySelector('.badge').textContent=`${current} / ${max}点`;document.getElementById('section-total').textContent=`大問得点：${st.score} / ${section.max}点`});
  });
  card.insertAdjacentHTML('beforeend',`<div class="score-banner" id="section-total">大問得点：${st.score} / ${section.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn';next.textContent='次の大問 →';next.onclick=()=>renderQuestion(si+1);nav.appendChild(next)}else{const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.appendChild(final)}card.appendChild(nav);document.getElementById('quiz').appendChild(card);
}
let finalScoreSavePromise=null,finalScoreSaved=false;
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 200点<br><span style="font-size:1rem">${total>=passMark?'合格':'不合格'}（合格基準：${passMark}点以上）</span></div>`;sections.forEach((s,i)=>{const line=document.createElement('div');line.className='summary-title';line.textContent=`${romans[i]} ${s.title.replace(/^[ⅠⅡⅢⅣⅤⅥ]\s*/, '')}：${state[i].score} / ${s.max}点`;card.appendChild(line)});const account=document.createElement('section');account.className='account-card';account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.appendChild(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card);setupFinalAccount(total)}
function setupFinalAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数を自動保存しています…';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2023-advanced',quizTitle:'ドラえもん検定 2023年度 上級問題',score:total,total:200,passThreshold}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{if(mode==='register')await window.DoraemonAuth.register($('account-email').value.trim(),$('account-password').value);else await window.DoraemonAuth.login($('account-email').value.trim(),$('account-password').value);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const messages={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(messages[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error('Firebase auth state error',error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')})}
