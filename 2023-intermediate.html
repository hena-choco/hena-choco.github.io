  if(f.type==='tf')html+=`<div class="options-grid">${['〇','×'].map((o,j)=>`<button type="button" class="opt-btn ${st.answers[ii]===j?'selected':''}" data-choice="${ii}" data-value="${j}">${o}</button>`).join('')}</div>`;
  else if(f.type==='choice')html+=`<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[ii]===j?'selected':''}" data-choice="${ii}" data-value="${j}">${j+1}. ${esc(o)}</button>`).join('')}</div>`;

 const nav=document.createElement('div');nav.className='nav-row';if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.appendChild(spacer)}const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);document.getElementById('quiz').appendChild(card);
 card.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.answers[Number(b.dataset.choice)]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});

function valueOf(st,ii,fi){return st.answers[fieldKey(ii,fi)]||''}
function acceptedAnswers(p){return [...(p.accepted||[]),p.answer,...(p.aliases||[])].filter(Boolean)}
function correctField(p,st,ii,fi){return p.type==='choice'?st.choices[fieldKey(ii,fi)]===p.answer:matches(valueOf(st,ii,fi),acceptedAnswers(p))}
function itemScore(f,st,ii){if(f.type==='tf')return ['〇','×'][st.answers[ii]]===f.answer?f.pts:0;if(f.type==='choice')return st.choices[ii]===f.answer?f.pts:0;if(f.type==='group'){const used=new Set();return f.parts.reduce((n,p,pi)=>{if(p.type==='choice')return n+(correctField(p,st,ii,pi)?p.pts:0);const answer=valueOf(st,ii,pi),candidate=(p.aliases||[p.answer]).find(a=>normalize(a)===normalize(answer));if(!st.checks[fieldKey(ii,pi)]||(!f.manual&&!candidate))return n;if(f.distinct&&used.has(normalize(candidate)))return n;used.add(normalize(candidate));return n+p.pts},0)}if(f.type==='self')return st.checks[ii]?f.pts:0return 0}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer], .screen [data-item]').forEach(x=>{const key=x.dataset.part===undefined?Number(x.dataset.answer):`${x.dataset.item}_${x.dataset.part}`;st.answers[key]=x.value});s.fields.forEach((f,ii)=>{if(f.type==='self'&&matches(st.answers[ii],[f.answer,...(f.aliases||[])]))st.checks[ii]=true;if(f.type==='group')f.parts.forEach((p,pi)=>{if(p.type!=='choice'&&matches(valueOf(st,ii,pi),acceptedAnswers(p)))st.checks[fieldKey(ii,pi)]=true})});st.score=s.fields.reduce((n,f,ii)=>n+itemScore(f,st,ii),0);renderResult(si)}
function updateSection(si){const s=sections[si],st=state[si];st.score=s.fields.reduce((n,f,ii)=>n+itemScore(f,st,ii),0);document.getElementById('subtotal').textContent=st.score}
function renderResult(si){
 document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${roman[si]} 採点結果</h2>`;
 s.fields.forEach((f,ii)=>{const row=document.createElement('div');row.className='result-item';let body='',manual=false;
  if(f.type==='tf'){const val=st.answers[ii],ok=['〇','×'][val]===f.answer;body=`<span class="badge">${ok?'✓ 正解':'× 不正解'}（${ok?f.pts:0}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${val===undefined?'未選択':['〇','×'][val]}<br>正解：${esc(f.answer)}</div>`;row.classList.add(ok?'result-correct':'result-wrong')}
  else if(f.type==='choice'){const ok=st.choices[ii]===f.answer;body=`<span class="badge">${ok?'✓ 正解':'× 不正解'}（${ok?f.pts:0}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${st.choices[ii]===undefined?'未選択':esc(f.options[st.choices[ii]])}<br>正解：${esc(f.options[f.answer])}</div>`;row.classList.add(ok?'result-correct':'result-wrong')}
  else if(f.type==='group'){
   const earned=itemScore(f,st,ii);manual=f.parts.some(p=>p.type!=='choice');body=`<span class="badge">${manual?'自己採点：':''}${earned}/${f.pts}点</span><div><strong>${esc(f.q)}</strong></div>`;
   f.parts.forEach((p,pi)=>{const k=fieldKey(ii,pi),label=p.q||p.label||'';if(p.type==='choice'){const ok=correctField(p,st,ii,pi);body+=`<div class="answer-key">${esc(label)}：あなたの回答：${st.choices[k]===undefined?'未選択':esc(p.options[st.choices[k]])} ／ 正解：${esc(p.options[p.answer])}</div>`}else{body+=`<div class="answer-key">${esc(label)}：あなたの回答：${esc(valueOf(st,ii,pi)||'未入力')}<br>模範解答：${esc(p.answer)}</div><label class="self-check"><input type="checkbox" data-check="${ii}_${pi}" ${st.checks[k]?'checked':''}> 模範解答と同等の内容を書けていた（${p.pts}点）</label>`}});
   row.classList.add(earned===f.pts?'result-correct':earned===0?'result-pending':'result-pending');
  }else{
   const val=st.answers[ii]||'',earned=itemScore(f,st,ii);manual=true;
   body=`<span class="badge">自己採点：${earned}/${f.pts}点</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${esc(val||'未入力')}<br>模範解答：${esc(f.answer)}</div><label class="self-check"><input type="checkbox" data-check="${ii}" ${st.checks[ii]?'checked':''}> 模範解答と同等の内容を書けていた（${f.pts}点）</label>`;
   row.classList.add(earned?'result-correct':'result-pending');
  }
  row.innerHTML=body;card.appendChild(row);row.querySelectorAll('[data-check]').forEach(ch=>ch.onchange=()=>{const key=ch.dataset.check.includes('_')?ch.dataset.check:Number(ch.dataset.check);if(ch.dataset.check.includes('_'))st.checks[key]=ch.checked;else st.checks[key]=ch.checked;updateSection(si);const pnt=itemScore(f,st,ii),max=f.pts??f.parts.reduce((n,p)=>n+p.pts,0);row.classList.toggle('result-correct',pnt===max);row.classList.toggle('result-pending',pnt<max);const badge=row.querySelector('.badge');if(badge)badge.textContent=`自己採点：${pnt}/${max}点`});
 });
 card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${st.score}</span> / ${s.actualMax??s.max}点${s.actualMax?`<div class="muted" style="color:#fff">（配点表の記載：${s.max}点）</div>`:''}</div>`);
 const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn';next.textContent='次の大問 →';next.onclick=()=>renderQuestion(si+1);nav.appendChild(next)}else{const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.appendChild(final)}card.appendChild(nav);document.getElementById('quiz').appendChild(card)
}
let finalScoreSavePromise=null,finalScoreSaved=false;
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 100点<br><span style="font-size:1rem">${total>=60?'合格':'不合格'}（合格点：60点）</span></div>`;sections.forEach((s,i)=>{const d=document.createElement('div');d.className='summary-title';d.textContent=`${roman[i]} ${s.title.replace(/^[ⅠⅡⅢⅣⅤⅥⅦ]\s*/, '')}：${state[i].score} / ${s.actualMax??s.max}点${s.actualMax?`（原文の記載：${s.max}点）`:''}`;card.appendChild(d)});const account=document.createElement('section');account.className='account-card';account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.appendChild(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card);setupFinalAccount(total)}
function setupFinalAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数を自動保存しています…';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2023-intermediate',quizTitle:'ドラえもん検定（中級問題）2023年度',score:total,total:100,passThreshold:60}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{if(mode==='register')await window.DoraemonAuth.register($('account-email').value.trim(),$('account-password').value);else await window.DoraemonAuth.login($('account-email').value.trim(),$('account-password').value);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const m={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(m[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error(error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')})}
