  if(f.type==='group'){
    return f.parts.reduce((sum,p,pi)=>{
      const key = fieldKey(ii, pi);
      if(p.type==='choice') return sum + (st.choices[key]===p.answer ? (p.pts||1) : 0);
      return sum + (matches(valueOf(st,ii,pi), acceptedAnswers(p)) ? (p.pts||1) : 0);
    },0);
  }
  const raw = st.answers[ii] ?? '';
  return matches(raw, acceptedAnswers(f)) ? (f.pts||1) : 0;
}
function gradeSection(si){const s=sections[si],st=state[si];st.score=s.fields.reduce((n,f,ii)=>n+itemScore(f,st,ii),0);}
function updateSection(si){gradeSection(si);document.getElementById('subtotal').textContent=state[si].score;}
function renderResult(si){
 document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';
 card.innerHTML=`<h2>${roman[si]} 採点結果</h2>`;
 s.fields.forEach((f,ii)=>{const row=document.createElement('div');row.className='result-item';let body='',manual=false;
  if(f.type==='tf'){const val=st.answers[ii],ok=['〇','×'][val]===f.answer;body=`<span class="badge">${ok?'✓ 正解':'× 不正解'}（${ok?f.pts:0}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${esc(['〇','×'][val]??'未入力')}<br>正解：${esc(f.answer)}</div>`;row.classList.add(ok?'result-correct':'result-pending');}
  else if(f.type==='choice'){const ok=st.choices[ii]===f.answer;body=`<span class="badge">${ok?'✓ 正解':'× 不正解'}（${ok?f.pts:0}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${esc(f.options[st.choices[ii]]??'未入力')}<br>正解：${esc(f.options[f.answer])}</div>`;row.classList.add(ok?'result-correct':'result-pending');}
  else if(f.type==='group'){
   const earned=itemScore(f,st,ii);manual=f.parts.some(p=>p.type!=='choice');body=`<span class="badge">${manual?'自己採点：':''}${earned}/${f.pts}点</span><div><strong>${esc(f.q)}</strong></div>`;
   f.parts.forEach((p,pi)=>{const label=p.q||p.label||'';const key=fieldKey(ii,pi);if(p.type==='choice'){const ok=correctField(p,st,ii,pi);body+=`<div class="answer-key">${esc(label)}：あなたの回答：${esc(p.options[st.choices[key]]??'未入力')} / 正解：${esc(p.options[p.answer])}</div>`;}else{const val=valueOf(st,ii,pi);body+=`<div class="answer-key">${esc(label)}：あなたの回答：${esc(val||'未入力')}<br>模範解答：${esc(p.answer)}</div>`;}});row.classList.add(earned===f.pts?'result-correct':'result-pending');
  }else{
   const val=st.answers[ii]||'',earned=itemScore(f,st,ii);manual=true;body=`<span class="badge">自己採点：${earned}/${f.pts}点</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${esc(val||'未入力')}<br>模範解答：${esc(f.answer)}</div>`;row.classList.add(earned?'result-correct':'result-pending');
  }
  row.innerHTML=body;card.appendChild(row);
 });
 const total=state.reduce((n,x)=>n+x.score,0);card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${st.score}</span> / ${s.max}点</div>`);
 const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);const final=document.createElement('button');final.className='btn';final.textContent='総合成績を見る →';final.onclick=()=>renderFinal();nav.appendChild(final);card.appendChild(nav);
}
let finalScoreSavePromise=null,finalScoreSaved=false;
function renderFinal(){
 document.querySelectorAll('.screen').forEach(e=>e.remove());
 const total=state.reduce((n,x)=>n+x.score,0);
 const card=document.createElement('section');card.className='card screen';
 card.innerHTML=`<h2>総合成績</h2><div class="score-banner">総得点：${total} / 100点</div>`;
 const summary=document.createElement('div');summary.className='summary-title';summary.textContent='大問別の得点';card.appendChild(summary);
 state.forEach((st,idx)=>{
   const row=document.createElement('div');row.className='result-item';row.innerHTML=`<strong>${roman[idx]}</strong>：${st.score}点`;
   card.appendChild(row);
 });
 const accountCard=document.createElement('div');accountCard.className='account-card';accountCard.innerHTML=`<h2>成績保存</h2><div id="account-status" class="account-status"></div><form id="account-form" class="account-form"><label>名前<input id="account-name" type="text" maxlength="40" placeholder="例：ドラえもん太郎"></label><label>メールアドレス<input id="account-email" type="email" placeholder="例：example@example.com"></label><div class="account-actions"><button class="account-button primary" type="submit">成績を保存</button><button id="reset-account" class="account-button secondary" type="button">やり直す</button></div></form>`;card.appendChild(accountCard);
 document.getElementById('quiz').appendChild(card);
}
renderQuestion(0);
</script>
