<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ドラえもん検定（中級問題）2023年度</title>
  <meta name="description" content="ドラえもん検定2023年度中級の全問に挑戦。選択問題は自動採点、記述問題は自己採点できます。" />
  <link rel="icon" href="https://hena-choco.github.io/favicon.png" type="image/png" />
  <style>
    :root {
      --main: #6b9dff;
      --bg: #f4f7f9;
      --card: #fff;
      --text: #333;
      --muted: #666;
      --line: #dfe8f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 12px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    .site-nav {
      margin-bottom: 12px;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--main);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }
    header {
      background: var(--main);
      color: white;
      text-align: center;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 18px;
    }
    h2 { margin: 0 0 12px; font-size: 1.12rem; }
    .question-block {
      border-bottom: 1px dashed #e5e5e5;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .question-block:last-child { border-bottom: 0; margin-bottom: 0; }
    .q-title {
      font-weight: 700;
      margin-bottom: 8px;
      white-space: pre-line;
    }
    .points { color: var(--muted); font-size: .88rem; font-weight: 400; }
    .options-grid {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .opt-btn, .opt-btn-v {
      border: 2px solid var(--main);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .opt-btn {
      flex: 1;
      padding: 12px;
      color: var(--main);
      font-size: 1.1rem;
    }
    .opt-btn-v {
      width: 100%;
      padding: 12px 14px;
      text-align: left;
      color: var(--text);
    }
    .opt-btn.selected, .opt-btn-v.selected {
      background: var(--main);
      color: #fff;
    }
    .text-input {
      width: 100%;
      padding: 11px;
      border: 2px solid var(--main);
      border-radius: 8px;
      font: inherit;
      margin-top: 5px;
    }
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: var(--main);
      color: white;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .nav-placeholder {
      visibility: hidden;
    }
    .result-box {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #f7f8fa;
      margin: 10px 0;
    }
    .score-banner {
      margin-top: 16px;
      background: var(--main);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
    }
    @media (max-width: 480px) {
      body { padding: 12px 8px; }
      .card { padding: 16px; }
      .nav-row { gap: 7px; }
      .btn { padding: 12px 8px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="site-nav" aria-label="サイトナビゲーション">
      <a class="home-link" href="https://hena-choco.github.io/index.html">← 一覧に戻る</a>
    </nav>
    <header>
      <h1>ドラえもん検定（中級問題）2023年度</h1>
    </header>
    <div id="quiz"></div>
  </main>

  <script type="module">
    import "./firebase-auth.js";

    const sections = [
      {
        title: "Ⅰ 次の文を読み、正しいものには〇、間違っているものには×をつけよ",
        max: 5,
        fields: [
          { q: "問1. ドラえもんはかつて日本テレビ系列で放送されていたことがある。", type: "tf", answer: "〇", pts: 1 },
          { q: "問2. 「あべこべ惑星」という話ではスカートを履いているのび太が登場する。", type: "tf", answer: "〇", pts: 1 },
          { q: "問3. 「自動販売タイムマシン」にて、のび太がカメラを買おうとして設定した時代は平安時代である。", type: "tf", answer: "×", pts: 1 },
          { q: "問4. ドラミのタイムマシンはドラえもんのタイムマシンと同じ形である。", type: "tf", answer: "×", pts: 1 },
          { q: "問5. のび太のお父さんの子どもの頃の夢は画家になることであった。", type: "tf", answer: "〇", pts: 1 }
        ]
      },
      {
        title: "Ⅱ 以下の問題について、解答として最も適切な選択肢を一つ選びなさい",
        max: 20,
        fields: [
          { q: "問1. のび太が初めてタケコプターを使ったとき、体のどこにつけたか。", type: "choice", options: ["お尻", "頭", "おなか", "背中"], answer: 0, pts: 2 },
          { q: "問2. ドラえもんがのび太と出会ってから初めて食べたものは何か。", type: "choice", options: ["どら焼き", "メロンパン", "餅", "焼き芋"], answer: 2, pts: 2 },
          { q: "問3. ドラえもんを現在放送している放送局はどこか。", type: "choice", options: ["日本テレビ系列", "テレビ朝日系列", "TBS系列", "フジテレビ系列"], answer: 1, pts: 2 },
          { q: "問4. 子供時代ののび太のパパにチョコレートをあげた、白ゆりのような女の子の正体は誰か。", type: "choice", options: ["のび太のママ", "のび太", "しずか", "ジャイアン"], answer: 2, pts: 2 },
          { q: "問5. 「帰ってきたドラえもん」において、ドラえもんが帰ってくるきっかけとなった道具は何か。", type: "choice", options: ["もしもボックス", "どこでもドア", "トランポリン", "遠くへ行く機械"], answer: 0, pts: 2 }
        ]
      },
      {
        title: "Ⅲ 自由記述問題",
        max: 10,
        fields: [
          { q: "問1. ドラえもんが生まれた工場の名前は何か。", type: "self", answer: "マツシバ工場", pts: 2 },
          { q: "問2. のび太の特技を4つ答えよ。", type: "self", answer: "昼寝・あやとり・射撃・ピーナッツの投げ食い", pts: 4 },
          { q: "問3. ドラえもんの体の色はどの色に近いか。", type: "choice", options: ["青", "赤", "黄色", "緑"], answer: 2, pts: 2 },
          { q: "問4. しずかちゃんの家族構成で、正しいものを1つ選べ。", type: "choice", options: ["父・母・しずか", "祖父・祖母・しずか", "母・兄・しずか", "父・母・兄弟"], answer: 0, pts: 2 }
        ]
      }
    ];

    const state = sections.map(() => ({ answers: {}, choices: {}, score: 0 }));
    const roman = ["Ⅰ", "Ⅱ", "Ⅲ"];

    function esc(value) {
      return String(value ?? "").replace(/[&<>\"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderQuestion(sectionIndex) {
      const renderRoot = document.getElementById("quiz");
      renderRoot.innerHTML = "";

      const section = sections[sectionIndex];
      const sectionState = state[sectionIndex];
      const card = document.createElement("section");
      card.className = "card screen";

      const header = document.createElement("h2");
      header.innerHTML = `${roman[sectionIndex]} ${esc(section.title)} <span class="points">（${section.max}点満点）</span>`;
      card.appendChild(header);

      section.fields.forEach((field, fieldIndex) => {
        const block = document.createElement("div");
        block.className = "question-block";

        let html = `<div class="q-title">${esc(field.q)} <span class="points">（${field.pts ?? 0}点）</span></div>`;

        if (field.type === "tf") {
          html += `<div class="options-grid">${["〇", "×"].map((opt, optIndex) => `
            <button type="button" class="opt-btn ${sectionState.answers[fieldIndex] === optIndex ? "selected" : ""}" data-choice="${fieldIndex}" data-value="${optIndex}">${opt}</button>
          `).join("")}</div>`;
        } else if (field.type === "choice") {
          html += `<div class="options-vertical">${field.options.map((opt, optIndex) => `
            <button type="button" class="opt-btn-v ${sectionState.choices[fieldIndex] === optIndex ? "selected" : ""}" data-choice="${fieldIndex}" data-value="${optIndex}">${esc(opt)}</button>
          `).join("")}</div>`;
        } else {
          html += `<input class="text-input" type="text" data-answer="${fieldIndex}" value="${esc(sectionState.answers[fieldIndex] || "")}" placeholder="回答を入力">`;
        }

        block.innerHTML = html;
        card.appendChild(block);
      });

      const nav = document.createElement("div");
      nav.className = "nav-row";

      if (sectionIndex > 0) {
        const prev = document.createElement("button");
        prev.type = "button";
        prev.className = "btn";
        prev.textContent = "← 前の大問";
        prev.onclick = () => renderQuestion(sectionIndex - 1);
        nav.appendChild(prev);
      } else {
        const spacer = document.createElement("div");
        spacer.className = "btn nav-placeholder";
        nav.appendChild(spacer);
      }

      const next = document.createElement("button");
      next.type = "button";
      next.className = "btn";
      next.textContent = sectionIndex < sections.length - 1 ? "次の大問 →" : "採点結果を見る →";
      next.onclick = () => {
        if (sectionIndex < sections.length - 1) {
          renderQuestion(sectionIndex + 1);
        } else {
          renderResult();
        }
      };
      nav.appendChild(next);

      card.appendChild(nav);
      renderRoot.appendChild(card);

      card.querySelectorAll("[data-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = Number(button.dataset.choice);
          const value = Number(button.dataset.value);
          sectionState.answers[key] = value;
          sectionState.choices[key] = value;
          button.parentElement.querySelectorAll("button").forEach((btn) => btn.classList.toggle("selected", btn === button));
        });
      });

      card.querySelectorAll("[data-answer]").forEach((input) => {
        input.addEventListener("input", () => {
          const key = Number(input.dataset.answer);
          sectionState.answers[key] = input.value;
        });
      });
    }

    function scoreSection(sectionIndex) {
      const section = sections[sectionIndex];
      const sectionState = state[sectionIndex];
      let total = 0;

      section.fields.forEach((field, fieldIndex) => {
        if (field.type === "tf") {
          const chosen = Number(sectionState.answers[fieldIndex]);
          const answerValue = ["〇", "×"][chosen];
          if (answerValue === field.answer) total += field.pts;
        } else if (field.type === "choice") {
          if (sectionState.choices[fieldIndex] === field.answer) total += field.pts;
        } else {
          const answer = String(sectionState.answers[fieldIndex] ?? "").trim();
          const accepted = [field.answer].flatMap((v) => [v, String(v).replace(/\s+/g, "")]);
          if (accepted.some((v) => answer === v || answer.replace(/\s+/g, "") === v.replace(/\s+/g, ""))) total += field.pts;
        }
      });

      sectionState.score = total;
      return total;
    }

    function renderResult() {
      const renderRoot = document.getElementById("quiz");
      renderRoot.innerHTML = "";

      let overall = 0;
      sections.forEach((_, index) => {
        overall += scoreSection(index);
      });

      const totalCard = document.createElement("section");
      totalCard.className = "card";
      totalCard.innerHTML = `<div class="score-banner">総得点：${overall} / 100点</div>`;

      sections.forEach((section, index) => {
        const box = document.createElement("div");
        box.className = "result-box";
        box.innerHTML = `<strong>${roman[index]}</strong>：${state[index].score} 点`;
        totalCard.appendChild(box);
      });

      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "btn";
      retry.textContent = "もう一度解く";
      retry.onclick = () => renderQuestion(0);
      totalCard.appendChild(retry);

      renderRoot.appendChild(totalCard);
    }

    renderQuestion(0);
  </script>
</body>
</html>
