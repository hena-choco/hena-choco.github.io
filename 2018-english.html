Pocket (四次元ポケット)","aliases":["四次元ポケット","Fourth-Dimensional Pocket","Fourth Dimensional Pocket","4D Pocket"],"pts":5},{"q":"(2) If you open this door with a place you want to go in mind, you can quickly go to various places.","type":"self","answer":"Anywhere Door (どこでもドア)","aliases":["どこでもドア","Anywhere Door","Doko Demo Door","Dokodemo Door"],"pts":5},{"q":"(3) When you eat this gadget, you will be able to understand foreign languages.","type":"self","answer":"Translation Gummy (ほんやくコンニャク)","aliases":["ほんやくコンニャク","翻訳コンニャク","Translation Gummy","Translation Konjac","Honyaku Konnyaku"],"pts":5},{"q":"(4) You can shoot a bullet of air by putting on this gadget on your hand and saying “BAM”.","type":"self","answer":"Air Cannon (空気砲)","aliases":["空気砲","Air Cannon","Air Gun"],"pts":5},{"q":"(5) If you wrap items or animals with this gadget, it will go forward or back in time.","type":"self","answer":"Time Kerchief (タイムふろしき)","aliases":["タイムふろしき","タイム風呂敷","Time Kerchief","Time Cloth","Time Furoshiki"],"pts":5}]},{"title":"4","max":25,"reading":"4 Write the appropriate answer to each following question.","fields":[{"q":"(1) Which part of his body did Doraemon have bitten by a rat?","type":"self","answer":"Ears","aliases":["ear","ears"],"pts":5},{"q":"(2) What instrument is Sue poor at playing?","type":"self","answer":"Violin","aliases":["violin"],"pts":5},{"q":"(3) Who is the Noby's grandson's grandson that sent Doraemon from the future?","type":"self","answer":"Soby (Sewashi)","aliases":["Soby","Sewashi","セワシ","世修"],"pts":5},{"q":"(4) Where does Doraemon usually sleep in?","type":"self","answer":"Closet","aliases":["closet","the closet"],"pts":5},{"q":"(5) Please write down one of Nobita's special skills.","type":"self","answer":"Nap (siesta) / Cat’s cradle / (Gun) shooting — any one","aliases":["nap","siesta","cat’s cradle","cat cradle","shooting","gun shooting","射撃","あやとり","昼寝"],"pts":5}]}];
const state=sections.map(()=>({answers:{},checks:{},score:0}));
let finalScoreSavePromise=null,finalScoreSaved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・：:／\/'’\-]/g,'');
const matches=(v,answers=[])=>answers.some(a=>normalize(v)===normalize(a));
const optionText=(f,j)=>f.optionLabels?.[j]?`${f.optionLabels[j]}. ${f.options[j]}`:f.options[j];
function renderQuestion(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());
  const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';
  card.innerHTML=`<h2>大問 ${s.title} <span class="points">（${s.max}点満点）</span></h2><div class="reading">${esc(s.reading)}</div>`;
  s.fields.forEach((f,i)=>{
    const b=document.createElement('div');b.className='question-block';
    const title=document.createElement('div');title.className='q-title';title.innerHTML=`${esc(f.q)} <span class="points">（${f.pts}点）</span>`;b.append(title);
    if(f.type==='choice'){
      const wrap=document.createElement('div');wrap.className='options-vertical';
      f.options.forEach((o,j)=>{const x=document.createElement('button');x.type='button';x.className='opt-btn-v'+(st.answers[i]===j?' selected':'');x.textContent=optionText(f,j);x.onclick=()=>{st.answers[i]=j;wrap.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))};wrap.append(x)});b.append(wrap);
    }else{
      const input=document.createElement('input');input.className='text-input';input.type='text';input.dataset.answer=String(i);input.value=st.answers[i]||'';input.placeholder='回答を入力';b.append(input);
    }
    card.append(b);
  });
  const nav=document.createElement('div');nav.className='nav-row';
  if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.append(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.append(spacer)}
  const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.append(submit);card.append(nav);
  document.getElementById('quiz').append(card);card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[Number(x.dataset.answer)]=x.value);
}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[Number(x.dataset.answer)]=x.value);st.score=s.fields.reduce((n,f,i)=>n+(f.type==='choice'&&st.answers[i]===f.answer?f.pts:0),0);renderResult(si)}
function sectionScore(si){const s=sections[si],st=state[si];return s.fields.reduce((n,f,i)=>n+(f.type==='choice'?(st.answers[i]===f.answer?f.pts:0):(st.checks[i]?f.pts:0)),0)}
function renderResult(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} 採点結果</h2>`;
  s.fields.forEach((f,i)=>{
    const row=document.createElement('div');row.className='result-item';const manual=f.type==='self';let ok=false,user='',answer='';
    if(f.type==='choice'){ok=st.answers[i]===f.answer;user=st.answers[i]===undefined?'未選択':optionText(f,st.answers[i]);answer=optionText(f,f.answer)}
    else{user=st.answers[i]||'';answer=f.answer;if(matches(user,f.aliases||[f.answer]))st.checks[i]=true}
    const earned=manual?(st.checks[i]?f.pts:0):(ok?f.pts:0);row.classList.add(manual?(st.checks[i]?'result-correct':'result-pending'):(ok?'result-correct':'result-wrong'));

    card.append(row);if(manual)row.querySelector('[data-check]').onchange=ev=>{st.checks[i]=ev.target.checked;row.classList.toggle('result-correct',ev.target.checked);row.classList.toggle('result-pending',!ev.target.checked);row.querySelector('.badge').textContent=`自己採点（${ev.target.checked?f.pts:0}/${f.pts}点）`;document.getElementById('subtotal').textContent=sectionScore(si)};
  });

  const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.append(back);
  if(si<sections.length-1){const next=document.createElement('button');next.className='btn';next.textContent='次の大問 →';next.onclick=()=>renderQuestion(si+1);nav.append(next)}else{const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.append(final)}card.append(nav);document.getElementById('quiz').append(card);
}
function renderFinal(){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const total=sections.reduce((n,s,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 100点<br><span style="font-size:1rem">${total>=60?'合格':'不合格'}（合格点：60点）</span></div>`;

  saveCard.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数と解答を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;
  card.append(saveCard);document.getElementById('quiz').append(card);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.append(home);setupFinalAccount(total);
}
function setupFinalAccount(total){
  const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';
  const setStatus=(message,kind='')=>{status.textContent=message;status.dataset.kind=kind};
  const saveFinalScore=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数と解答は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;sections.forEach((section,i)=>{state[i].score=sectionScore(i)});const answers=window.DoraemonAuth.captureAnswers(sections,state);saveStatus.textContent='点数と解答を自動保存しています…';saveStatus.dataset.kind='';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2018-english',quizTitle:'ドラえもん検定 2018 English Version',score:total,total:100,passThreshold:60,answers}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数と解答を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数と解答を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};
  const setMode=next=>{mode=next;const registering=mode==='register';submit.textContent=registering?'アカウントを作成':'ログイン';$('switch-prompt').textContent=registering?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=registering?'ログイン':'新規アカウント作成';$('account-password').autocomplete=registering?'new-password':'current-password';setStatus(registering?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};

  form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{const email=$('account-email').value.trim(),password=$('account-password').value;if(mode==='register')await window.DoraemonAuth.register(email,password);else await window.DoraemonAuth.login(email,password);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const messages={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(messages[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}});
  $('logout-button').addEventListener('click',async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}});retry.addEventListener('click',saveFinalScore);
  window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');saveFinalScore()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数と解答を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error('Firebase auth state error',error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')});
}
renderQuestion(0);
</script>
