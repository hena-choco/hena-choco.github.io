    }else{
      user=st.answers[i]||'';
      if(matches(user,f.aliases||[f.answer])) st.checks[i]=true;
    }
    const earned=manual?(st.checks[i]?f.pts:0):(ok?f.pts:0);
    row.classList.add(manual?(st.checks[i]?'result-correct':'result-pending'):(ok?'result-correct':'result-wrong'));
    row.innerHTML=`<span class="badge">${manual?'自己採点':ok?'✓ 正解':'× 不正解'}（${earned}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${user?esc(user):'未入力'}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${i}" ${st.checks[i]?'checked':''}> ${f.complete?'すべての指定項目が合っていた':'模範解答と同等の内容を書けていた'}（${f.pts}点）</label>`:''}`;
    card.appendChild(row);
    if(manual) row.querySelector('[data-check]').onchange=ev=>{
      st.checks[i]=ev.target.checked;
      row.classList.toggle('result-correct',ev.target.checked);
      row.classList.toggle('result-pending',!ev.target.checked);
      document.getElementById('subtotal').textContent=sectionScore(si);
    };
  });
  card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${sectionScore(si)}</span> / ${s.max}点</div>`);
  const nav=document.createElement('div');nav.className='nav-row';
  const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);
  if(si<sections.length-1){
    const next=document.createElement('button');next.className='btn';next.textContent=`次の大問 →`;next.onclick=()=>renderQuestion(si+1);nav.appendChild(next);
  }else{
    const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.appendChild(final);
  }
  card.appendChild(nav);
  document.getElementById('quiz').appendChild(card);
}
function renderFinal(){
  document.querySelectorAll('.screen').forEach(e=>e.remove());
  const total=sections.reduce((n,s,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';
  card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 100点<br><span style="font-size:1rem">${total>=70?'合格':'不合格'}（合格点：70点）</span></div>`;
  sections.forEach((s,i)=>{const title=document.createElement('div');title.className='summary-title';title.textContent=`大問 ${s.title}：${sectionScore(i)} / ${s.max}点`;card.appendChild(title)});
  const saveCard=document.createElement('section');saveCard.className='account-card';saveCard.setAttribute('aria-labelledby','account-heading');
  saveCard.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;
  card.appendChild(saveCard);document.getElementById('quiz').appendChild(card);
  const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);
  setupFinalAccount(total);
}

function setupFinalAccount(total){
  const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');
  let mode='login';
  const setStatus=(message,kind='')=>{status.textContent=message;status.dataset.kind=kind};
  const saveFinalScore=async()=>{
    if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}
    if(finalScoreSavePromise)return finalScoreSavePromise;
    saveStatus.textContent='点数を自動保存しています…';saveStatus.dataset.kind='';
    finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2015-advanced',quizTitle:'ドラえもん検定 2015 上級',score:total,total:100,passThreshold:70})
      .then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'})
      .catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});
    return finalScoreSavePromise;
  };
  const setMode=next=>{mode=next;const registering=mode==='register';submit.textContent=registering?'アカウントを作成':'ログイン';$('switch-prompt').textContent=registering?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=registering?'ログイン':'新規アカウント作成';$('account-password').autocomplete=registering?'new-password':'current-password';setStatus(registering?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};
  $('switch-mode').addEventListener('click',()=>setMode(mode==='login'?'register':'login'));
  form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{const email=$('account-email').value.trim(),password=$('account-password').value;if(mode==='register')await window.DoraemonAuth.register(email,password);else await window.DoraemonAuth.login(email,password);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const messages={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(messages[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}});
  $('logout-button').addEventListener('click',async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}});
  retry.addEventListener('click',saveFinalScore);
  window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');saveFinalScore()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error('Firebase auth state error',error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')});
}
renderQuestion(0);
</script>
</body>
</html>
