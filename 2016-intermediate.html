<style>

.account-status[data-kind="error"] { color:#a33; }
.account-status[data-kind="success"] { color:#176b45; }
.account-form { display:grid; gap:10px; }
.account-form[hidden], [hidden] { display:none !important; }
.account-form label { display:grid; gap:4px; font-size:.9rem; font-weight:600; }
.account-form input { width:100%; padding:11px; border:1px solid #cfd6df; border-radius:7px; font:inherit; }

const state=sections.map(()=>({answers:{},checks:{},score:0}));
let finalScoreSavePromise=null,finalScoreSaved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・：:／]/g,'');
const matches=(value,answers=[])=>answers.some(answer=>normalize(value)===normalize(answer));
function renderQuestion(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());
  const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';
  card.innerHTML=`<h2>大問 ${s.title} <span class="points">（${s.max}点満点）</span></h2><div class="reading"></div>`;card.querySelector('.reading').textContent=s.reading;
  s.fields.forEach((f,i)=>{const b=document.createElement('div');b.className='question-block';let control='';
    if(f.type==='tf')control=`<div class="options-grid">${['〇','×'].map((o,j)=>`<button type="button" class="opt-btn ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${o}</button>`).join('')}</div>`;
    else if(f.type==='multi')control='<div class="options-vertical">'+f.options.map((o,j)=>'<button type="button" class="opt-btn-v '+((st.answers[i]||[]).includes(j)?'selected':'')+'" data-multi="'+i+'" data-value="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join('')+'</div>';
    else if(f.type==='choice')control=`<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${(f.optionLabels?f.optionLabels[j]:String.fromCharCode(65+j))}. ${esc(o)}</button>`).join('')}</div>`;
    else control=f.longInput?`<textarea class="text-input" rows="4" data-answer="${i}" placeholder="4つの道具名を入力">${esc(st.answers[i]||'')}</textarea>`:`<input class="text-input" type="text" data-answer="${i}" value="${esc(st.answers[i]||'')}" placeholder="回答を入力">`;
    b.innerHTML=`<div class="q-title">${esc(f.q)} <span class="points">（${f.pts}点）</span></div>${control}`;card.appendChild(b);
  });
  const nav=document.createElement('div');nav.className='nav-row';if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.appendChild(spacer)}
  const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);document.getElementById('quiz').appendChild(card);
  card.querySelectorAll('[data-multi]').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.multi),j=Number(x.dataset.value),selected=st.answers[i]||[];if(selected.includes(j))st.answers[i]=selected.filter(v=>v!==j);else if(selected.length<(s.fields[i].maxSelections||2))st.answers[i]=[...selected,j];x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',(st.answers[i]||[]).includes(Number(y.dataset.value))))});
  card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.answers[Number(x.dataset.choice)]=Number(x.dataset.value);x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))});
  card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[Number(x.dataset.answer)]=x.value);
}
function sectionScore(si){const st=state[si];return st.score+sections[si].fields.reduce((n,f,i)=>n+(f.type==='self'&&f.rubric?f.rubric.reduce((m,p,j)=>m+(st.checks[i+'_'+j]?p[1]:0),0):f.type==='self'&&st.checks[i]?f.pts:0),0)}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[Number(x.dataset.answer)]=x.value);st.score=0;s.fields.forEach((f,i)=>{if(f.type==='tf')st.score+=(['〇','×'][st.answers[i]]===f.answer?f.pts:0);else if(f.type==='choice')st.score+=(st.answers[i]===f.answer?f.pts:0);else if(f.type==='multi')st.score+=(Array.isArray(st.answers[i])&&st.answers[i].length===f.answer.length&&f.answer.every(v=>st.answers[i].includes(v))?f.pts:0)});renderResult(si)}
function renderResult(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} 採点結果</h2>`;
  s.fields.forEach((f,i)=>{const row=document.createElement('div');row.className='result-item';const manual=f.type==='self';let ok=false,user='',answer=f.answer||'';
    if(f.type==='tf'){ok=['〇','×'][st.answers[i]]===f.answer;user=st.answers[i]===undefined?'未選択':['〇','×'][st.answers[i]]}
    else if(f.type==='choice'){ok=st.answers[i]===f.answer;user=st.answers[i]===undefined?'未選択':`${(f.optionLabels&&f.optionLabels[st.answers[i]])||String.fromCharCode(65+st.answers[i])}. ${f.options[st.answers[i]]}`;answer=`${(f.optionLabels&&f.optionLabels[f.answer])||String.fromCharCode(65+f.answer)}. ${f.options[f.answer]}`}
    else if(f.type==='multi'){const selected=Array.isArray(st.answers[i])?st.answers[i]:[];ok=selected.length===f.answer.length&&f.answer.every(v=>selected.includes(v));user=selected.length?selected.map(j=>String.fromCharCode(65+j)+'. '+f.options[j]).join('、'):'未選択';answer=f.answer.map(j=>String.fromCharCode(65+j)+'. '+f.options[j]).join('、')}
    else{user=st.answers[i]||'';st.checks[i]=matches(user,f.aliases||[f.answer])}
    const earned=manual?(f.rubric?f.rubric.reduce((n,p,j)=>n+(st.checks[i+'_'+j]?p[1]:0),0):(st.checks[i]?f.pts:0)):(ok?f.pts:0);row.classList.add(manual?(earned===f.pts?'result-correct':'result-pending'):(ok?'result-correct':'result-wrong'));
    row.innerHTML=`<span class="badge">${manual?'自己採点':ok?'✓ 正解':'× 不正解'}（${earned}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${user?esc(user):'未入力'}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${i}" ${st.checks[i]?'checked':''}> ${f.complete?'指定された4つをすべて答えられていた':'模範解答と同等の内容を書けていた'}（${f.pts}点）</label>`:''}`;card.appendChild(row);
    if(manual&&f.rubric){row.querySelector('.self-check').remove();f.rubric.forEach((part,j)=>{const label=document.createElement('label');label.className='self-check';const check=document.createElement('input');check.type='checkbox';check.checked=Boolean(st.checks[i+'_'+j]);check.onchange=()=>{st.checks[i+'_'+j]=check.checked;const itemPoints=f.rubric.reduce((n,p,k)=>n+(st.checks[i+'_'+k]?p[1]:0),0);document.getElementById('subtotal').textContent=sectionScore(si);row.querySelector('.badge').textContent='自己採点（'+itemPoints+' / '+f.pts+'点）';row.classList.toggle('result-correct',itemPoints===f.pts);row.classList.toggle('result-pending',itemPoints!==f.pts)};label.append(check,document.createTextNode(' '+part[0]+'（'+part[1]+'点）'));row.append(label)})}
    if(manual&&!f.rubric)row.querySelector('[data-check]').onchange=ev=>{st.checks[i]=ev.target.checked;row.classList.toggle('result-correct',ev.target.checked);row.classList.toggle('result-pending',!ev.target.checked);row.querySelector('.badge').textContent=`自己採点（${ev.target.checked?f.pts:0}/${f.pts}点）`;document.getElementById('subtotal').textContent=sectionScore(si)};
  });
  card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${sectionScore(si)}</span> / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);const next=document.createElement('button');next.className='btn';next.textContent=si<sections.length-1?'次の大問 →':'最終結果を見る →';next.onclick=()=>si<sections.length-1?renderQuestion(si+1):renderFinal();nav.appendChild(next);card.appendChild(nav);document.getElementById('quiz').appendChild(card);
}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=sections.reduce((n,s,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 100点<br><span style="font-size:1rem">${total>=60?'合格':'不合格'}（合格点：60点）</span></div>`;sections.forEach((s,i)=>{const title=document.createElement('div');title.className='summary-title';title.textContent=`大問 ${s.title}：${sectionScore(i)} / ${s.max}点`;card.appendChild(title)});
  const saveCard=document.createElement('section');saveCard.className='account-card';saveCard.setAttribute('aria-labelledby','account-heading');saveCard.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.appendChild(saveCard);document.getElementById('quiz').appendChild(card);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);setupFinalAccount(total)}
function setupFinalAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(message,kind='')=>{status.textContent=message;status.dataset.kind=kind};const saveFinalScore=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数を自動保存しています…';saveStatus.dataset.kind='';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2016-intermediate',quizTitle:'ドラえもん検定 2016年度 中級',score:total,total:100}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};const setMode=next=>{mode=next;const registering=mode==='register';submit.textContent=registering?'アカウントを作成':'ログイン';$('switch-prompt').textContent=registering?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=registering?'ログイン':'新規アカウント作成';$('account-password').autocomplete=registering?'new-password':'current-password';setStatus(registering?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').addEventListener('click',()=>setMode(mode==='login'?'register':'login'));form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{const email=$('account-email').value.trim(),password=$('account-password').value;if(mode==='register')await window.DoraemonAuth.register(email,password);else await window.DoraemonAuth.login(email,password);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const messages={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(messages[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}});$('logout-button').addEventListener('click',async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}});retry.addEventListener('click',saveFinalScore);window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');saveFinalScore()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error('Firebase auth state error',error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')})}
renderQuestion(0);
</script>
