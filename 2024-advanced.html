const state=sections.map(()=>({answers:{},choices:{},manual:{},score:0,weighted:0}));
const roman=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().replace(/[\s　。、,，.！!「」『』（）()]/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0));
// 自動採点で使う共通処理。欠落していたため、大問Ⅰの採点時に
// ReferenceError が発生し、結果画面へ進めなくなっていた。
const evaluateText=(value,accepted=[])=>accepted.some(answer=>norm(value)===norm(answer));
function unorderedResult(item,st,itemIndex){
  const slotToPart=Array(item.parts.length).fill(-1),used=new Set();let score=0;
  item.parts.forEach((part,slot)=>{
    const value=st.answers[`${itemIndex}_${slot}`]??'';
    const match=item.parts.findIndex((candidate,index)=>!used.has(index)&&evaluateText(value,candidate.accepted||[candidate.answer]));
    if(match>=0){slotToPart[slot]=match;used.add(match);score+=item.parts[match].pts;}
  });
  return {slotToPart,score};
}
function renderQuestion(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());
  const s=sections[si],st=state[si],card=document.createElement('section');

  s.items.forEach((it,ii)=>{
    const block=document.createElement('div');block.className='question-block';

    else if(it.parts)markup+=it.parts.map((p,pi)=>it.type==='manualParts'?`<label class="q-title" style="display:block;margin-top:10px">${esc(p.label)}<input class="text-input" type="text" data-item="${ii}" data-part="${pi}" value="${esc(st.answers[`${ii}_${pi}`]||'')}" placeholder="回答を入力"></label>`:`<div class="q-title" style="margin-top:10px">${esc(p.label)}</div>${p.choiceOptions?`<div class="options-vertical">${p.choiceOptions.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[`${ii}_${pi}`]===j?'selected':''}" data-part-choice="${ii}_${pi}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`:`<input class="text-input" type="text" data-item="${ii}" data-part="${pi}" value="${esc(st.answers[`${ii}_${pi}`]||'')}" placeholder="回答を入力">`}`).join('');
    else markup+=`<input class="text-input" type="text" data-item="${ii}" value="${esc(st.answers[ii]||'')}" placeholder="回答を入力">`;
    block.innerHTML=markup;card.appendChild(block);
  });
  const nav=document.createElement('div');nav.className='nav-row';
  if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.appendChild(spacer)}
  const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);
  document.getElementById('quiz').appendChild(card);
  card.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.choices[Number(b.dataset.choice)]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});
  card.querySelectorAll('[data-part-choice]').forEach(b=>b.onclick=()=>{st.choices[b.dataset.partChoice]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});
  card.querySelectorAll('[data-item]').forEach(inp=>inp.oninput=()=>{const key=inp.dataset.part===undefined?Number(inp.dataset.item):`${inp.dataset.item}_${inp.dataset.part}`;st.answers[key]=inp.value});
}
function gradeSection(si){
  const s=sections[si],st=state[si];
  document.querySelectorAll('.screen [data-item]').forEach(inp=>{const key=inp.dataset.part===undefined?Number(inp.dataset.item):`${inp.dataset.item}_${inp.dataset.part}`;st.answers[key]=inp.value;});
  let raw=0;
  s.items.forEach((it,ii)=>{
    if(it.type==='choice'){if(st.choices[ii]===it.key)raw+=it.pts;}
    else if(it.parts){
      if(it.unorderedParts)raw+=unorderedResult(it,st,ii).score;
      else it.parts.forEach((p,pi)=>{if(p.choiceOptions){if(st.choices[`${ii}_${pi}`]===p.choiceOptions.indexOf(p.answer))raw+=p.pts;}else if(it.type==='manualParts'){}else if(evaluateText(st.answers[`${ii}_${pi}`],p.accepted))raw+=p.pts;});
      if(it.type==='manualParts'){st.manual[ii]=Math.min(it.pts,Math.max(0,Number(st.manual[ii]??0)));raw+=st.manual[ii];}
    }else if(it.type==='manual'){st.manual[ii]=Math.min(it.pts,Math.max(0,Number(st.manual[ii]??0)));raw+=st.manual[ii];}
    else if(it.type==='partialText'){const a=String(st.answers[ii]||'');if(a.includes('ゴーゴーライド'))raw+=Math.max(0,it.pts-(a.includes('ドラえもん')?0:1)-((a.includes('！')||a.includes('!'))?0:1));}
    else if(evaluateText(st.answers[ii],it.accepted)||st.manual[ii])raw+=it.pts;
  });
  st.score=raw;st.weighted=Math.round(raw/s.rawMax*sectionMax[si]);renderResult(si);
}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${roman[si]} 採点結果</h2><p class="muted">入力された回答と模範解答を確認してください。記述式は未採点分を下の欄で自己採点できます。</p>`;s.items.forEach((it,ii)=>{const row=document.createElement('div');row.className='result-item';let earned=0,content='';if(it.type==='choice'){const ok=st.choices[ii]===it.key;earned=ok?it.pts:0;content=`<div class="res-badge">${ok?'正解':'不正解'}（${earned}/${it.pts}点）</div><div><strong>${esc(it.q)}</strong></div><div>あなたの回答：${st.choices[ii]===undefined?'未選択':esc(it.options[st.choices[ii]])}<br>正解：${esc(it.options[it.key])}</div>`;row.classList.add(ok?'result-correct':'result-incorrect');}else if(it.parts){let partHtml='';const unordered=it.unorderedParts?unorderedResult(it,st,ii):null;it.parts.forEach((p,pi)=>{if(p.choiceOptions){const selected=st.choices[`${ii}_${pi}`];const ok=selected===p.choiceOptions.indexOf(p.answer);earned+=ok?p.pts:0;partHtml+=`<div>${esc(p.label)} あなたの回答：${selected===undefined?'未選択':esc(p.choiceOptions[selected])} ／ 正解：${esc(p.answer)}</div>`;}else if(it.type==='manualParts'){partHtml+=`<div>${esc(p.label)} あなたの回答：${esc(st.answers[`${ii}_${pi}`]||'未入力')} ／ 正解：${esc(p.answer)}</div>`;}else if(it.unorderedParts){const match=unordered.slotToPart[pi],answer=st.answers[`${ii}_${pi}`]||'未入力';if(match>=0)earned+=it.parts[match].pts;partHtml+=`<div>${esc(p.label)} あなたの回答：${esc(answer)} ／ ${match>=0?`正解：${esc(it.parts[match].answer)}（正解）`:`正解一覧：${it.parts.map(x=>esc(x.answer)).join('、')}（不正解）`}</div>`;}else{const ok=evaluateText(st.answers[`${ii}_${pi}`],p.accepted);if(ok)earned+=p.pts;partHtml+=`<div>${esc(p.label)} あなたの回答：${esc(st.answers[`${ii}_${pi}`]||'未入力')} ／ 正解：${esc(p.answer)}（${ok?'正解':'不正解'}）</div>`;}});if(it.type==='manualParts'){const val=Number(st.manual[ii]??0);earned=val;partHtml+=`<label class="self-eval-box" style="display:block"><span class="self-eval-title">問1の自己採点（${it.pts}点満点）</span><select class="score-select" data-manual="${ii}">${Array.from({length:it.pts+1},(_,n)=>`<option value="${n}" ${n===val?'selected':''}>${n}点</option>`).join('')}</select></label>`;}content=`<div class="res-badge">${earned}点</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">${partHtml}</div>`;row.classList.add(earned?'result-correct':'result-incorrect');}else if(it.type==='manual'){const val=Number(st.manual[ii]??0);earned=val;content=`<div class="res-badge">自己採点 ${val}/${it.pts}点</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">あなたの回答：${esc(st.answers[ii]||'未入力')}<br>模範解答：${esc(it.answer)}</div><div class="self-eval-box"><label class="self-eval-prompt" for="manual-score-${si}-${ii}">得点を選択</label><select id="manual-score-${si}-${ii}" class="score-select" data-manual="${ii}">${Array.from({length:it.pts+1},(_,n)=>`<option value="${n}" ${n===val?'selected':''}>${n}点</option>`).join('')}</select></div>`;row.classList.add(earned?'result-correct':'result-incorrect');}else{let ok=evaluateText(st.answers[ii],it.accepted);if(it.type==='partialText'){const a=String(st.answers[ii]||'');earned=a.includes('ゴーゴーライド')?Math.max(0,it.pts-(a.includes('ドラえもん')?0:1)-((a.includes('！')||a.includes('!'))?0:1)):0;ok=earned===it.pts;}else earned=ok?it.pts:0;content=`<div class="res-badge">${ok?'正解':'不正解'}（${earned}/${it.pts}点）</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">あなたの回答：${esc(st.answers[ii]||'未入力')}<br>模範解答：${esc(it.answer)}</div>${ok||it.type==='partialText'?'':`<label class="self-eval-box"><input type="checkbox" data-self="${ii}" ${st.manual[ii]?'checked':''}> 模範解答と同等の内容で正解（${it.pts}点）</label>`}`;if(it.type!=='partialText'&&st.manual[ii])earned=it.pts;row.classList.add(earned?'result-correct':'result-incorrect');}row.innerHTML=content;card.appendChild(row);});
  const total=()=>{let r=0;s.items.forEach((it,ii)=>{if(it.type==='choice'){if(st.choices[ii]===it.key)r+=it.pts;}else if(it.parts){if(it.unorderedParts)r+=unorderedResult(it,st,ii).score;else it.parts.forEach((part,pi)=>{if(part.choiceOptions){if(st.choices[`${ii}_${pi}`]===part.choiceOptions.indexOf(part.answer))r+=part.pts;}else if(it.type!=='manualParts'&&evaluateText(st.answers[`${ii}_${pi}`],part.accepted))r+=part.pts;});if(it.type==='manualParts')r+=Number(st.manual[ii]||0);}else if(it.type==='manual')r+=Number(st.manual[ii]||0);else if(it.type==='partialText'){const a=String(st.answers[ii]||'');if(a.includes('ゴーゴーライド'))r+=Math.max(0,it.pts-(a.includes('ドラえもん')?0:1)-((a.includes('！')||a.includes('!'))?0:1));}else if(evaluateText(st.answers[ii],it.accepted)||st.manual[ii])r+=it.pts;});st.score=r;st.weighted=Math.round(r/s.rawMax*sectionMax[si]);document.getElementById('section-score').innerHTML=`${st.weighted} / ${sectionMax[si]}点`;document.getElementById('raw-score').textContent=`（問題配点：${r} / ${s.rawMax}点）`;};
  card.insertAdjacentHTML('beforeend',`<div class="score-banner">このセクション：<span id="section-score">${st.weighted} / ${sectionMax[si]}点</span><div id="raw-score" class="muted" style="color:#fff">（問題配点：${st.score} / ${s.rawMax}点）</div></div>`);card.querySelectorAll('[data-manual]').forEach(sel=>sel.addEventListener('change',()=>{st.manual[Number(sel.dataset.manual)]=Number(sel.value);total();}));card.querySelectorAll('[data-self]').forEach(ch=>ch.addEventListener('change',()=>{st.manual[Number(ch.dataset.self)]=ch.checked?s.items[Number(ch.dataset.self)].pts:0;total();}));const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);const next=document.createElement('button');next.className='btn';next.textContent=si<sections.length-1?'次の大問 →':'最終結果を見る →';next.onclick=()=>si<sections.length-1?renderQuestion(si+1):renderFinal();nav.appendChild(next);card.appendChild(nav);document.getElementById('quiz').appendChild(card);}
function renderFinal(){
  document.querySelectorAll('.screen').forEach(e=>e.remove());
  const total=state.reduce((n,x)=>n+x.weighted,0),card=document.createElement('section');card.className='card screen';
  card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 200点<br><span style="font-size:1rem">${total>=129.3?'合格':'不合格'}（合格点：129.3点）</span></div>`;
  sections.forEach((s,si)=>{const d=document.createElement('div');d.className='summary-title';d.textContent=`${roman[si]} ${s.title.replace(/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨ]\s*/,'')}：${state[si].weighted} / ${sectionMax[si]}点`;card.appendChild(d)});
  const account=document.createElement('section');account.className='account-card';account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数と解答を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;
  card.appendChild(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card);setupFinalAccount(total);
}
function setupFinalAccount(total){
  const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';
  const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};
  const save=async()=>{if(finalScoreSaved){saveStatus.textContent='点数と解答は保存済みです。';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数と解答を自動保存しています…';const answers=sections.map((s,si)=>({section:s.title,score:state[si].weighted,rawScore:state[si].score,answers:s.items.map((it,ii)=>({question:it.q,answer:it.type==='choice'?(state[si].choices[ii]===undefined?'未回答':it.options[state[si].choices[ii]]):it.parts?it.parts.map((p,pi)=>`${p.label}: ${state[si].answers[`${ii}_${pi}`]|| (p.choiceOptions?(state[si].choices[`${ii}_${pi}`]===undefined?'未回答':p.choiceOptions[state[si].choices[`${ii}_${pi}`]]):'未回答')}`).join(' / '):(state[si].answers[ii]||'未回答')}))}));finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2024-advanced',quizTitle:'ドラえもん検定 2024年度 上級',score:total,total:200,passThreshold:129.3,answers}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数と解答を保存しました。';saveStatus.dataset.kind='success'}).catch(e=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error(e)});return finalScoreSavePromise};
  const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};
  $('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{await window.DoraemonAuth[mode]($('account-email').value.trim(),$('account-password').value);form.reset();setStatus('ログインしました。','success')}catch(error){setStatus(error.code==='auth/invalid-credential'?'メールアドレスまたはパスワードを確認してください。':'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};
  $('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=!!user;$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数と解答を自動で記録します。'}},e=>setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error'));
}
