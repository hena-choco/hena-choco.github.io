    {q:'画像(1)〜(5)のコマ割りが掲載された作品名をそれぞれ答えよ。',type:'parts',parts:[{label:'(1)',answer:'天つき地蔵',accepted:['天つき地蔵'],pts:4},{label:'(2)',answer:'ドラえもん のび太の宇宙小戦争（リトルスターウォーズ）',accepted:['のび太の宇宙小戦争','ドラえもんのび太の宇宙小戦争','宇宙小戦争','リトルスターウォーズ','のび太のリトルスターウォーズ'],pts:4},{label:'(3)',answer:'カンヅメカンでまんがを',accepted:['カンヅメカンでまんがを'],pts:4},{label:'(4)',answer:'空ぶりは巻きもどして…',accepted:['空ぶりは巻きもどして','空ぶりは巻きもどして…'],pts:4},{label:'(5)',answer:'ドラえもん のび太の創世日記',accepted:['のび太の創世日記','ドラえもんのび太の創世日記','創世日記'],pts:4}]}
  ]},
  {title:'Ⅸ アルファベットで始まるひみつ道具',rawMax:24,intro:'「SL煙突」のように、アルファベットで始まるひみつ道具をできるだけ多く答えよ。『ドラえもん 最新ひみつ道具大事典』掲載のものを正解とする。「SL煙突」は除く。正解1つにつき3点、誤答による減点はありません。',items:[
    {q:'ひみつ道具を最大8つまで入力してください。',type:'parts',parts:[{label:'回答①',answer:'CMキャンデー発射機',accepted:['CMキャンデー発射機'],pts:3},{label:'回答②',answer:'E.S.P.訓練ボックス',accepted:['E.S.P.訓練ボックス','ESP訓練ボックス'],pts:3},{label:'回答③',answer:'N・Sワッペン',accepted:['N・Sワッペン','NSワッペン'],pts:3},{label:'回答④',answer:'SOS発信機',accepted:['SOS発信機'],pts:3},{label:'回答⑤',answer:'TOKYO二十二世紀',accepted:['TOKYO二十二世紀'],pts:3},{label:'回答⑥',answer:'UFOカメラ',accepted:['UFOカメラ'],pts:3},{label:'回答⑦',answer:'XYZ線カメラ',accepted:['XYZ線カメラ'],pts:3},{label:'回答⑧',answer:'Yロウ',accepted:['Yロウ','Yろう'],pts:3}]}
  ]}
];

const state=sections.map(()=>({answers:{},choices:{},manual:{},score:0,weighted:0}));
const roman=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().replace(/[\s　。、,，.！!「」『』（）()]/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0));
function renderQuestion(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${roman[si]} ${esc(s.title.replace(/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨ]\s*/,''))} <span class="muted">（${sectionMax[si]}点満点）</span></h2><p class="muted" style="margin-bottom:12px">セクション ${si+1} / 9</p>`;if(s.intro)card.insertAdjacentHTML('beforeend',`<div class="reading-text">${esc(s.intro)}</div>`);if(s.media)card.insertAdjacentHTML('beforeend',`<div class="image-container"><img src="${s.media}" alt="${esc(s.title)}の問題画像" loading="lazy"></div>`);s.items.forEach((it,ii)=>{const block=document.createElement('div');block.className='question-block';let markup=`<div class="q-title">${esc(it.q)} <span class="muted">（${it.pts||it.parts?.reduce((n,p)=>n+p.pts,0)||''}点）</span></div>`;if(it.type==='choice'){const vertical=it.options.length>2;markup+=`<div class="${vertical?'options-vertical':'options-grid'}">${it.options.map((o,j)=>`<button type="button" class="${vertical?'opt-btn-v':'opt-btn'} ${st.choices[ii]===j?'selected':''}" data-choice="${ii}" data-value="${j}">${vertical?`${j+1}. `:''}${esc(o)}</button>`).join('')}</div>`;}else if(it.parts){markup+=it.parts.map((p,pi)=>it.type==='manualParts'?`<div class="q-title" style="margin-top:10px">${esc(p.label)}</div><input class="text-input" type="text" data-item="${ii}" data-part="${pi}" value="${esc(st.answers[`${ii}_${pi}`]||'')}" placeholder="回答を入力">`:`<div class="q-title" style="margin-top:10px">${esc(p.label)}</div>${p.choiceOptions?`<div class="options-vertical">${p.choiceOptions.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[`${ii}_${pi}`]===j?'selected':''}" data-part-choice="${ii}_${pi}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`:`<input class="text-input" type="text" data-item="${ii}" data-part="${pi}" value="${esc(st.answers[`${ii}_${pi}`]||'')}" placeholder="回答を入力">`}`).join('');}else{markup+=`<input class="text-input" type="text" data-item="${ii}" value="${esc(st.answers[ii]||'')}" placeholder="回答を入力">`;}block.innerHTML=markup;card.appendChild(block);});const submit=document.createElement('button');submit.className='btn-submit';submit.textContent=`${roman[si]}を採点する`;submit.onclick=()=>gradeSection(si);card.appendChild(submit);document.getElementById('quiz').appendChild(card);card.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.choice);st.choices[i]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));}));card.querySelectorAll('[data-part-choice]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.partChoice;st.choices[k]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));}));card.querySelectorAll('[data-item]').forEach(inp=>inp.addEventListener('input',()=>{const key=inp.dataset.part===undefined?Number(inp.dataset.item):`${inp.dataset.item}_${inp.dataset.part}`;st.answers[key]=inp.value;}));}
function evaluateText(answer,accepted){return (accepted||[answer]).some(a=>norm(a)===norm(answer));}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-item]').forEach(inp=>{const key=inp.dataset.part===undefined?Number(inp.dataset.item):`${inp.dataset.item}_${inp.dataset.part}`;st.answers[key]=inp.value;});let raw=0;s.items.forEach((it,ii)=>{if(it.type==='choice'){if(st.choices[ii]===it.key)raw+=it.pts;}else if(it.parts){it.parts.forEach((p,pi)=>{if(p.choiceOptions){if(st.choices[`${ii}_${pi}`]===p.choiceOptions.indexOf(p.answer))raw+=p.pts;}else if(it.type==='manualParts'){}else if(evaluateText(st.answers[`${ii}_${pi}`],p.accepted))raw+=p.pts;});if(it.type==='manualParts'){st.manual[ii]=Math.min(it.pts,Math.max(0,Number(st.manual[ii]??0)));raw+=st.manual[ii];}}else if(it.type==='manual'){st.manual[ii]=Math.min(it.pts,Math.max(0,Number(st.manual[ii]??0)));raw+=st.manual[ii];}else if(it.type==='partialText'){const a=String(st.answers[ii]||'');if(a.includes('ゴーゴーライド'))raw+=Math.max(0,it.pts-(a.includes('ドラえもん')?0:1)-((a.includes('！')||a.includes('!'))?0:1));}else if(evaluateText(st.answers[ii],it.accepted)||st.manual[ii])raw+=it.pts;});st.score=raw;st.weighted=Math.round(raw/s.rawMax*sectionMax[si]);renderResult(si);}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${roman[si]} 採点結果</h2><p class="muted">入力された回答と模範解答を確認してください。記述式は未採点分を下の欄で自己採点できます。</p>`;s.items.forEach((it,ii)=>{const row=document.createElement('div');row.className='result-item';let earned=0,content='';if(it.type==='choice'){const ok=st.choices[ii]===it.key;earned=ok?it.pts:0;content=`<div class="res-badge">${ok?'正解':'不正解'}（${earned}/${it.pts}点）</div><div><strong>${esc(it.q)}</strong></div><div>あなたの回答：${st.choices[ii]===undefined?'未選択':esc(it.options[st.choices[ii]])}<br>正解：${esc(it.options[it.key])}</div>`;row.classList.add(ok?'result-correct':'result-incorrect');}else if(it.parts){let partHtml='';it.parts.forEach((p,pi)=>{if(p.choiceOptions){const selected=st.choices[`${ii}_${pi}`];const ok=selected===p.choiceOptions.indexOf(p.answer);earned+=ok?p.pts:0;partHtml+=`<div>${esc(p.label)} あなたの回答：${selected===undefined?'未選択':esc(p.choiceOptions[selected])} ／ 正解：${esc(p.answer)}</div>`;}else if(it.type==='manualParts'){partHtml+=`<div>${esc(p.label)} あなたの回答：${esc(st.answers[`${ii}_${pi}`]||'未入力')} ／ 正解：${esc(p.answer)}</div>`;}else{const ok=evaluateText(st.answers[`${ii}_${pi}`],p.accepted);if(ok)earned+=p.pts;partHtml+=`<div>${esc(p.label)} あなたの回答：${esc(st.answers[`${ii}_${pi}`]||'未入力')} ／ 正解：${esc(p.answer)}（${ok?'正解':'要確認'}）</div>`;}});if(it.type==='manualParts'){const val=Number(st.manual[ii]??0);earned=val;partHtml+=`<label class="self-eval-box" style="display:block"><span class="self-eval-title">問1の自己採点（${it.pts}点満点）</span><select class="score-select" data-manual="${ii}">${Array.from({length:it.pts+1},(_,n)=>`<option value="${n}" ${n===val?'selected':''}>${n}点</option>`).join('')}</select></label>`;}content=`<div class="res-badge">${earned}点</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">${partHtml}</div>`;row.classList.add(earned?'result-correct':'result-incorrect');}else if(it.type==='manual'){const val=Number(st.manual[ii]??0);earned=val;content=`<div class="res-badge">自己採点 ${val}/${it.pts}点</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">あなたの回答：${esc(st.answers[ii]||'未入力')}<br>模範解答：${esc(it.answer)}</div><label class="self-eval-box"><span class="self-eval-title">採点</span><select class="score-select" data-manual="${ii}">${Array.from({length:it.pts+1},(_,n)=>`<option value="${n}" ${n===val?'selected':''}>${n}点</option>`).join('')}</select></label>`;row.classList.add(earned?'result-correct':'result-incorrect');}else{let ok=evaluateText(st.answers[ii],it.accepted);if(it.type==='partialText'){const a=String(st.answers[ii]||'');earned=a.includes('ゴーゴーライド')?Math.max(0,it.pts-(a.includes('ドラえもん')?0:1)-((a.includes('！')||a.includes('!'))?0:1)):0;ok=earned===it.pts;}else earned=ok?it.pts:0;content=`<div class="res-badge">${ok?'正解':'要確認'}（${earned}/${it.pts}点）</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">あなたの回答：${esc(st.answers[ii]||'未入力')}<br>模範解答：${esc(it.answer)}</div>${ok||it.type==='partialText'?'':`<label class="self-eval-box"><input type="checkbox" data-self="${ii}" ${st.manual[ii]?'checked':''}> 模範解答と同等の内容で正解（${it.pts}点）</label>`}`;if(it.type!=='partialText'&&st.manual[ii])earned=it.pts;row.classList.add(earned?'result-correct':'result-incorrect');}row.innerHTML=content;card.appendChild(row);});
  const total=()=>{let r=0;s.items.forEach((it,ii)=>{if(it.type==='choice'){if(st.choices[ii]===it.key)r+=it.pts;}else if(it.parts){it.parts.forEach((p,pi)=>{if(p.choiceOptions){if(st.choices[`${ii}_${pi}`]===p.choiceOptions.indexOf(p.answer))r+=p.pts;}else if(it.type==='manualParts'){}else if(evaluateText(st.answers[`${ii}_${pi}`],p.accepted))r+=p.pts;});if(it.type==='manualParts')r+=Number(st.manual[ii]||0);}else if(it.type==='manual')r+=Number(st.manual[ii]||0);else if(it.type==='partialText'){const a=String(st.answers[ii]||'');if(a.includes('ゴーゴーライド'))r+=Math.max(0,it.pts-(a.includes('ドラえもん')?0:1)-((a.includes('！')||a.includes('!'))?0:1));}else if(evaluateText(st.answers[ii],it.accepted)||st.manual[ii])r+=it.pts;});st.score=r;st.weighted=Math.round(r/s.rawMax*sectionMax[si]);document.getElementById('section-score').innerHTML=`${st.weighted} / ${sectionMax[si]}点`;document.getElementById('raw-score').textContent=`（問題配点：${r} / ${s.rawMax}点）`;};
  card.insertAdjacentHTML('beforeend',`<div class="score-banner">このセクション：<span id="section-score">${st.weighted} / ${sectionMax[si]}点</span><div id="raw-score" class="muted" style="color:#fff">（問題配点：${st.score} / ${s.rawMax}点）</div></div>`);card.querySelectorAll('[data-manual]').forEach(sel=>sel.addEventListener('change',()=>{st.manual[Number(sel.dataset.manual)]=Number(sel.value);total();}));card.querySelectorAll('[data-self]').forEach(ch=>ch.addEventListener('change',()=>{st.manual[Number(ch.dataset.self)]=ch.checked?s.items[Number(ch.dataset.self)].pts:0;total();}));const back=document.createElement('button');back.className='btn-submit';back.textContent=`${roman[si]}の回答に戻る`;back.onclick=()=>renderQuestion(si);card.appendChild(back);if(si<8){const next=document.createElement('button');next.className='btn-submit';next.textContent=si===8?'最終結果を見る':`${roman[si+1]}へ進む`;next.onclick=()=>si===8?renderFinal():renderQuestion(si+1);card.appendChild(next);}else{const final=document.createElement('button');final.className='btn-submit';final.textContent='最終結果を見る';final.onclick=renderFinal;card.appendChild(final);const list=document.createElement('a');list.className='btn-submit';list.href='https://hena-choco.github.io';list.textContent='問題一覧へ戻る';card.appendChild(list);}document.getElementById('quiz').appendChild(card);}
function renderFinal(){
  document.querySelectorAll('.screen').forEach(e=>e.remove());
  const total=state.reduce((n,x)=>n+x.weighted,0);
  const card=document.createElement('section');card.className='card screen';
  card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 200点<div class="muted" style="color:white">合格基準：129.3点</div></div>`;
  sections.forEach((s,si)=>{
    const h=document.createElement('div');h.className='result-section-title';
    h.textContent=`${roman[si]} ${s.title.replace(/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨ]\s*/,'')}：${state[si].weighted} / ${sectionMax[si]}点`;card.appendChild(h);
    s.items.forEach((it,ii)=>{
      const row=document.createElement('div');row.className='result-item';
      let details='';
      if(it.type==='choice'){
        const ok=state[si].choices[ii]===it.key;
        details=`<div class="res-badge">${ok?'正解':'不正解'}</div><div><strong>${esc(it.q)}</strong></div><div>あなたの回答：${state[si].choices[ii]===undefined?'未選択':esc(it.options[state[si].choices[ii]])} ／ 正解：${esc(it.options[it.key])}</div>`;
        row.classList.add(ok?'result-correct':'result-incorrect');
      }else if(it.parts){
        const partDetails=it.parts.map((p,pi)=>{
          if(p.choiceOptions){const a=state[si].choices[`${ii}_${pi}`];return `<div>${esc(p.label)} あなたの回答：${a===undefined?'未選択':esc(p.choiceOptions[a])} ／ 正解：${esc(p.answer)}</div>`;}
          return `<div>${esc(p.label)} あなたの回答：${esc(state[si].answers[`${ii}_${pi}`]||'未入力')} ／ 正解：${esc(p.answer)}</div>`;
        }).join('');
        const got=it.type==='manualParts'?Number(state[si].manual[ii]||0):it.parts.reduce((n,p,pi)=>n+(p.choiceOptions?(state[si].choices[`${ii}_${pi}`]===p.choiceOptions.indexOf(p.answer)?p.pts:0):it.type==='manualParts'?0:(evaluateText(state[si].answers[`${ii}_${pi}`],p.accepted)?p.pts:0)),0);
        details=`<div class="res-badge">${got}点</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">${partDetails}</div>`;
        row.classList.add(got?'result-correct':'result-incorrect');
      }else{
        let got=it.type==='manual'?Number(state[si].manual[ii]||0):evaluateText(state[si].answers[ii],it.accepted)?it.pts:0;
        if(it.type==='partialText'){const a=String(state[si].answers[ii]||'');got=a.includes('ゴーゴーライド')?Math.max(0,it.pts-(a.includes('ドラえもん')?0:1)-((a.includes('！')||a.includes('!'))?0:1)):0;}
        if(state[si].manual[ii]&&it.type!=='manual')got=it.pts;
        details=`<div class="res-badge">${got}/${it.pts}点</div><div><strong>${esc(it.q)}</strong></div><div class="self-eval-answer">あなたの回答：${esc(state[si].answers[ii]||'未入力')}<br>模範解答：${esc(it.answer)}</div>`;
        row.classList.add(got?'result-correct':'result-incorrect');
      }
      row.innerHTML=details;card.appendChild(row);
    });
  });
  const back=document.createElement('button');back.className='btn-submit';back.textContent='Ⅸの回答に戻る';back.onclick=()=>renderResult(8);card.appendChild(back);
  const list=document.createElement('a');list.className='btn-submit';list.href='https://hena-choco.github.io';list.textContent='問題一覧へ戻る';card.appendChild(list);
  document.getElementById('quiz').appendChild(card);
}
renderQuestion(0);
