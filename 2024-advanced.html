{q:'(1) の作品名。',answer:'天つき地蔵'}, {q:'(2) の作品名。',answer:'（ドラえもん）のび太の宇宙小戦争（リトルスターウォーズ）',accept:['のび太の宇宙小戦争','ドラえもん のび太の宇宙小戦争','のび太の宇宙小戦争 リトルスターウォーズ']}, {q:'(3) の作品名。',answer:'カンヅメカンでまんがを'}, {q:'(4) の作品名。',answer:'空ぶりは巻きもどして…'}, {q:'(5) の作品名。',answer:'（ドラえもん）のび太の創世日記',accept:['のび太の創世日記','ドラえもん のび太の創世日記']}]},
{title:'Ⅸ アルファベットで始まるひみつ道具',max:24,dedupe:true,passage:'「SL煙突」のように、アルファベットで始まるひみつ道具をできるだけ多く答えよ。ただし、“藤子・F・不二雄監修・まんが(2013)『ドラえもん 最新ひみつ道具大事典』小学館”に掲載されているもののみ正解とする。また、「SL煙突」は正解としない。',fields:[
{q:'解答欄 1',answer:'CMキャンデー発射機'}, {q:'解答欄 2',answer:'E.S.P.訓練ボックス'}, {q:'解答欄 3',answer:'N・Sワッペン'}, {q:'解答欄 4',answer:'SOS発信機'}, {q:'解答欄 5',answer:'TOKYO二十二世紀'}, {q:'解答欄 6',answer:'UFOカメラ'}, {q:'解答欄 7',answer:'XYZ線カメラ'}, {q:'解答欄 8',answer:'Yロウ'}]}
];
const state=sections.map(()=>({answers:{},score:0,manualScore:0}));let current=0;
function fieldPoints(idx,f){if(f.pts!==undefined)return f.pts;if(idx===1||idx===2)return 2;if(idx===6)return 3;if(idx===7)return 4;if(idx===8)return 3;return 0}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeText(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　。、，,.・「」『』【】（）()〜～!！?？]/g,'').replace(/[ーｰ]/g,'');}
function renderQuestion(idx){current=idx;const host=document.getElementById('quiz');host.innerHTML='';const s=sections[idx],st=state[idx],card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${esc(s.title)} <span class="points">（${s.max}点満点）</span></h2><div class="muted">大問 ${idx+1} / ${sections.length}</div>${s.passage?`<div class="reading-text">${esc(s.passage)}</div>`:''}${s.image?`<div class="image-container"><img src="${esc(s.image)}" alt="${esc(s.imageAlt)}"></div>`:''}`;
s.fields.forEach((f,i)=>{const b=document.createElement('div');b.className='question-block';let controls='';if(f.options){const grid=f.options.length===2;controls=`<div class="${grid?'options-grid':'options-vertical'}">${f.options.map((o,j)=>`<button type="button" class="${grid?'opt-btn':'opt-btn-v'} ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-val="${j}">${grid?esc(o):`${j+1}. ${esc(o)}`}</button>`).join('')}</div>`}else controls=`<input class="text-input" type="text" data-answer="${i}" value="${esc(st.answers[i]||'')}" placeholder="回答を入力">`;
b.innerHTML=`<div class="q-title">${esc(f.q)} ${(!s.manual&&fieldPoints(idx,f))?`<span class="points">（${fieldPoints(idx,f)}点）</span>`:''}</div>${controls}`;card.appendChild(b)});
card.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>{const i=+btn.dataset.choice;st.answers[i]=+btn.dataset.val;btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===btn))}));card.querySelectorAll('[data-answer]').forEach(input=>input.addEventListener('input',()=>st.answers[+input.dataset.answer]=input.value));const submit=document.createElement('button');submit.className='btn-submit';submit.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'][idx]}を採点する`;submit.onclick=()=>gradeSection(idx);card.appendChild(submit);host.appendChild(card);window.scrollTo(0,0)}
function gradeSection(idx){const s=sections[idx],st=state[idx];document.querySelectorAll('[data-answer]').forEach(el=>st.answers[+el.dataset.answer]=el.value);if(s.manual){renderResult(idx);return}let score=0;if(s.dedupe){const used=new Set();s.fields.forEach((f,i)=>{const answer=normalizeText(st.answers[i]);if(!answer||used.has(answer))return;const match=s.fields.find(x=>normalizeText(x.answer)===answer);if(match){score+=3;used.add(answer)}})}else{s.fields.forEach((f,i)=>{if(f.options){if(st.answers[i]===f.key)score+=fieldPoints(idx,f)}else if((f.accept||[f.answer]).some(a=>normalizeText(st.answers[i])===normalizeText(a)))score+=fieldPoints(idx,f)})}st.score=score;renderResult(idx)}
function renderResult(idx){current=idx;const s=sections[idx],st=state[idx],host=document.getElementById('quiz');host.innerHTML='';const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${esc(s.title)} 採点結果</h2><div class="muted">満点：${s.max}点</div>`;
if(s.manual){s.fields.forEach((f,i)=>{const row=document.createElement('div');row.className='result-item result-incorrect';row.innerHTML=`<div class="res-badge">回答</div><div><strong>${esc(f.q)}</strong></div><div>あなたの回答：${esc(st.answers[i]||'未入力')}</div><div>模範解答：${esc(f.answer)}</div>`;card.appendChild(row)});const box=document.createElement('div');box.className='self-eval-box';box.innerHTML=`<strong>大問の自己採点（0〜${s.max}点）</strong><input class="text-input" id="manual-score" type="number" min="0" max="${s.max}" step="1" value="${st.manualScore}"><div class="muted">模範解答と採点基準を確認し、得点を入力してください。</div>`;card.appendChild(box);box.querySelector('input').addEventListener('input',e=>{st.manualScore=Math.max(0,Math.min(s.max,Number(e.target.value)||0));document.getElementById('current-score').textContent=st.manualScore});card.insertAdjacentHTML('beforeend',`<div class="score-banner">この大問：<span id="current-score">${st.manualScore}</span> / ${s.max} 点</div>`)}
else{const seenAnswers=new Set();s.fields.forEach((f,i)=>{const row=document.createElement('div');row.className='result-item';let ok=false,answer=f.answer||'';if(s.dedupe){const norm=normalizeText(st.answers[i]);const matches=!!norm&&s.fields.some(x=>normalizeText(x.answer)===norm);const first=matches&&!seenAnswers.has(norm);if(first)seenAnswers.add(norm);ok=first;row.classList.add(ok?'result-correct':'result-incorrect');row.innerHTML=`<span class="res-badge">${ok?'正解（3点）':matches?'重複のため加点なし':'不正解'}</span><div>${esc(f.q)}</div><div>あなたの回答：${esc(st.answers[i]||'未入力')} ${matches?'':'／ 正解例：'+esc(answer)}</div>`}else if(f.options){ok=st.answers[i]===f.key;row.classList.add(ok?'result-correct':'result-incorrect');row.innerHTML=`<span class="res-badge">${ok?'正解（'+fieldPoints(idx,f)+'点）':'不正解'}</span><div>${esc(f.q)}</div><div>あなたの回答：${st.answers[i]===undefined?'未選択':esc(f.options[st.answers[i]])} ／ 正解：${esc(f.options[f.key])}</div>`}else{ok=(f.accept||[f.answer]).some(a=>normalizeText(st.answers[i])===normalizeText(a));row.classList.add(ok?'result-correct':'result-incorrect');row.innerHTML=`<span class="res-badge">${ok?'正解（'+fieldPoints(idx,f)+'点）':'不正解'}</span><div>${esc(f.q)}</div><div>あなたの回答：${esc(st.answers[i]||'未入力')} ／ 正解：${esc(answer)}</div>`}card.appendChild(row)});card.insertAdjacentHTML('beforeend',`<div class="score-banner">この大問：${st.score} / ${s.max} 点</div>`)}
const back=document.createElement('button');back.className='btn-submit';back.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'][idx]}の回答に戻る`;back.onclick=()=>renderQuestion(idx);card.appendChild(back);const next=document.createElement('button');next.className='btn-submit';next.textContent=idx===sections.length-1?'最終結果を見る':`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'][idx+1]}へ進む`;next.onclick=()=>idx===sections.length-1?renderFinal():renderQuestion(idx+1);card.appendChild(next);host.appendChild(card);window.scrollTo(0,0)}
function finalScore(){return state.reduce((n,st,i)=>n+(sections[i].manual?st.manualScore:st.score),0)}
function renderFinal(){const total=finalScore(),pass=total>=129.3,host=document.getElementById('quiz');host.innerHTML='';const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>最終結果</h2><div class="score-banner ${pass?'pass':''}">総合得点：${total} / 200点<br>${pass?'合格':'不合格'}<div class="muted">合格基準：129.3点</div></div>`;sections.forEach((s,i)=>{const score=s.manual?state[i].manualScore:state[i].score;const row=document.createElement('div');row.className='result-section-title';row.textContent=`${s.title}：${score} / ${s.max}点`;card.appendChild(row)});const link=document.createElement('a');link.className='btn-submit';link.href='https://hena-choco.github.io';link.textContent='トップ一覧へ戻る';card.appendChild(link);host.appendChild(card);window.scrollTo(0,0)}
renderQuestion(0);
</script></body></html>
