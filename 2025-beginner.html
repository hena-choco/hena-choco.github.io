<script type="module">

  {title:'4',max:30,reading:'問題の答えを入力しましょう。',fields:[

    {q:'(2) のび太の苗字は何でしょう。（2文字程度）',type:'self',answer:'のび',aliases:['のび','野比'],pts:6},
    {q:'(3) のび太がテストで5回に1回とる点数は何点でしょう。（1文字程度）',type:'self',answer:'0',aliases:['0','０','ぜろ','ゼロ'],pts:6},

    {q:'(5) “ヘリトンボ”という体につけて空を飛べるひみつ道具は何でしょう。（6文字程度）',type:'self',answer:'たけこぷたー',aliases:['たけこぷたー','タケコプター'],pts:6}

const state=sections.map(()=>({answers:{},checks:{},score:0}));
let finalScoreSavePromise=null,finalScoreSaved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderQuestion(si){

    else if(f.type==='choice')control=`<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.answers[i]===j?'selected':''}" data-answer-choice="${i}" data-value="${j}">${j+1}. ${esc(o)}</button>`).join('')}</div>`;
    else control=`<input class="text-input" type="text" data-answer-text="${i}" value="${esc(st.answers[i]||'')}" placeholder="回答を入力">`;
    block.innerHTML=`<div class="q-title">${esc(f.q)} <span class="points">（${f.pts}点）</span></div>${control}`;card.append(block);
  });
  const nav=document.createElement('div');nav.className='nav-row';
  if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.append(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.append(spacer)}
  const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.append(submit);card.append(nav);document.getElementById('quiz').append(card);
  card.querySelectorAll('[data-answer-choice]').forEach(button=>button.onclick=()=>{const i=Number(button.dataset.answerChoice);state[si].answers[i]=sections[si].fields[i].type==='choice'?Number(button.dataset.value):button.dataset.value;button.parentElement.querySelectorAll('button').forEach(other=>other.classList.toggle('selected',other===button))});

function sectionScore(si){const s=sections[si],st=state[si];return st.score+s.fields.reduce((n,f,i)=>n+(f.type==='self'&&st.checks[i]?f.pts:0),0)}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer-text]').forEach(input=>st.answers[Number(input.dataset.answerText)]=input.value);st.score=0;s.fields.forEach((f,i)=>{if(f.type!=='self'&&isCorrect(f,st.answers[i]))st.score+=f.pts});renderResult(si)}
function renderResult(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} 採点結果</h2>`;
  s.fields.forEach((f,i)=>{const manual=f.type==='self';let ok=manual?false:isCorrect(f,st.answers[i]);if(manual&&isCorrect(f,st.answers[i]))st.checks[i]=true;const earned=manual?(st.checks[i]?f.pts:0):(ok?f.pts:0);const row=document.createElement('div');row.className='result-item';row.classList.add(manual?(st.checks[i]?'result-correct':'result-pending'):(ok?'result-correct':'result-wrong'));const user=f.type==='tf'?(st.answers[i]||'未選択'):f.type==='choice'?(st.answers[i]===undefined?'未選択':`${st.answers[i]+1}. ${f.options[st.answers[i]]}`):(st.answers[i]||'未入力');const answer=f.type==='tf'?f.answer:f.type==='choice'?`${f.answer+1}. ${f.options[f.answer]}`:f.answer;row.innerHTML=`<span class="badge">${manual?'自己採点':ok?'✓ 正解':'× 不正解'}（${earned}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${esc(user)}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${i}" ${st.checks[i]?'checked':''}> 模範解答と同等の内容を書けていた（${f.pts}点）</label>`:''}`;card.append(row);if(manual)row.querySelector('[data-check]').onchange=event=>{st.checks[i]=event.target.checked;renderResult(si)}});

function renderFinal(){

  const account=document.createElement('section');account.className='account-card';account.setAttribute('aria-labelledby','account-heading');account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数と解答を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.append(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.append(home);document.getElementById('quiz').append(card);setupFinalAccount(total);

function setupFinalAccount(total){
  const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';

    if(finalScoreSaved){saveStatus.textContent='この検定の点数と解答は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;
    saveStatus.textContent='点数と解答を自動保存しています…';saveStatus.dataset.kind='';
    const answers=sections.map((section,si)=>({section:section.title,score:sectionScore(si),answers:section.fields.map((field,i)=>({question:field.q,answer:state[si].answers[i]===undefined?'未回答':field.type==='choice'?`${state[si].answers[i]+1}. ${field.options[state[si].answers[i]]}`:state[si].answers[i],correctAnswer:field.type==='choice'?`${field.answer+1}. ${field.options[field.answer]}`:field.answer,correct:field.type==='self'?null:isCorrect(field,state[si].answers[i]),earned:field.type==='self'?(state[si].checks[i]?field.pts:0):isCorrect(field,state[si].answers[i])?field.pts:0,maxPoints:field.pts,selfCheck:field.type==='self'}))}));
    finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2025-beginner',quizTitle:'ドラえもん検定 2025年度 初級',score:total,total:120,passThreshold:PASS_SCORE,answers}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数と解答を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise;
  };
  const setMode=next=>{mode=next;const registering=mode==='register';submit.textContent=registering?'アカウントを作成':'ログイン';$('switch-prompt').textContent=registering?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=registering?'ログイン':'新規アカウント作成';$('account-password').autocomplete=registering?'new-password':'current-password';setStatus(registering?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};
  $('switch-mode').addEventListener('click',()=>setMode(mode==='login'?'register':'login'));
  form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{const email=$('account-email').value.trim(),password=$('account-password').value;if(mode==='register')await window.DoraemonAuth.register(email,password);else await window.DoraemonAuth.login(email,password);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const messages={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(messages[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}});
  $('logout-button').addEventListener('click',async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}});retry.addEventListener('click',saveFinalScore);
  window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');saveFinalScore()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数と解答を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error('Firebase auth state error',error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')});
}
renderQuestion(0);
