function strictNormalize(s){return String(s??'').replace(/[。、,，.！!「」『』（）()「」・:：]/g,'')}
function correct(field,value,item){const norm=item.strict?strictNormalize:normalize;return [field.answer,...(field.aliases||[])].some(x=>norm(x)===norm(value))}
function itemScore(item,st,ii){if(item.allOrNothing){const okay=item.fields.filter(f=>f.kind!=='reading').every(f=>{const fi=item.fields.indexOf(f);return f.kind==='choice'||f.kind==='sequence'?st.choices[`${ii}_${fi}`]===f.key:correct(f,st.answers[`${ii}_${fi}`],item)});return okay?item.fields.reduce((n,f)=>n+(f.pts||0),0):0}return item.fields.reduce((n,f,fi)=>{if(f.kind==='reading')return n;if(f.kind==='choice'||f.kind==='sequence')return n+(st.choices[`${ii}_${fi}`]===f.key?f.pts:0);if(item.manual)return n+Number(st.manual[`${ii}_${fi}`]||0);return n+(correct(f,st.answers[`${ii}_${fi}`],item)?f.pts:0)},0)}
function renderQuestion(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${esc(s.title)} <span class="muted">（${s.max}点満点）</span></h2><p class="muted">大問 ${si+1} / ${sections.length}</p>${s.reading?`<div class="reading-text">${esc(s.reading)}</div>`:''}`;if(s.media)card.insertAdjacentHTML('beforeend',`<div class="image-container"><img src="${esc(s.media)}" alt="Ⅲのコマ割り図" loading="lazy"></div>`);s.items.forEach((item,ii)=>{const block=document.createElement('div');block.className='question-block';let html=`<div class="q-title">${esc(item.q)} <span class="muted">（${item.fields.reduce((n,f)=>n+(f.pts||0),0)}点）</span></div>`;item.fields.forEach((f,fi)=>{if(f.kind==='reading'){html+=`<div class="reading-text">${esc(f.text)}</div>`;return}const label=f.label?`<div class="field-label">${esc(f.label)}</div>`:'';if(f.kind==='choice'||f.kind==='sequence'){html+=`${label}<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[`${ii}_${fi}`]===j?'selected':''}" data-choice="${ii}_${fi}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`}else html+=`${label}<input class="text-input" data-answer="${ii}_${fi}" value="${esc(st.answers[`${ii}_${fi}`]||'')}" placeholder="回答を入力">`});block.innerHTML=html;card.appendChild(block)});const submit=document.createElement('button');submit.className='btn-submit';submit.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]}を採点する`;submit.onclick=()=>gradeSection(si);card.appendChild(submit);if(si>0){const back=document.createElement('button');back.className='btn-submit';back.textContent='前の大問に戻る';back.onclick=()=>renderResult(si-1);card.appendChild(back)}document.getElementById('quiz').appendChild(card);card.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('input',()=>{st.answers[el.dataset.answer]=el.value}));card.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{const key=el.dataset.choice;st.choices[key]=Number(el.dataset.value);el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===el))}))}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(el=>{st.answers[el.dataset.answer]=el.value});st.score=s.items.reduce((n,item,ii)=>n+itemScore(item,st,ii),0);renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]} 採点結果</h2><p class="muted">${s.title}：${s.max}点満点</p>`;s.items.forEach((item,ii)=>{const score=itemScore(item,st,ii),row=document.createElement('div');row.className=`result-item ${score?'result-correct':'result-incorrect'}`;let html=`<span class="res-badge">${item.manual?'自己採点 ':''}${score} / ${item.fields.reduce((n,f)=>n+(f.pts||0),0)}点</span><div><strong>${esc(item.q)}</strong></div>`;item.fields.forEach((f,fi)=>{if(f.kind==='reading'){html+=`<div class="reading-text">${esc(f.text)}</div>`;return}const label=f.label?`${esc(f.label)} `:'';if(item.manual){html+=`<div class="self-eval-box"><div class="self-eval-title">模範解答</div><div>${esc(f.answer)}</div><label class="field-label" for="score-${si}-${ii}-${fi}">自己採点（${f.pts}点満点）</label><select class="score-select" id="score-${si}-${ii}-${fi}" data-manual="${ii}_${fi}">${Array.from({length:f.pts+1},(_,n)=>`<option value="${n}" ${Number(st.manual[`${ii}_${fi}`]||0)===n?'selected':''}>${n}点</option>`).join('')}</select></div><div>あなたの回答：${esc(st.answers[`${ii}_${fi}`]||'未入力')}</div>`}else if(f.kind==='choice'||f.kind==='sequence'){const val=st.choices[`${ii}_${fi}`];html+=`<div>${label}あなたの回答：${val===undefined?'未選択':esc(f.options[val])} ／ 正解：${esc(f.options[f.key])}</div>`}else html+=`<div>${label}あなたの回答：${esc(st.answers[`${ii}_${fi}`]||'未入力')} ／ 正解：${esc(f.answer)}</div>`});if(item.allOrNothing&&score===0)html+=`<div>完答の正解：${item.fields.filter(f=>f.kind!=='reading').map((f,fi)=>f.kind==='choice'||f.kind==='sequence'?f.options[f.key]:f.answer).join(' → ')}</div>`;row.innerHTML=html;card.appendChild(row);if(item.manual)row.querySelectorAll('[data-manual]').forEach(sel=>sel.addEventListener('change',()=>{st.manual[sel.dataset.manual]=Number(sel.value);st.score=s.items.reduce((n,x,j)=>n+itemScore(x,st,j),0);row.querySelector('.res-badge').textContent=`自己採点 ${itemScore(item,st,ii)} / ${item.fields.reduce((n,f)=>n+(f.pts||0),0)}点`;document.getElementById('section-total').textContent=`大問得点：${st.score} / ${s.max}点`}))});card.insertAdjacentHTML('beforeend',`<div id="section-total" class="score-banner">大問得点：${st.score} / ${s.max}点</div>`);const back=document.createElement('button');back.className='btn-submit';back.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]}の回答に戻る`;back.onclick=()=>renderQuestion(si);card.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn-submit';next.textContent=`${['Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]}へ進む`;next.onclick=()=>renderQuestion(si+1);card.appendChild(next)}else{const final=document.createElement('button');final.className='btn-submit';final.textContent='最終結果を見る';final.onclick=renderFinal;card.appendChild(final)}document.getElementById('quiz').appendChild(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 200点</div>`;sections.forEach((s,si)=>{const h=document.createElement('div');h.className='result-section-title';h.textContent=`${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'][si]} ${s.title.replace(/^[ⅠⅡⅢⅣⅤⅥ]\s*/, '')}：${state[si].score} / ${s.max}点`;card.appendChild(h)});const back=document.createElement('button');back.className='btn-submit';back.textContent='Ⅵの採点結果に戻る';back.onclick=()=>renderResult(5);card.appendChild(back);const home=document.createElement('a');home.className='btn-submit';home.href='https://hena-choco.github.io';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card)}
renderQuestion(0);
</script>
