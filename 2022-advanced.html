{title:'Ⅴ 人間貯金箱製造機',max:17,reading:`「人間貯金箱製造機」という話がある。お年玉をもらったのび太は、お金をついつい使ってしまいかねないとドラえもんに相談する。そこで、ドラえもんは二十二世紀の貯金箱を三種類出した。順番に、「(ア)貯金箱」、「(イ)貯金箱」、「(ウ)貯金箱」である。これらは強固なものであるが、「(エ)」という秘密道具を使うと簡単に開けることができる。実際に貯金を使う日が来たが、どの貯金箱も空っぽであったことが判明する。「(ア)貯金箱」は、珍しく頭が冴えてしまい貯金箱が攻略された。「(イ)貯金箱」は(オ)を用いて攻略し、「(ウ)貯金箱」に至っては根性で攻略した。過去に戻り、お金を取り戻したのび太とドラえもんは、人間貯金箱製造機を用いて、のび太のママを貯金箱とすることにしたのである。暗証番号は(カ)であり、【ちょっとしたきっかけ】で貯金箱が開けられ、貯金はママに渡ってしまった。`,items:[
{q:'問1. (ア)ー(カ)について、それぞれ適切な語句を補え。',fields:[{label:'(ア)',answer:'パズル',pts:2},{label:'(イ)',answer:'さいみん',pts:2},{label:'(ウ)',answer:'番犬',pts:2},{label:'(エ)',answer:'万能オープナーひらけゴマ',aliases:['万能オープナー ひらけゴマ'],pts:2},{label:'(オ)',answer:'鏡',pts:2},{label:'(カ)',answer:'4444',pts:2}]},
{q:'問2. 下線部、「ちょっとしたきっかけ」に関して。どのようなことがきっかけで貯金箱が開けられたのか答えよ。',manual:true,fields:[{answer:'のび太のママが泥棒猫を追いかけて「シッシッシッシッ」と言ったこと',pts:5}]}
]},
{title:'Ⅵ 各問題',max:36,items:[
{q:'問1. スネ夫の住所を答えよ。',fields:[{answer:'東京都練馬区月見台すすきヶ原 3-10-5',aliases:['東京都練馬区月見台すすきが原3-10-5','東京都練馬区月見台すすきヶ原3丁目10-5'],pts:6}]},
{q:'問2. 大長編シリーズ(「のび太の恐竜」〜「のび太のねじ巻き都市冒険記」)の中で、名前が同一のキャラクターは2組いる。1組目は『ロー』だが、もう一組は何か。',fields:[{answer:'チッポ',pts:6}]},
{q:'問3. 初めてドラえもんがのび太に向かって話したセリフを述べよ。',strict:true,fields:[{answer:'「いやあ、ろくなことがないね。」',aliases:['いやあ、ろくなことがないね。','「いやあ ろくなことがないね」'],pts:6}]},

{q:'問6. 「スネオタイムス」によるとのび太は何月何日何時何分に 1000 回目の転びを達成したか。',fields:[{answer:'6月11日11時17分',aliases:['6 月 11 日 11 時 17 分','6/11 11:17'],pts:6}]}

];
const state=sections.map(()=>({answers:{},choices:{},checks:{},score:0}));let finalScoreSavePromise=null,finalScoreSaved=false;
const roman=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s。、,，.！!「」『』（）()・:：]/g,'');
const strictNormalize=s=>String(s??'').replace(/[。、,，.！!「」『』（）()・:：]/g,'');
function valueKey(ii,fi){return `${ii}_${fi}`}
function fieldCorrect(f,value,item){const norm=item.strict?strictNormalize:normalize;return [f.answer,...(f.aliases||[])].some(x=>norm(x)===norm(value))}
function isChoice(f){return f.kind==='choice'||f.kind==='sequence'}
function itemScore(item,st,ii){const allFields=item.fields.filter(f=>f.kind!=='reading');if(item.allOrNothing){const allCorrect=allFields.every((f,fi)=>{const key=valueKey(ii,item.fields.indexOf(f));return isChoice(f)?st.choices[key]===f.key:Boolean(st.checks[key])});return allCorrect?allFields.reduce((n,f)=>n+(f.pts||0),0):0}return allFields.reduce((n,f,fi)=>{const index=item.fields.indexOf(f),key=valueKey(ii,index);if(isChoice(f))return n+(st.choices[key]===f.key?(f.pts||0):0);return n+(st.checks[key]?(f.pts||0):0)},0)}
function sectionScore(si){return sections[si].items.reduce((n,item,ii)=>n+itemScore(item,state[si],ii),0)}
function renderQuestion(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${roman[si]} ${esc(s.title.replace(/^[ⅠⅡⅢⅣⅤⅥ]\s*/,''))} <span class="points">（${s.max}点満点）</span></h2>`;if(s.reading)card.insertAdjacentHTML('beforeend',`<div class="reading">${esc(s.reading)}</div>`);if(s.media)card.insertAdjacentHTML('beforeend',`<img class="quiz-image" src="${esc(s.media)}" alt="大問Ⅲのコマ割り画像">`);s.items.forEach((item,ii)=>{const block=document.createElement('div');block.className='question-block';let html=`<div class="q-title">${esc(item.q)} <span class="points">（${item.fields.reduce((n,f)=>n+(f.pts||0),0)}点）</span></div>`;item.fields.forEach((f,fi)=>{const k=valueKey(ii,fi);if(f.kind==='reading'){html+=`<div class="reading">${esc(f.text)}</div>`;return}const label=f.label?`<div class="q-title">${esc(f.label)}</div>`:'';if(isChoice(f))html+=`${label}<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[k]===j?'selected':''}" data-choice="${k}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`;else html+=`${label}<input class="text-input" type="text" data-answer="${k}" value="${esc(st.answers[k]||'')}" placeholder="回答を入力">`});block.innerHTML=html;card.appendChild(block)});const nav=document.createElement('div');nav.className='nav-row';if(si){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.appendChild(spacer)}const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);document.getElementById('quiz').appendChild(card);card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.choices[x.dataset.choice]=Number(x.dataset.value);x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))});card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[x.dataset.answer]=x.value)}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[x.dataset.answer]=x.value);s.items.forEach((item,ii)=>item.fields.forEach((f,fi)=>{if(f.kind!=='reading'&&!isChoice(f)&&fieldCorrect(f,st.answers[valueKey(ii,fi)],item))st.checks[valueKey(ii,fi)]=true}));st.score=sectionScore(si);renderResult(si)}
function updateSubtotal(si){state[si].score=sectionScore(si);const el=document.getElementById('subtotal');if(el)el.textContent=state[si].score}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${roman[si]} 採点結果</h2>`;s.items.forEach((item,ii)=>{const row=document.createElement('div');row.className='result-item';const max=item.fields.reduce((n,f)=>n+(f.pts||0),0),earned=itemScore(item,st,ii);let html=`<span class="badge">${item.fields.some(f=>f.kind!=='reading'&&!isChoice(f))?'自己採点：':''}${earned}/${max}点</span><div><strong>${esc(item.q)}</strong></div>`;item.fields.forEach((f,fi)=>{const k=valueKey(ii,fi),label=f.label?`${esc(f.label)}：`:'';if(f.kind==='reading'){html+=`<div class="reading">${esc(f.text)}</div>`;return}if(isChoice(f)){const val=st.choices[k],ok=val===f.key;html+=`<div class="answer-key">${label}あなたの回答：${val===undefined?'未選択':esc(f.options[val])} ／ 正解：${esc(f.options[f.key])}</div>`}else{const answer=f.answer||'',user=st.answers[k]||'';html+=`<div class="answer-key">${label}あなたの回答：${esc(user||'未入力')}<br>模範解答：${esc(answer)}</div><label class="self-check"><input type="checkbox" data-check="${k}" ${st.checks[k]?'checked':''}> 模範解答と同等の内容を書けていた（${f.pts}点）</label>`}});row.classList.add(earned===max?'result-correct':earned===0?(item.fields.some(f=>f.kind!=='reading'&&!isChoice(f))?'result-pending':'result-wrong'):'result-pending');row.innerHTML=html;card.appendChild(row);row.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{st.checks[c.dataset.check]=c.checked;updateSubtotal(si);const score=itemScore(item,st,ii);row.classList.toggle('result-correct',score===max);row.classList.toggle('result-pending',score<max);const badge=row.querySelector('.badge');if(badge)badge.textContent=`自己採点：${score}/${max}点`})});card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${st.score}</span> / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn';next.textContent='次の大問 →';next.onclick=()=>renderQuestion(si+1);nav.appendChild(next)}else{const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.appendChild(final)}card.appendChild(nav);document.getElementById('quiz').appendChild(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=state.reduce((n,_,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / ${totalPoints}点<br><span style="font-size:1rem">${total>=passMark?'合格':'不合格'}（合格点：${passMark}点）</span></div>`;sections.forEach((s,i)=>{const line=document.createElement('div');line.className='summary-title';line.textContent=`${roman[i]} ${s.title.replace(/^[ⅠⅡⅢⅣⅤⅥ]\s*/, '')}：${sectionScore(i)} / ${s.max}点`;card.appendChild(line)});const account=document.createElement('section');account.className='account-card';account.setAttribute('aria-labelledby','account-heading');account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.appendChild(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card);setupFinalAccount(total)}
function setupFinalAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数を自動保存しています…';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2022-advanced',quizTitle:'ドラえもん検定 2022年度 上級',score:total,total:totalPoints,passThreshold:passMark}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{if(mode==='register')await window.DoraemonAuth.register($('account-email').value.trim(),$('account-password').value);else await window.DoraemonAuth.login($('account-email').value.trim(),$('account-password').value);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const m={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(m[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error(error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')})}
renderQuestion(0);
