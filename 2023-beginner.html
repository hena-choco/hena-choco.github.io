<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドラえもん検定 2023 初級問題</title>
<style>
:root{--main-color:#6B9DFF;--bg-color:#f4f7f9;--card-bg:#fff;--text-color:#333;--accent-color:#FFD43B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg-color);color:var(--text-color);line-height:1.6;padding:20px 12px}
.container{max-width:600px;margin:0 auto}header{text-align:center;margin-bottom:20px;padding:16px;background:var(--main-color);color:#fff;border-radius:12px}h1{font-size:1.3rem}.card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:20px}h2{font-size:1.1rem;margin-bottom:10px}.muted{font-size:.9rem;color:#666}.question-block{margin-bottom:24px;padding-bottom:16px;border-bottom:1px dashed #eee}.question-block:last-child{border-bottom:none}.q-title{font-weight:bold;margin-bottom:10px}.options-grid{display:flex;gap:10px;margin-top:8px}.opt-btn{flex:1;padding:12px;border:2px solid var(--main-color);background:#fff;color:var(--main-color);font-size:1.1rem;font-weight:bold;border-radius:8px;cursor:pointer}.opt-btn.selected,.opt-btn-v.selected{background:var(--main-color);color:#fff}.options-vertical{display:flex;flex-direction:column;gap:8px;margin-top:8px}.opt-btn-v{text-align:left;padding:12px 16px;border:2px solid var(--main-color);background:#fff;color:var(--text-color);font-size:1rem;border-radius:8px;cursor:pointer}.text-input,.tool-select{width:100%;padding:12px;font-size:1.02rem;border:2px solid var(--main-color);border-radius:8px;outline:none;background:#fff;color:var(--text-color);margin-top:6px}.text-input:focus,.tool-select:focus{border-color:var(--accent-color)}.btn-submit{display:block;width:100%;padding:16px;background:var(--main-color);color:#fff;border:0;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none}.btn-submit:hover{background:var(--text-color)}.result-item{padding:12px;border-radius:8px;margin-bottom:12px;font-size:.95rem;border:2px solid var(--main-color)}.result-correct{background:var(--main-color);color:#fff}.result-incorrect{background:#fff;color:var(--text-color)}.res-badge{font-weight:bold;display:inline-block;padding:2px 8px;border-radius:4px;background:var(--main-color);color:#fff;font-size:.8rem;margin-bottom:4px}.result-correct .res-badge{background:rgba(255,255,255,.3)}.score-banner{text-align:center;padding:20px;font-size:1.35rem;font-weight:bold;margin:14px 0 20px;border-radius:12px;background:var(--main-color);color:#fff}.result-section-title{font-size:1.05rem;font-weight:bold;margin:20px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--main-color)}.result-item div{margin:3px 0}@media(max-width:500px){body{padding:12px 8px}.card{padding:16px}.options-grid{gap:6px}.opt-btn{padding:10px 6px}}
</style>
</head>
<body>
<main class="container">
<header><h1>ドラえもん検定 2023初級</h1></header>
<div id="quiz"></div>
</main>
<script>
const toolList=['タケコプター','スモールライト','空気砲','どこでもドア','タイムマシン','タイムふろしき','通り抜けフープ'];
const sections=[
{title:'1 文が正しければ〇を、正しくなければ×を書きましょう',max:30,items:[
{q:'(1) ドラえものはタヌキ型ロボットである。',kind:'tf',key:1,answer:'×'},
{q:'(2) のび太の孫の孫はセワシである。',kind:'tf',key:0,answer:'〇'},
{q:'(3) しずちゃんはお風呂に入ることが好きである。',kind:'tf',key:0,answer:'〇'},
{q:'(4) スネ夫の家はお金持ちである。',kind:'tf',key:0,answer:'〇'},
{q:'(5) ジャイアンは歌がうまい。',kind:'tf',key:1,answer:'×'}
]},
{title:'2 正しい答えを一つ選びましょう',max:30,items:[
{q:'(1) ドラえもんが生まれたとき何色だったでしょう。',kind:'choice',options:['1. 青','2. 赤','3. 黄色','4. 緑'],key:2},
{q:'(2) のび太の得意なことは何でしょう。',kind:'choice',options:['1. あやとり','2. バイオリン','3. 勉強','4. 野球'],key:0},
{q:'(3) 「おまえのものはおれのもの、おれのものもおれのもの」というセリフで有名なキャラクターは誰でしょう。',kind:'choice',options:['1. のび太','2. スネ夫','3. ジャイアン','4. 出木杉'],key:2},
{q:'(4) テストの点数がいつも100点なのは誰でしょう。',kind:'choice',options:['1. のび太','2. スネ夫','3. ジャイアン','4. 出木杉'],key:3},
{q:'(5) ドラえもんの誕生日は何月何日でしょう。',kind:'choice',options:['1. 6月15日','2. 8月7日','3. 9月3日','4. 12月2日'],key:2}
]},
{title:'3 ひみつ道具を選びましょう',max:30,intro:'下にある叶えたいことにもっともよくあてはまるドラえもんのひみつ道具の名前を「ひみつ道具リスト」からえらんで書きましょう（使わない道具もあります）。同じ道具を2回以上使うことはできません。',items:[
{q:'(1) 世界旅行に行きたい。',kind:'tool',answer:'どこでもドア'},
{q:'(2) 壁の向こう側に行きたい。',kind:'tool',answer:'通り抜けフープ'},
{q:'(3) 空を自由に飛びたい。',kind:'tool',answer:'タケコプター'},
{q:'(4) 壊れたおもちゃを直したい。',kind:'tool',answer:'タイムふろしき'},
{q:'(5) 未来や昔の世界に行ってみたい。',kind:'tool',answer:'タイムマシン'}
]},
{title:'4 問題の答えを書きましょう',max:30,items:[
{q:'(1) ドラえもんの好きな食べ物は何でしょう。',kind:'text',answer:'どらやき',aliases:['ドラ焼き','ドラやき','もち']},
{q:'(2) ドラえもんの妹の名前は何でしょう。',kind:'text',answer:'ドラミ',aliases:['ドラミちゃん']},
{q:'(3) ドラえもんの苦手な動物は何でしょう。',kind:'text',answer:'ネズミ',aliases:['ねずみ']},
{q:'(4) ジャイアンの妹の名前は何でしょう。',kind:'text',answer:'ジャイ子'},
{q:'(5) ドラえもんは何世紀から来たでしょう。',kind:'text',answer:'22世紀',aliases:['二十二世紀','22せいき','二十二せいき']}
]}
];
const state=sections.map(()=>({answers:{},choices:{},score:0}));
const numerals=['1','2','3','4'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeText(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s。、,，.！!「」『』（）()・]/g,'')}
function isCorrect(answer,target,aliases=[]){const a=normalizeText(answer);return [target,...aliases].some(x=>a===normalizeText(x))}
function renderQuestion(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const section=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${esc(section.title)} <span class="muted">（${section.max}点満点）</span></h2><p class="muted">大問 ${si+1} / ${sections.length}</p>${section.intro?`<p class="muted" style="margin:10px 0 16px">${esc(section.intro)}</p>`:''}`;if(si===2)card.insertAdjacentHTML('beforeend',`<div class="question-block"><div class="q-title">ひみつ道具リスト</div><div class="muted">・${toolList.map(esc).join(' ・')}</div></div>`);section.items.forEach((item,ii)=>{const block=document.createElement('div');block.className='question-block';let html=`<div class="q-title">${esc(item.q)} <span class="muted">（6点）</span></div>`;if(item.kind==='tf')html+=`<div class="options-grid">${['〇','×'].map((v,j)=>`<button type="button" class="opt-btn ${st.choices[ii]===j?'selected':''}" data-choice="${ii}" data-value="${j}">${v}</button>`).join('')}</div>`;else if(item.kind==='choice')html+=`<div class="options-vertical">${item.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[ii]===j?'selected':''}" data-choice="${ii}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`;else if(item.kind==='tool')html+=`<select class="tool-select" data-tool="${ii}"><option value="">道具を選択</option>${toolList.map(x=>`<option value="${esc(x)}" ${st.answers[ii]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;else html+=`<input class="text-input" type="text" data-answer="${ii}" value="${esc(st.answers[ii]||'')}" placeholder="回答を入力">`;block.innerHTML=html;card.appendChild(block)});const submit=document.createElement('button');submit.className='btn-submit';submit.textContent=`${si+1}を採点する`;submit.onclick=()=>gradeSection(si);card.appendChild(submit);if(si>0){const back=document.createElement('button');back.className='btn-submit';back.textContent='前の大問に戻る';back.onclick=()=>renderResult(si-1);card.appendChild(back)}document.getElementById('quiz').appendChild(card);card.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{st.choices[Number(b.dataset.choice)]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))}));card.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('input',()=>{st.answers[Number(el.dataset.answer)]=el.value}));card.querySelectorAll('[data-tool]').forEach(sel=>sel.addEventListener('change',()=>{st.answers[Number(sel.dataset.tool)]=sel.value;updateToolOptions(card,st)}));if(si===2)updateToolOptions(card,st)}
function updateToolOptions(card,st){const selects=[...card.querySelectorAll('[data-tool]')];selects.forEach((sel,i)=>{const used=new Set(selects.filter((_,j)=>j!==i).map(x=>x.value).filter(Boolean));[...sel.options].forEach(opt=>{if(opt.value)opt.disabled=used.has(opt.value)})})}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(el=>{st.answers[Number(el.dataset.answer)]=el.value});st.score=s.items.reduce((n,item,ii)=>n+(item.kind==='tf'||item.kind==='choice'?(st.choices[ii]===item.key?6:0):item.kind==='tool'?(isCorrect(st.answers[ii],item.answer)?6:0):(isCorrect(st.answers[ii],item.answer,item.aliases)?6:0)),0);renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${si+1} 採点結果</h2><p class="muted">各問6点・大問${s.max}点満点</p>`;s.items.forEach((item,ii)=>{let ok,answer,user;if(item.kind==='tf'){ok=st.choices[ii]===item.key;user=st.choices[ii]===undefined?'未選択':['〇','×'][st.choices[ii]];answer=item.answer}else if(item.kind==='choice'){ok=st.choices[ii]===item.key;user=st.choices[ii]===undefined?'未選択':item.options[st.choices[ii]];answer=item.options[item.key]}else{user=st.answers[ii]||'未入力';answer=item.answer;ok=item.kind==='tool'?isCorrect(user,item.answer):isCorrect(user,item.answer,item.aliases)}const row=document.createElement('div');row.className=`result-item ${ok?'result-correct':'result-incorrect'}`;row.innerHTML=`<span class="res-badge">${ok?'正解（6点）':'不正解（0点）'}</span><div><strong>${esc(item.q)}</strong></div><div>あなたの回答：${esc(user)}</div><div>正解：${esc(answer)}</div>`;card.appendChild(row)});card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：${st.score} / ${s.max}点</div>`);const back=document.createElement('button');back.className='btn-submit';back.textContent=`${si+1}の回答に戻る`;back.onclick=()=>renderQuestion(si);card.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn-submit';next.textContent=`${si+2}へ進む`;next.onclick=()=>renderQuestion(si+1);card.appendChild(next)}else{const final=document.createElement('button');final.className='btn-submit';final.textContent='最終結果を見る';final.onclick=renderFinal;card.appendChild(final)}document.getElementById('quiz').appendChild(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 120点</div>`;sections.forEach((s,i)=>{const line=document.createElement('div');line.className='result-section-title';line.textContent=`${i+1} ${s.title.replace(/^\d+\s*/, '')}：${state[i].score} / ${s.max}点`;card.appendChild(line)});const back=document.createElement('button');back.className='btn-submit';back.textContent='4の採点結果に戻る';back.onclick=()=>renderResult(3);card.appendChild(back);const home=document.createElement('a');home.className='btn-submit';home.href='https://hena-choco.github.io';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card)}
renderQuestion(0);
</script>
</body>
</html>
