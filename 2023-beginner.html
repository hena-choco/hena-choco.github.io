<body>
<main class="container">
  <nav class="site-nav" aria-label="サイトナビゲーション"><a class="home-link" href="https://hena-choco.github.io/index.html">← 一覧に戻る</a></nav>
  <header><h1>ドラえもん検定 2023初級</h1></header>
  <div id="quiz"></div>
</main>
<script type="module">
import "./firebase-auth.js";
const sections=[
  {title:'1 文が正しければ〇を、正しくなければ×を書きましょう',max:30,fields:[
    {q:'(1) ドラえものはタヌキ型ロボットである。',type:'tf',answer:'×',pts:6},
    {q:'(2) のび太の孫の孫はセワシである。',type:'tf',answer:'〇',pts:6},
    {q:'(3) しずちゃんはお風呂に入ることが好きである。',type:'tf',answer:'〇',pts:6},
    {q:'(4) スネ夫の家はお金持ちである。',type:'tf',answer:'〇',pts:6},
    {q:'(5) ジャイアンは歌がうまい。',type:'tf',answer:'×',pts:6}
  ]},
  {title:'2 正しい答えを一つ選びましょう',max:30,fields:[
    {q:'(1) ドラえもんが生まれたとき何色だったでしょう。',type:'choice',options:['青','赤','黄色','緑'],answer:2,pts:6},
    {q:'(2) のび太の得意なことは何でしょう。',type:'choice',options:['あやとり','バイオリン','勉強','野球'],answer:0,pts:6},
    {q:'(3) 「おまえのものはおれのもの、おれのものもおれのもの」というセリフで有名なキャラクターは誰でしょう。',type:'choice',options:['のび太','スネ夫','ジャイアン','出木杉'],answer:2,pts:6},
    {q:'(4) テストの点数がいつも100点なのは誰でしょう。',type:'choice',options:['のび太','スネ夫','ジャイアン','出木杉'],answer:3,pts:6},
    {q:'(5) ドラえもんの誕生日は何月何日でしょう。',type:'choice',options:['6月15日','8月7日','9月3日','12月2日'],answer:2,pts:6}
  ]},
  {title:'3 ひみつ道具を選びましょう',max:30,reading:'下にある叶えたいことにもっともよくあてはまるドラえもんのひみつ道具の名前を「ひみつ道具リスト」からえらんで書きましょう（使わない道具もあります）。同じ道具を2回以上使うことはできません。',tools:['タケコプター','スモールライト','空気砲','どこでもドア','タイムマシン','タイムふろしき','通り抜けフープ'],fields:[
    {q:'(1) 世界旅行に行きたい。',type:'tool',answer:'どこでもドア',pts:6},
    {q:'(2) 壁の向こう側に行きたい。',type:'tool',answer:'通り抜けフープ',pts:6},
    {q:'(3) 空を自由に飛びたい。',type:'tool',answer:'タケコプター',pts:6},
    {q:'(4) 壊れたおもちゃを直したい。',type:'tool',answer:'タイムふろしき',pts:6},
    {q:'(5) 未来や昔の世界に行ってみたい。',type:'tool',answer:'タイムマシン',pts:6}
  ]},
  {title:'4 問題の答えを書きましょう',max:30,fields:[
    {q:'(1) ドラえもんの好きな食べ物は何でしょう。',type:'self',answer:'どらやき',aliases:['ドラ焼き','ドラやき','もち'],pts:6},
    {q:'(2) ドラえもんの妹の名前は何でしょう。',type:'self',answer:'ドラミ',aliases:['ドラミちゃん'],pts:6},
    {q:'(3) ドラえもんの苦手な動物は何でしょう。',type:'self',answer:'ネズミ',aliases:['ねずみ'],pts:6},
    {q:'(4) ジャイアンの妹の名前は何でしょう。',type:'self',answer:'ジャイ子',pts:6},
    {q:'(5) ドラえもんは何世紀から来たでしょう。',type:'self',answer:'22世紀',aliases:['二十二世紀','22せいき','二十二せいき'],pts:6}
  ]}
];
const state=sections.map(()=>({answers:{},checks:{},score:0}));
let finalScoreSavePromise=null,finalScoreSaved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・]/g,'');
const matches=(v,answers=[])=>answers.some(a=>normalize(v)===normalize(a));
function renderQuestion(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());
  const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';
  card.innerHTML=`<h2>大問 ${s.title.split(' ')[0]} <span class="points">（${s.max}点満点）</span></h2>`;
  const title=s.title.replace(/^\d+\s*/, '');card.insertAdjacentHTML('beforeend',`<div class="reading">${esc(title)}${s.reading?'\n\n'+esc(s.reading):''}${si===2?'\n\nひみつ道具リスト\n'+esc(s.tools.join(' ・ ')):''}</div>`);
  s.fields.forEach((f,i)=>{const b=document.createElement('div');b.className='question-block';let control='';
    if(f.type==='tf')control=`<div class="options-grid">${['〇','×'].map((o,j)=>`<button type="button" class="opt-btn ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${o}</button>`).join('')}</div>`;
    else if(f.type==='choice')control=`<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${j+1}. ${esc(o)}</button>`).join('')}</div>`;
    else if(f.type==='tool')control=`<select class="text-input" data-tool="${i}"><option value="">ひみつ道具を選択</option>${s.tools.map(t=>`<option value="${esc(t)}" ${st.answers[i]===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
    else control=`<input class="text-input" type="text" data-answer="${i}" value="${esc(st.answers[i]||'')}" placeholder="回答を入力">`;
    b.innerHTML=`<div class="q-title">${esc(f.q)} <span class="points">（${f.pts}点）</span></div>${control}`;card.appendChild(b);
  });
  const nav=document.createElement('div');nav.className='nav-row';
  if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else{const sp=document.createElement('span');sp.className='nav-placeholder';nav.appendChild(sp)}
  const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);document.getElementById('quiz').appendChild(card);
  card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.answers[Number(x.dataset.choice)]=Number(x.dataset.value);x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))});
  card.querySelectorAll('[data-tool]').forEach(x=>x.onchange=()=>{st.answers[Number(x.dataset.tool)]=x.value;const used=new Set(Object.entries(st.answers).filter(([k,v])=>Number(k)!==Number(x.dataset.tool)&&sections[si].fields[Number(k)]?.type==='tool').map(([,v])=>v));card.querySelectorAll('[data-tool]').forEach(sel=>[...sel.options].forEach(o=>{if(o.value)o.disabled=used.has(o.value)}))});
  card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[Number(x.dataset.answer)]=x.value);
}
function gradeSection(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[Number(x.dataset.answer)]=x.value);st.score=s.fields.reduce((n,f,i)=>n+((f.type==='tf'?['〇','×'][st.answers[i]]===f.answer:f.type==='choice'?st.answers[i]===f.answer:f.type==='tool'?st.answers[i]===f.answer:false)?f.pts:0),0);renderResult(si)}
function sectionScore(si){const s=sections[si],st=state[si];return st.score+s.fields.reduce((n,f,i)=>n+(f.type==='self'&&st.checks[i]?f.pts:0),0)}
function renderResult(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title.split(' ')[0]} 採点結果</h2>`;
  s.fields.forEach((f,i)=>{const row=document.createElement('div');row.className='result-item';const manual=f.type==='self';let ok=false,user='',answer=f.answer;
    if(f.type==='tf'){ok=['〇','×'][st.answers[i]]===f.answer;user=st.answers[i]===undefined?'未選択':['〇','×'][st.answers[i]]}
    else if(f.type==='choice'){ok=st.answers[i]===f.answer;user=st.answers[i]===undefined?'未選択':`${st.answers[i]+1}. ${f.options[st.answers[i]]}`;answer=`${f.answer+1}. ${f.options[f.answer]}`}
    else{user=st.answers[i]||'';if(manual&&matches(user,[f.answer,...(f.aliases||[])]))st.checks[i]=true;}
    const earned=manual?(st.checks[i]?f.pts:0):(ok?f.pts:0);row.classList.add(manual?(st.checks[i]?'result-correct':'result-pending'):(ok?'result-correct':'result-wrong'));
    row.innerHTML=`<span class="badge">${manual?'自己採点':ok?'✓ 正解':'× 不正解'}（${earned}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${user?esc(user):'未入力'}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${i}" ${st.checks[i]?'checked':''}> 模範解答と同等の内容を書けていた（${f.pts}点）</label>`:''}`;card.appendChild(row);
    if(manual)row.querySelector('[data-check]').onchange=e=>{st.checks[i]=e.target.checked;row.classList.toggle('result-correct',e.target.checked);row.classList.toggle('result-pending',!e.target.checked);document.getElementById('subtotal').textContent=sectionScore(si)};
  });
  card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${sectionScore(si)}</span> / ${s.max}点</div>`);
  const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);
  if(si<sections.length-1){const next=document.createElement('button');next.className='btn';next.textContent='次の大問 →';next.onclick=()=>renderQuestion(si+1);nav.appendChild(next)}else{const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.appendChild(final)}card.appendChild(nav);document.getElementById('quiz').appendChild(card);
}
function renderFinal(){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const total=sections.reduce((n,s,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / 120点</div>`;
  sections.forEach((s,i)=>{const d=document.createElement('div');d.className='summary-title';d.textContent=`大問 ${s.title.split(' ')[0]}：${sectionScore(i)} / ${s.max}点`;card.appendChild(d)});
  const account=document.createElement('section');account.className='account-card';account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;
  card.appendChild(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card);setupFinalAccount(total);
}

function setupFinalAccount(total){
  const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';
  const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};
  const save=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数を自動保存しています…';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2023-beginner',quizTitle:'ドラえもん検定 2023初級',score:total,total:120,answers:window.DoraemonAuth.captureAnswers(sections,state)}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};
  const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};
  $('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{if(mode==='register')await window.DoraemonAuth.register($('account-email').value.trim(),$('account-password').value);else await window.DoraemonAuth.login($('account-email').value.trim(),$('account-password').value);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const messages={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(messages[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};
  $('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error('Firebase auth state error',error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')});
}
