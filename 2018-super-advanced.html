{title:'7',max:20,reading:`7 以下の文章を読み、空欄に当てはまる語句を答えよ。①〜⑨には人物名、ア〜オにはひみつ道具の名前、A〜Fにはその他の語句や数字が当てはまる。なお、文中の巻数表記はてんとう虫コミックス『ドラえもん』、『ドラえもん プラス』に準ずる。

2019年公開予定の映画『のび太の月面探査記』の予告編動画が、今月15日に公開された。その中に、一瞬ではあるがのび太のクラスメイトが映るカットが挟まれており、これまで短編作品に登場したと思われるキャラクターが確認できる。ここでは、いつもの5人だけではない魅力的なクラスの仲間について、てんとう虫コミックス『ドラえもん』で登場した話とともに紹介していく。

まず、5巻でクリスマス子どもパーティーを企画したのび太たちの話から。今年は（①）くんの家でパーティーをすることになった。ちなみに、去年は（②）の家、おととしは（③）の家で開催されている。ドラえもんはみんなを喜ばせようと（ア）を持って会場に向かうが、家の狭い（①）くんは友達を呼ぶべきか思い悩んでいた。それを知ったのび太たちは（イ）を使い、見事彼の家でパーティーを実現した、という話だ。（イ）は『大長編ドラえもん』や『映画ドラえもん』でもたびたび登場し、活躍している道具である。そして最後のコマには総勢（A）人が家の中に集まり、楽しくパーティーが行われた。

次に、3巻『ああ、好き、好き、好き！』を見てみよう。2、3日前から（④）の家に来ている女の子と友達になろうと、ドラえもんの力を借りてのび太が奮闘する話である。作中で（④）はドラえもんのことを（B）と呼んでおり、のび太が惚れた女の子も「まあけっさく」と大笑いしていた。

そして、プラス6巻に登場するのが（⑤）さん。ある日の試合で13対1という大敗を喫したジャイアンズでは反省会が開かれたが、殴られたくないのび太は（ウ）をジャイアンと（⑤）に使い、2人の性格を入れ替えた。（⑤）は丁寧な喋り方が印象的な女の子である。

30巻には、（⑥）くんが登場する。勉強で（⑦）に勝てない彼は、毎晩（C）を繰り返していた。犯人捜しを引き受けたのび太たちに（エ）を使って捕らえられたが、（⑦）を二度としないことを条件に、（⑦）は犯人を外部に明かさないと約束した。この話では、のび太は2回にわたって（D）を奪い取っている。

また15巻には、のび太曰く「わらったの見見たことない」とまで表現された（⑧）が登場する。ドラえもんに道具をもらったのび太が（オ）を使い彼女を笑顔にさせると、しずかちゃんとジャイアンが「わらうとひとがかわったみたいよ。」「いがいとかわいい顔になるじゃない。」と彼女を見直した。
