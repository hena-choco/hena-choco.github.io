    .account-card h2 { margin-bottom:6px; }

    .small-label { display:block; color:#555; font-size:.9rem; }

const state=sections.map(()=>({answers:{},checks:{},score:0}));
let finalScoreSavePromise=null,finalScoreSaved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・：:／/％%→]/g,'');
const matches=(v,a=[])=>a.some(x=>normalize(v)===normalize(x));
const key=(i,j)=>`${i}_${j}`;
function textAnswer(f,st,i){return st.answers[i]||''}
function fieldAutoScore(f,st,i){
  if(f.type==='tf')return ['〇','×'][st.answers[i]]===f.answer?f.pts:0;
  if(f.type==='choice')return st.answers[i]===f.answer?f.pts:0;
  if(f.type==='multi')return f.parts.reduce((n,p,j)=>n+(st.answers[key(i,j)]===p.answer?1:0),0);
  return 0;
}
function fieldScore(f,st,i){
  if(f.type==='tf'||f.type==='choice'||f.type==='multi')return fieldAutoScore(f,st,i);
  if(f.type==='multiText')return f.parts.reduce((n,p,j)=>n+(st.checks[key(i,j)]?f.pts/f.parts.length:0),0);
  if(f.type==='list')return [0,1,2].reduce((n,j)=>n+(st.checks[key(i,j)]?1:0),0);
  return st.checks[i]?f.pts:0;
}
function sectionScore(si){return sections[si].fields.reduce((n,f,i)=>n+fieldScore(f,state[si],i),0)}
function renderQuestion(si){

  });

  if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else nav.innerHTML='<span class="nav-placeholder"></span>';
  const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);document.getElementById('quiz').appendChild(card);

function gradeSection(si){
  const st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[+x.dataset.answer]=x.value);document.querySelectorAll('.screen [data-sub]').forEach(x=>st.answers[x.dataset.sub]=x.value);document.querySelectorAll('.screen [data-list]').forEach(x=>st.answers[x.dataset.list]=x.value);
  sections[si].fields.forEach((f,i)=>{
    if(f.type==='self'&&matches(st.answers[i],[f.answer,...(f.aliases||[])]))st.checks[i]=true;
    if(f.type==='order'&&matches(st.answers[i],[f.answer,...(f.aliases||[])]))st.checks[i]=true;
    if(f.type==='multiText')f.parts.forEach((p,j)=>{if(matches(st.answers[key(i,j)],p.aliases||[p.answer]))st.checks[key(i,j)]=true});
    if(f.type==='list') [0,1,2].forEach(j=>{const val=normalize(st.answers[key(i,j)]||'');if(val&&f.items.some(p=>p.aliases.some(a=>normalize(a)===val)))st.checks[key(i,j)]=true});
  });st.score=sectionScore(si);renderResult(si);
}
function resultRow(card,{question,user,answer,earned,pts,manual,checkId,section}){
  const row=document.createElement('div');row.className='result-item';
  const complete=earned===pts;row.classList.add(manual?(earned?'result-correct':'result-pending'):(complete?'result-correct':'result-wrong'));

  card.appendChild(row);const cb=row.querySelector('[data-check]');if(cb)cb.onchange=()=>{state[section].checks[checkId]=cb.checked;const v=cb.checked?pts:0;row.querySelector('.badge').textContent=`自己採点（${v}/${pts}点）`;row.classList.toggle('result-correct',cb.checked);row.classList.toggle('result-pending',!cb.checked);document.getElementById('subtotal').textContent=sectionScore(section)};
}
function renderResult(si){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${esc(s.title)} 採点結果</h2>`;
  s.fields.forEach((f,i)=>{
    if(f.type==='multi'){
      f.parts.forEach((p,j)=>{const ok=st.answers[key(i,j)]===p.answer;const pts=1;resultRow(card,{question:`${f.q} ${p.label}`,user:st.answers[key(i,j)]===undefined?'未選択':p.options[st.answers[key(i,j)]],answer:p.options[p.answer],earned:ok?pts:0,pts,manual:false,section:si})});return;
    }
    if(f.type==='multiText'){
      const per=f.pts/f.parts.length;f.parts.forEach((p,j)=>resultRow(card,{question:`${f.q} ${p.label}`,user:st.answers[key(i,j)],answer:p.answer,earned:st.checks[key(i,j)]?per:0,pts:per,manual:true,checkId:key(i,j),section:si}));return;
    }
    if(f.type==='list'){
      const answer=f.items.map(p=>p.answer).join('／')+' から3つ';[0,1,2].forEach(j=>resultRow(card,{question:`${f.q}（回答 ${j+1}）`,user:st.answers[key(i,j)],answer,earned:st.checks[key(i,j)]?1:0,pts:1,manual:true,checkId:key(i,j),section:si}));return;
    }
    const auto=f.type==='tf'||f.type==='choice';let user='',answer=f.answer||'';
    if(f.type==='tf'){const ok=['〇','×'][st.answers[i]]===f.answer;user=st.answers[i]===undefined?'未選択':['〇','×'][st.answers[i]];resultRow(card,{question:f.q,user,answer:f.answer,earned:ok?f.pts:0,pts:f.pts,manual:false,section:si});return}
    if(f.type==='choice'){const ok=st.answers[i]===f.answer;user=st.answers[i]===undefined?'未選択':`${String.fromCharCode(65+st.answers[i])}. ${f.options[st.answers[i]]}`;answer=`${String.fromCharCode(65+f.answer)}. ${f.options[f.answer]}`;resultRow(card,{question:f.q,user,answer,earned:ok?f.pts:0,pts:f.pts,manual:false,section:si});return}
    user=st.answers[i]||'';if(f.type==='order')answer=`${f.answer}（例：${f.options.join('／')}）`;
    const pts=f.pts,earned=st.checks[i]?pts:0;resultRow(card,{question:f.q,user,answer,earned,pts,manual:true,checkId:i,section:si});
  });

  const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);
  if(si<sections.length-1){const next=document.createElement('button');next.className='btn';next.textContent='次の大問 →';next.onclick=()=>renderQuestion(si+1);nav.appendChild(next)}else{const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.appendChild(final)}card.appendChild(nav);document.getElementById('quiz').appendChild(card);
}
function renderFinal(){
  document.querySelectorAll('.screen').forEach(e=>e.remove());const total=sections.reduce((n,_,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / ${totalPoints}点<br><span style="font-size:1rem">${total>=passMark?'合格':'不合格'}（合格点：${passMark}点）</span></div>`;

  const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card);setupFinalAccount(total);

function setupFinalAccount(total){
  const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';

  const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};
  $('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{if(mode==='register')await window.DoraemonAuth.register($('account-email').value.trim(),$('account-password').value);else await window.DoraemonAuth.login($('account-email').value.trim(),$('account-password').value);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const m={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(m[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};
  $('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;
  window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error(error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')});
