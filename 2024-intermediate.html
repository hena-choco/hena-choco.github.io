];
const state=sections.map(()=>({answers:{},checks:{},score:0}));
let finalScoreSavePromise=null,finalScoreSaved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・：:／/]/g,'');
const matches=(v,answers=[])=>answers.some(a=>normalize(v)===normalize(a));
const allFields=s=>s.fields.flatMap((f,i)=>f.parts?f.parts.map((p,j)=>({...p,q:f.q+' '+p.label,key:`${i}_${j}`,parent:i,part:j})): [{...f,key:String(i),parent:i}]);
function fieldCorrect(f,st){if(f.type==='tf')return ['〇','×'][st.answers[f.key]]===f.answer;if(f.type==='choice')return st.answers[f.key]===f.answer;if(f.type==='text')return matches(st.answers[f.key],f.aliases||[f.answer]);return null}
function sectionScore(si){return state[si].score}
function renderQuestion(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} <span class="points">（${s.max}点満点）</span></h2><div class="reading">${esc(s.reading)}</div>${s.image?`<img class="quiz-image" src="${esc(s.image)}" alt="大問Ⅶの問題画像">`:''}`;s.fields.forEach((f,i)=>{const b=document.createElement('div');b.className='question-block';let ctl='';if(f.parts){ctl=f.parts.map((p,j)=>`<label class="q-title">${esc(p.label)}<input class="text-input" data-answer="${i}_${j}" value="${esc(st.answers[`${i}_${j}`]||'')}" placeholder="回答を入力"></label>`).join('')}else if(f.type==='tf')ctl=`<div class="options-grid">${['〇','×'].map((x,j)=>`<button type="button" class="opt-btn ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${x}</button>`).join('')}</div>`;else if(f.type==='choice')ctl=`<div class="options-vertical">${f.options.map((x,j)=>`<button type="button" class="opt-btn-v ${st.answers[i]===j?'selected':''}" data-choice="${i}" data-value="${j}">${j+1}. ${esc(x)}</button>`).join('')}</div>`;else ctl=`<input class="text-input" type="text" data-answer="${i}" value="${esc(st.answers[i]||'')}" placeholder="回答を入力">`;b.innerHTML=`<div class="q-title">${esc(f.q)}</div>${ctl}`;card.append(b)});const nav=document.createElement('div');nav.className='nav-row';if(si){const prev=document.createElement('button');prev.className='btn';prev.textContent='← 前の大問';prev.onclick=()=>renderQuestion(si-1);nav.append(prev)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.append(spacer)}const go=document.createElement('button');go.className='btn';go.textContent='回答を採点する →';go.onclick=()=>grade(si);nav.append(go);card.append(nav);document.getElementById('quiz').append(card);card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.answers[x.dataset.choice]=+x.dataset.value;x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))});card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[x.dataset.answer]=x.value)}
function grade(si){const s=sections[si],st=state[si];document.querySelectorAll('.screen [data-answer]').forEach(x=>st.answers[x.dataset.answer]=x.value);st.score=0;allFields(s).forEach(f=>{if(f.type==='self'&&st.checks[f.key])st.score+=f.pts;else if(fieldCorrect(f,st))st.score+=f.pts});renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${s.title} 採点結果</h2>`;allFields(s).forEach(f=>{const ok=f.type==='self'?null:fieldCorrect(f,st),earned=f.type==='self'?Number(st.checks[f.key]||0):(ok?f.pts:0),user=f.type==='choice'?(st.answers[f.key]===undefined?'未選択':`${st.answers[f.key]+1}. ${f.options[st.answers[f.key]]}`):f.type==='tf'?(st.answers[f.key]===undefined?'未選択':['〇','×'][st.answers[f.key]]):(st.answers[f.key]||'未入力'),answer=f.type==='choice'?`${f.answer+1}. ${f.options[f.answer]}`:f.answer,row=document.createElement('div');row.className='result-item';row.classList.add(f.type==='self'?'result-pending':ok?'result-correct':'result-wrong');row.innerHTML=`<span class="badge">${f.type==='self'?'自己採点':ok?'✓ 正解':'× 不正解'}（${earned}/${f.pts}点）</span><div><strong>${esc(f.q)}</strong></div><div class="answer-key">あなたの回答：${esc(user)}<br>${f.type==='self'?'模範解答':'正解'}：${esc(answer)}</div>${f.type==='self'?`<label class="self-check"><input type="checkbox" data-check="${f.key}" ${st.checks[f.key]?'checked':''}> 模範解答と同等の内容を書けていた（${f.pts}点）</label>`:''}`;card.append(row);if(f.type==='self')row.querySelector('[data-check]').onchange=e=>{st.checks[f.key]=e.target.checked;st.score+=e.target.checked?f.pts:-f.pts;row.classList.toggle('result-correct',e.target.checked);row.classList.toggle('result-pending',!e.target.checked);row.querySelector('.badge').textContent=`自己採点（${e.target.checked?f.pts:0}/${f.pts}点）`;document.getElementById('subtotal').textContent=sectionScore(si)}});card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${sectionScore(si)}</span> / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const edit=document.createElement('button');edit.className='btn';edit.textContent='← 回答を修正';edit.onclick=()=>renderQuestion(si);nav.append(edit);const next=document.createElement('button');next.className='btn';next.textContent=si<sections.length-1?'次の大問 →':'最終結果を見る →';next.onclick=()=>si<sections.length-1?renderQuestion(si+1):renderFinal();nav.append(next);card.append(nav);document.getElementById('quiz').append(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=sections.reduce((n,s,i)=>n+sectionScore(i),0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner ${total>=PASS_SCORE?'pass':''}">総合得点：${total} / ${TOTAL_SCORE}点<br><span style="font-size:1rem">${total>=PASS_SCORE?'合格':'不合格'}（合格基準点：${PASS_SCORE}点）</span></div>`;sections.forEach((s,i)=>{const d=document.createElement('div');d.className='summary-title';d.textContent=`大問 ${s.title}：${sectionScore(i)} / ${s.max}点`;card.append(d)});const account=document.createElement('section');account.className='account-card';account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数と解答を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.append(account);document.getElementById('quiz').append(card);setupAccount(total)}
function setupAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='点数と解答は保存済みです。';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数と解答を自動保存しています…';const answers=sections.map((s,si)=>({section:s.title,score:sectionScore(si),answers:allFields(s).map(f=>({question:f.q,answer:state[si].answers[f.key]===undefined?'未回答':f.type==='choice'?`${state[si].answers[f.key]+1}. ${f.options[state[si].answers[f.key]]}`:f.type==='tf'?(['〇','×'][state[si].answers[f.key]]||'未回答'):state[si].answers[f.key],correctAnswer:f.type==='choice'?`${f.answer+1}. ${f.options[f.answer]}`:f.answer,correct:f.type==='self'?null:fieldCorrect(f,state[si]),earned:f.type==='self'?(state[si].checks[f.key]?f.pts:0):(fieldCorrect(f,state[si])?f.pts:0),maxPoints:f.pts,selfCheck:f.type==='self'}))}));finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2024-intermediate',quizTitle:'ドラえもん検定 2024年度 中級',score:total,total:TOTAL_SCORE,passThreshold:PASS_SCORE,answers}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数と解答を保存しました。';saveStatus.dataset.kind='success'}).catch(e=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error(e)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{await window.DoraemonAuth[mode==='register'?'register':'login']($('account-email').value.trim(),$('account-password').value);form.reset();setStatus('ログインしました。','success')}catch(error){setStatus(error.code==='auth/invalid-credential'?'メールアドレスまたはパスワードを確認してください。':'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=!!user;$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数と解答を自動で記録します。'}},e=>setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error'))}
