<script type="module">
import "./firebase-auth.js";
const passMark=80,totalPoints=120;
const toolList=['ほんやくコンニャク','バイバイン','アンキパン','タケコプター','ビッグライト','スモールライト','ころばし屋'];
const sections=[
{title:'1 文が正しければ〇を、正しくなければ×を書きましょう',max:30,items:[
{q:'(1) ドラえもんはネコ型ロボットである。',type:'tf',answer:'〇',pts:6},
{q:'(2) のび太のパパはメガネをかけている。',type:'tf',answer:'×',pts:6},
{q:'(3) ドラえもんの鼻は青い。',type:'tf',answer:'×',pts:6},
{q:'(4) ジャイアンの飼い犬はムクである。',type:'tf',answer:'〇',pts:6},
{q:'(5) しずかちゃんの好きな食べ物は焼きいもである。',type:'tf',answer:'〇',pts:6}
]},
{title:'2 正しい答えを一つ選びましょう',max:30,items:[
{q:'(1) ドラえもんの誕生日はいつでしょう。',type:'choice',options:['ア. 6月15日','イ. 8月7日','ウ. 9月3日','エ. 12月2日'],answer:2,pts:6},
{q:'(2) ドラミちゃんのからだは何色でしょう。',type:'choice',options:['ア. あお','イ. きいろ','ウ. あか','エ. みどり'],answer:1,pts:6},
{q:'(3) のび太の特技は次のうちどれでしょう。',type:'choice',options:['ア. 料理','イ. 野球','ウ. 射撃','エ. 勉強'],answer:2,pts:6},
{q:'(4) しずかちゃんの名字はなんでしょう。',type:'choice',options:['ア. 野比','イ. 骨川','ウ. 剛田','エ. 源'],answer:3,pts:6},
{q:'(5) ジャイアンがエースをつとめる野球チームの名前はなんでしょう。',type:'choice',options:['ア. ジャイアンズ','イ. チラノルズ','ウ. 江戸川ドラアーズ','エ. ヨメイリジャイアンツ'],answer:0,pts:6}
]},
{title:'3 ひみつ道具を選びましょう',max:30,intro:'下にある叶えたいことにもっともよくあてはまるドラえもんのひみつ道具の名前を上の「ひみつ道具リスト」からえらんで書きましょう。（使わない道具もあります）',tools:toolList,items:[
{q:'(1) 空を自由にとびたい。',type:'tool',answer:'タケコプター',pts:6},
{q:'(2) 物を小さくしたい。',type:'tool',answer:'スモールライト',pts:6},
{q:'(3) ものの数をふやしたい。',type:'tool',answer:'バイバイン',pts:6},
{q:'(4) テストの前にテストに出るところを覚えたい。',type:'tool',answer:'アンキパン',pts:6},
{q:'(5) 外国人や宇宙人とお話がしたい。',type:'tool',answer:'ほんやくコンニャク',pts:6}
]},
{title:'4 問題の答えを書きましょう',max:30,items:[
{q:'(1) ドラミちゃんの好きな食べ物はなんでしょう。',type:'self',answer:'メロンパン',pts:6},
{q:'(2) ドラえもんはふだんどこでねているでしょう。',type:'self',answer:'おしいれの中',aliases:['押し入れの中','押入れの中','おしいれ'],pts:6},
{q:'(3) ドラえもんは生まれたのは何年でしょう。',type:'self',answer:'2112年',aliases:['2112','二千百十二年'],pts:6},
{q:'(4) のび太の孫の孫の名前はなんでしょう。',type:'self',answer:'セワシ',pts:6},
{q:'(5) ジャイアンの妹の名前はなんでしょう。',type:'self',answer:'ジャイ子',aliases:['ジャイこ'],pts:6}
]}
];
const state=sections.map(()=>({answers:{},choices:{},checks:{},score:0}));
let finalScoreSavePromise=null,finalScoreSaved=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・]/g,'');
const matches=(v,answers=[])=>answers.some(a=>normalize(v)===normalize(a));
function renderQuestion(si){
 document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';
 card.innerHTML=`<h2>${esc(s.title)} <span class="points">（${s.max}点満点）</span></h2>`;
 if(s.intro)card.insertAdjacentHTML('beforeend',`<div class="reading">${esc(s.intro)}</div>`);
 if(s.tools)card.insertAdjacentHTML('beforeend',`<div class="question-block"><div class="q-title">ひみつ道具リスト</div><div class="tool-list">・${s.tools.map(esc).join(' ・')}</div></div>`);
 s.items.forEach((it,ii)=>{const block=document.createElement('div');block.className='question-block';let control='';
  if(it.type==='tf')control=`<div class="options-grid">${['〇','×'].map((v,j)=>`<button type="button" class="opt-btn ${st.choices[ii]===j?'selected':''}" data-choice="${ii}" data-value="${j}">${v}</button>`).join('')}</div>`;
  else if(it.type==='choice')control=`<div class="options-vertical">${it.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[ii]===j?'selected':''}" data-choice="${ii}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`;
  else if(it.type==='tool')control=`<select class="tool-select" data-answer="${ii}"><option value="">ひみつ道具を選択</option>${toolList.map(x=>`<option value="${esc(x)}" ${st.answers[ii]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else control=`<input class="text-input" type="text" data-answer="${ii}" value="${esc(st.answers[ii]||'')}" placeholder="回答を入力">`;
  block.innerHTML=`<div class="q-title">${esc(it.q)} <span class="points">（${it.pts}点）</span></div>${control}`;card.appendChild(block);
 });
 const nav=document.createElement('div');nav.className='nav-row';if(si>0){const back=document.createElement('button');back.className='btn';back.textContent='← 前の大問';back.onclick=()=>renderQuestion(si-1);nav.appendChild(back)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.appendChild(spacer)}const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.appendChild(submit);card.appendChild(nav);document.getElementById('quiz').appendChild(card);
 card.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.choices[Number(b.dataset.choice)]=Number(b.dataset.value);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});
 card.querySelectorAll('[data-answer]').forEach(el=>{const save=()=>st.answers[Number(el.dataset.answer)]=el.value;el.addEventListener(el.tagName==='SELECT'?'change':'input',save)});
}
function itemScore(si,ii){const s=sections[si],it=s.items[ii],st=state[si];if(it.type==='tf')return ['〇','×'][st.choices[ii]]===it.answer?it.pts:0;if(it.type==='choice')return st.choices[ii]===it.answer?it.pts:0;if(it.type==='tool')return st.answers[ii]===it.answer?it.pts:0;return st.checks[ii]?it.pts:0}
function updateScore(si){state[si].score=sections[si].items.reduce((n,it,ii)=>n+itemScore(si,ii),0);const el=document.getElementById('subtotal');if(el)el.textContent=state[si].score}
function gradeSection(si){const s=sections[si],st=state[si];s.items.forEach((it,ii)=>{if(it.type==='self'&&matches(st.answers[ii],[it.answer,...(it.aliases||[])]))st.checks[ii]=true});st.score=s.items.reduce((n,it,ii)=>n+itemScore(si,ii),0);renderResult(si)}
function renderResult(si){
 document.querySelectorAll('.screen').forEach(e=>e.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${si+1} 採点結果</h2>`;
 s.items.forEach((it,ii)=>{const row=document.createElement('div');row.className='result-item';const manual=it.type==='self';let correct=false,user='',answer='';
  if(it.type==='tf'){correct=['〇','×'][st.choices[ii]]===it.answer;user=st.choices[ii]===undefined?'未選択':['〇','×'][st.choices[ii]];answer=it.answer}
  else if(it.type==='choice'){correct=st.choices[ii]===it.answer;user=st.choices[ii]===undefined?'未選択':it.options[st.choices[ii]];answer=it.options[it.answer]}
  else {user=st.answers[ii]||'未入力';answer=it.answer;correct=it.type==='tool'?st.answers[ii]===it.answer:matches(user,[it.answer,...(it.aliases||[])])}
  const earned=itemScore(si,ii);row.classList.add(manual?(st.checks[ii]?'result-correct':'result-pending'):(correct?'result-correct':'result-wrong'));
  row.innerHTML=`<span class="badge">${manual?'自己採点':correct?'✓ 正解':'× 不正解'}（${earned}/${it.pts}点）</span><div><strong>${esc(it.q)}</strong></div><div class="answer-key">あなたの回答：${esc(user)}<br>${manual?'模範解答':'正解'}：${esc(answer)}</div>${manual?`<label class="self-check"><input type="checkbox" data-check="${ii}" ${st.checks[ii]?'checked':''}> 模範解答と同等の内容を書けていた（${it.pts}点）</label>`:''}`;
  card.appendChild(row);const check=row.querySelector('[data-check]');if(check)check.onchange=()=>{st.checks[ii]=check.checked;row.classList.toggle('result-correct',check.checked);row.classList.toggle('result-pending',!check.checked);row.querySelector('.badge').textContent=`自己採点（${check.checked?it.pts:0}/${it.pts}点）`;updateScore(si)};
 });
 card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="subtotal">${st.score}</span> / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const back=document.createElement('button');back.className='btn';back.textContent='← 回答を修正';back.onclick=()=>renderQuestion(si);nav.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn';next.textContent='次の大問 →';next.onclick=()=>renderQuestion(si+1);nav.appendChild(next)}else{const final=document.createElement('button');final.className='btn';final.textContent='最終結果を見る →';final.onclick=renderFinal;nav.appendChild(final)}card.appendChild(nav);document.getElementById('quiz').appendChild(card)
}
function renderFinal(){document.querySelectorAll('.screen').forEach(e=>e.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner">総合得点：${total} / ${totalPoints}点<br><span style="font-size:1rem">${total>=passMark?'合格':'不合格'}（合格点：${passMark}点）</span></div>`;sections.forEach((s,i)=>{const d=document.createElement('div');d.className='summary-title';d.textContent=`大問 ${i+1}：${state[i].score} / ${s.max}点`;card.appendChild(d)});const account=document.createElement('section');account.className='account-card';account.setAttribute('aria-labelledby','account-heading');account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" name="email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.appendChild(account);const home=document.createElement('a');home.className='btn';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card);setupFinalAccount(total)}

function setupFinalAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='この検定の点数は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数を自動保存しています…';finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2022-beginner',quizTitle:'ドラえもん検定 2022 初級',score:total,total:totalPoints,passThreshold:passMark,answers:window.DoraemonAuth.captureAnswers(sections,state)}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数を保存しました。';saveStatus.dataset.kind='success'}).catch(error=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',error)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{if(mode==='register')await window.DoraemonAuth.register($('account-email').value.trim(),$('account-password').value);else await window.DoraemonAuth.login($('account-email').value.trim(),$('account-password').value);form.reset();setStatus(mode==='register'?'登録してログインしました。':'ログインしました。','success')}catch(error){const m={'auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインをお試しください。','auth/invalid-email':'メールアドレスの形式を確認してください。','auth/weak-password':'パスワードは6文字以上で入力してください。','auth/invalid-credential':'メールアドレスまたはパスワードを確認してください。','auth/too-many-requests':'試行回数が多いため一時的に制限されています。時間をおいて再度お試しください。'};setStatus(m[error.code]||'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=Boolean(user);$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数を自動で記録します。';saveStatus.dataset.kind=''}},error=>{console.error(error);setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error')})}
renderQuestion(0);
</script>
