<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>得点履歴 | ドラえもん検定 過去問題集</title>
  <meta name="description" content="ログイン中のアカウントに保存されたドラえもん検定の得点履歴を確認できます。">
  <link rel="icon" href="https://hena-choco.github.io/favicon.png" type="image/png">
  <style>
    :root { --main-color:#6B9DFF; --bg-color:#f4f7f9; --card-bg:#fff; --text-color:#333; --muted:#667085; --line:#e5eaf1; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg-color); color:var(--text-color); line-height:1.6; padding:20px 12px; }
    .container { max-width:760px; margin:0 auto; }
    .top-nav { margin-bottom:12px; }
    .home-link { display:inline-flex; padding:8px 12px; color:var(--main-color); background:var(--card-bg); border:1px solid #d6e3f8; border-radius:8px; text-decoration:none; font-weight:700; }
    header { text-align:center; margin-bottom:18px; padding:22px 18px; background:var(--main-color); color:#fff; border-radius:14px; }
    h1 { font-size:1.45rem; }
    .subtitle { margin-top:4px; font-size:.9rem; color:rgba(255,255,255,.92); }
    .card { background:var(--card-bg); border-radius:12px; padding:20px; box-shadow:0 2px 8px #0000000d; margin-bottom:16px; }
    .card h2 { font-size:1.08rem; margin-bottom:8px; }
    .status { min-height:1.5em; color:var(--muted); }
    .status[data-kind="error"] { color:#a33; }
    .status[data-kind="success"] { color:#176b45; }
    .auth-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
    .account-email { overflow-wrap:anywhere; font-weight:700; }
    .button { border:0; border-radius:8px; padding:10px 14px; font:inherit; font-weight:700; color:#315a9d; background:#eef3fb; cursor:pointer; }
    .button:disabled { opacity:.55; cursor:wait; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:14px 0 4px; }
    .metric { background:#f7f9fc; border:1px solid var(--line); border-radius:9px; padding:12px; text-align:center; }
    .metric-label { display:block; color:var(--muted); font-size:.8rem; }
    .metric-value { display:block; margin-top:3px; font-size:1.22rem; font-weight:800; color:#315a9d; }
    .record { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:10px; padding:14px 15px 14px 19px; margin-top:10px; background:#fff; }
    .record::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--year-color,var(--main-color)); }
    .record-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .record-title { font-weight:750; }
    .record-date { color:var(--muted); font-size:.82rem; }
    .record-score { white-space:nowrap; font-weight:800; color:#315a9d; }
    .record-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; color:var(--muted); font-size:.86rem; }
    .pill { display:inline-block; padding:2px 8px; border-radius:99px; background:#edf3ff; color:#315a9d; font-weight:700; }
    .pill.fail { background:#f1f2f4; color:#666; }
    details { margin-top:9px; border-top:1px solid #edf0f4; padding-top:8px; }
    summary { color:#315a9d; font-size:.9rem; font-weight:700; cursor:pointer; }
    .detail-content { margin-top:8px; display:grid; gap:8px; }
    .detail-section { background:#f8fafc; padding:10px; border-radius:7px; }
    .detail-section h3 { font-size:.9rem; margin-bottom:5px; }
    .answer-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; padding:5px 0; border-top:1px dashed #e1e6ed; font-size:.84rem; overflow-wrap:anywhere; }
    .answer-row:first-of-type { border-top:0; }
    .muted { color:var(--muted); font-size:.86rem; }
    .empty { padding:18px 10px; text-align:center; color:var(--muted); }
    [hidden] { display:none !important; }
    @media(max-width:560px) { body { padding:12px 8px; } .card { padding:16px; } .summary { grid-template-columns:repeat(2,minmax(0,1fr)); } .record-head { display:block; } .record-score { margin-top:3px; } .answer-row { grid-template-columns:1fr; gap:1px; } }
  </style>
</head>
<body>
<main class="container">
  <nav class="top-nav"><a class="home-link" href="https://hena-choco.github.io/index.html">← 検定一覧へ戻る</a></nav>
  <header><h1>得点履歴</h1><p class="subtitle">ログイン中のアカウントに保存された検定記録</p></header>
  <section class="card" id="auth-card">
    <div class="auth-row"><div><h2>アカウント</h2><p id="auth-status" class="status" role="status" aria-live="polite">ログイン状態を確認しています…</p><p id="signed-in-email" class="account-email" hidden></p></div><button id="logout-button" class="button" type="button" hidden>ログアウト</button></div>
    <div id="signed-out" hidden><p class="muted">得点履歴を見るには、検定ページで使用しているアカウントにログインしてください。</p><a class="home-link" href="https://hena-choco.github.io/index.html">一覧ページでログイン</a></div>
  </section>
  <section id="history-area" hidden>
    <section class="card"><h2>これまでの成績</h2><div class="summary">
      <div class="metric"><span class="metric-label">受験回数</span><strong id="attempt-count" class="metric-value">—</strong></div>
      <div class="metric"><span class="metric-label">平均得点率</span><strong id="average-score" class="metric-value">—</strong></div>
      <div class="metric"><span class="metric-label">最高得点率</span><strong id="best-score" class="metric-value">—</strong></div>
      <div class="metric"><span class="metric-label">合格率</span><strong id="pass-rate" class="metric-value">—</strong></div>
    </div></section>
    <section class="card"><h2>受験履歴</h2><p id="history-status" class="status" role="status" aria-live="polite"></p><div id="records"></div></section>
  </section>
</main>
<script type="module">
import { auth, onAuthStateChanged, signOut, listScores } from "./firebase-auth.js";
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));
const answerText = (value) => {
  if (value == null || value === "") return "未回答";
  if (Array.isArray(value)) return value.map(answerText).join("、");
  if (typeof value === "object") return Object.entries(value).map(([k,v]) => `${k}: ${answerText(v)}`).join(" / ");
  return String(value);
};
function dateText(value) {
  const date = value?.toDate ? value.toDate() : value instanceof Date ? value : null;
  return date ? new Intl.DateTimeFormat("ja-JP", { dateStyle:"medium", timeStyle:"short" }).format(date) : "日時情報なし";
}
function yearColor(record) {
  const id = String(record.quizId || "");
  const year = id.match(/20\d{2}/)?.[0] || String(record.quizTitle || "").match(/20\d{2}/)?.[0];
  const colors = {"2025":"#EADCC9","2024":"#C4B5FD","2023":"#93C5FD","2022":"#D8B4FE","2021":"#CBD5E1","2020":"#A7F3D0","2019":"#FEF08A","2018":"#FCA5A5","2017":"#CFFAFE","2016":"#FED7AA"};
  return colors[year] || "#6B9DFF";
}
function passLine(record) {
  if (Number.isFinite(record.passThreshold)) return record.passThreshold;
  if (record.quizId === "2016-advanced") return 45;
  return record.total * 0.6;
}
function answerDetails(record) {
  if (!record.answers || (Array.isArray(record.answers) && !record.answers.length)) return "この受験記録には解答データが保存されていません。得点のみ表示しています。";
  const sections = Array.isArray(record.answers) ? record.answers : [record.answers];
  return sections.map((section, index) => {
    const sectionName = section.section ?? section.title ?? `大問 ${index + 1}`;
    const sectionScore = Number.isFinite(section.score) ? `（${section.score}点）` : "";
    let rows = "";
    const answers = section.answers;
    if (Array.isArray(answers)) rows = answers.map((item, i) => {
      if (item && typeof item === "object" && ("question" in item || "answer" in item)) {
        const checked = item.selfCheck ?? section.selfCheck?.[i];
        const verdict = item.correct === true || checked === true ? "✓" : item.correct === false ? "×" : "";
        return `<div class="answer-row"><span>${esc(item.question || `設問 ${i+1}`)}</span><span>${esc(answerText(item.answer))}${verdict ? `　${esc(verdict)}` : ""}${item.correctAnswer ? `<br>正解：${esc(answerText(item.correctAnswer))}` : ""}</span></div>`;
      }
      return `<div class="answer-row"><span>設問 ${i+1}</span><span>${esc(answerText(item))}</span></div>`;
    }).join("");
    else if (answers && typeof answers === "object") rows = Object.entries(answers).map(([key, value]) => `<div class="answer-row"><span>${esc(key)}</span><span>${esc(answerText(value))}</span></div>`).join("");
    return `<div class="detail-section"><h3>${esc(sectionName)} ${esc(sectionScore)}</h3>${rows || '<p class="muted">解答の詳細はありません。</p>'}</div>`;
  }).join("");
}
function renderRecords(records) {
  const holder = $("records");
  if (!records.length) { holder.innerHTML = '<p class="empty">まだ得点履歴がありません。ログインした状態で検定を受けると、ここに記録されます。</p>'; return; }
  const valid = records.filter((r) => Number.isFinite(r.score) && Number.isFinite(r.total) && r.total > 0);
  if (!valid.length) { holder.innerHTML = '<p class="empty">表示できる得点記録がありません。</p>'; return; }
  const average = valid.reduce((n,r) => n + r.score / r.total * 100, 0) / valid.length;
  const best = Math.max(...valid.map((r) => r.score / r.total * 100));
  const passed = valid.filter((r) => r.score >= passLine(r)).length;
  $("attempt-count").textContent = `${valid.length}回`;
  $("average-score").textContent = `${average.toFixed(1)}%`;
  $("best-score").textContent = `${best.toFixed(1)}%`;
  $("pass-rate").textContent = `${Math.round(passed / valid.length * 100)}%`;
  holder.innerHTML = valid.map((record) => {
    const ratio = record.score / record.total;
    const passedQuiz = record.score >= passLine(record);
    const title = record.quizTitle || record.quizId || "ドラえもん検定";
    const details = answerDetails(record);
    return `<article class="record" style="--year-color:${yearColor(record)}"><div class="record-head"><div><div class="record-title">${esc(title)}</div><div class="record-date">${esc(dateText(record.createdAt))}</div></div><div class="record-score">${record.score} / ${record.total}点</div></div><div class="record-meta"><span class="pill ${passedQuiz ? "" : "fail"}">${passedQuiz ? "合格" : "不合格"}</span><span>得点率 ${Math.round(ratio*100)}%（合格基準 ${passLine(record)}点）</span></div>${record.answers && (!Array.isArray(record.answers) || record.answers.length) ? `<details><summary>解答・採点内容を見る</summary><div class="detail-content">${details}</div></details>` : ""}</article>`;
  }).join("");
}
$("logout-button").addEventListener("click", async () => { try { await signOut(auth); } catch (error) { $("auth-status").textContent = "ログアウトできませんでした。再度お試しください。"; console.error(error); } });
onAuthStateChanged(auth, async (user) => {
  $("history-area").hidden = !user;
  $("signed-out").hidden = Boolean(user);
  $("logout-button").hidden = !user;
  $("signed-in-email").hidden = !user;
  $("auth-status").textContent = user ? "ログイン中" : "ログインしていません。";
  $("signed-in-email").textContent = user?.email || "";
  if (!user) return;
  $("history-status").textContent = "履歴を読み込んでいます…";
  try { const records = await listScores(); renderRecords(records); $("history-status").textContent = `${records.length}件を読み込みました。`; }
  catch (error) { console.error("Score history load failed", error); $("history-status").textContent = "履歴を読み込めませんでした。通信状態とFirestoreの読み取りルールを確認してください。"; $("history-status").dataset.kind = "error"; }
}, (error) => { console.error("Firebase auth state error", error); $("auth-status").textContent = "ログイン状態を確認できません。ページを再読み込みしてください。"; $("auth-status").dataset.kind = "error"; });
</script>
</body>
</html>
