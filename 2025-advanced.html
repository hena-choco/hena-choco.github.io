<script type="module">

const labels=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'];
const sourceBlocks=["Ⅰ ミオさんとサクラさんは、クラスに「『ドラえもん』という作品の魅力」というテーマでアンケートを取った。以下の＜資料A＞＜資料B＞はそのアンケートに対する回答の一部である。これらを読んで、後の問いに答えよ。なお、「TC」は「てんとう虫コミックス『ドラえもん』」を表す。\n\n＜資料A＞ 『ドラえもん』にはたびたび、「自然」をテーマにした話が登場します。例えば、①【TC26巻に掲載されている】②【「森は生きている」】では、のび太は (A) によってうら山と心をかよわせ、TC33巻③【「さらばキー坊」】ではうら山から持って来た木に (B) をかけて自由に動けるようにする描写があります。 このように、今から50年以上前に連載が開始されたにもかかわらず、今でも十分に通用するメッセージ性を有していることが、『ドラえもん』という作品のもつ深さだと感じます。\n\n＜資料B＞ ドラえもんとのび太たちが織り成す独特の世界に魅力があると感じる。例えば、TC3巻「ゆめの町、ノビタランド」では、遊び場に困ったのび太たちが (C) によってのび太の家の庭に小さな夢の町をつくる。のび太たちはガリバートンネルで小さくなり、その街で存分に楽しむことができた。このような、子どもたちの④【「〜したい」】をかなえてくれるような無邪気な世界観こそが『ドラえもん』の魅力だと感じる。\n\n問1. 空欄 (A) 〜 (C) にそれぞれ当てはまるひみつ道具を答えよ。\n\n問2. 下線部①について、ミオさんとサクラさんが26巻に収録されている作品について会話をしている。次の会話文中の (a)、(b) に入る語句の組み合わせとして最も適切なものを選択肢①〜④のうちから一つ選べ。\n\nミオ：サクラちゃん、サクラちゃん、TC26巻には他にもいろんな魅力的な作品が収録されているね！ サクラ：そうだね、ミオちゃん。「自然」という観点からみると、他にも「水はみていた」という作品も収録されているね。 ミオ：ドラえもんが「水ビデオ」というひみつ道具を使って、水が過去に見てきた風景を見る話だね！ サクラ：まず、ドラえもんが映画館の天井に水をつくって、水ビデオでのび太と一緒に (a) という映画を見るよね。 ミオ：そうそう！その次にのび太が取ってきた (b) の水が見てきた映像を見るんだよね！ サクラ：そうだね。これらの映像を見て面白がったのび太は、どこでもドアを使って色んな所の水を取りに行くんだよね。 ミオ：最終的にとっても感動的な結末になる、心温まる話だよね！\n\n① a: 大魔神 b: 水たまり ② a: 大魔神 b: 水道 ③ a: 大魔術 b: 水たまり別 ④ a: 大魔術 b: 水道\n\n問3. 下線部②について、以下のア〜エは「森は生きている」の作品内で起こった出来事である。作品内での順番通りに並べ替えよ。\n\nア：ハートの形の雲が舞う イ：地面がへこんでスネ夫とジャイアンが落ちる ウ：木の葉が集まってベッドのようになる エ：のび太がオレンジ色の木の実を食べる\n\n問4. 下線部③について、後の選択肢ア〜ウのうち、「さらばキー坊」の作品内で起こったこととして当てはまるものをすべて選び、その組み合わせとして最も適切なものを後の①〜⑦のうちから1つ選び、記号で答えよ。\n\nア：うら山にゴルフ場建設の計画が持ち上がる。 イ：キー坊が伐採された木を見てショックを受ける。 ウ：のび太がキー坊の存在をしずか、スネ夫、ジャイアンに伝える。\n\n① ア ② イ ③ ウ ④ アとイ ⑤ アとウ ⑥ イとウ ⑦ アとイとウ\n\n問5. 下線部④について、ドラえもんの作品には、のび太たちの願望を叶えるためにひみつ道具が登場する、というケースが多くある。以下のひみつ道具は、どんな願望をかなえるために登場したか、（例）を参考に、①〜③をそれぞれ具体的に答えよ。\n\n(例) TC6巻「さようなら、ドラえもん」に登場する「ねむらなくてもつかれないくすり」→ 2人で朝まで話したい\n\n① TC9巻「デンデンハウスは気楽だな」に登場する「デンデンハウス」 ② TC21巻「恐竜が出た!?」に登場する「ビッグライト」 ③ TCプラス4巻「災難予報機」に登場する「石ころぼうし」","Ⅱ 次の文章を読んで、後の問いに答えよ。\n\n『ドラえもん』には移動の描写が多く登場する。移動の様子は、一瞬で移動をするものから比較的現代の乗り物に近いものまであり、幅が広い。一瞬で移動をするものとしては、どこでもドアが有名であるが、ほかにも『百年後のフロク』では①【サイコロの出目に合わせて行き先を決定し】、一瞬で目的地に移動するという描写がある。また、『のび太の宇宙開拓史』では②【のび太の部屋の畳がロップルの宇宙船の扉とつながってしまう】ということが話の展開において非常に重要である。 現在までに実現している交通機関をモデルとしたひみつ道具や話もある。「のび太航空」は、ひみつ道具「三輪飛行機」で航空会社を始めるという話であり、多彩な利用者がいる中、ジャイアンは飛行機を③【ハイジャック】し、④【香港に向かうよう】にのび太に要求する。「ブルートレインはぼくの家」では、ひみつ道具「ブルートレインセット」を使用していたが、この時に掲げられたヘッドマークから列車名は (A) ということがわかる。「地下鉄をつくっちゃえ」では、のび太とドラえもんが、⑤【パパへのプレゼントとして】、野比家から会社まで直通の地下鉄を建設しようとする。 現実世界でも『ドラえもん』は乗り物と大きくかわっている。ドラえもんのデザインを取り入れた乗り物も少なくない。例えば、『映画ドラえもんのび太とふしぎ風使い』で登場するひみつ道具 (B) がプロモーションのため現実でも制作された。また、ラッピング車両も数多く登場している。⑥【藤子・F・不二雄ミュージアム】運行バスは藤子・F・不二雄のキャラクターがあしらわれたバス車両（ナンバーは2112である）が使用されている。2025年7月現在走行中のバスは、川崎市のホームページによると「ドラえもん号」、「エスパー魔美号」、「キテレツ大百科号」、「パーマン号」の4種類である。鉄道においても、様々なラッピング車両がある。小田急電鉄は以前「F-Train」「F-Train Ⅱ」を、西武鉄道は以前「DORAEMON-GO!」を、JR北海道においても (C) を運行していた。JR北海道では、これに合わせて、車内放送をドラえもんとのび太が担当し、(D) 駅では観光用に駅構内に「ドラえもん海底ワールド」という施設がもうけられていた。さらに⑦【富山県高岡市】と射水市を結ぶ万葉線にはドラえもんのLRTが走っている。飛行機や空港ともドラえもんはコラボしてきている。例えば、JALは「JAL ドラえもんジェット」など、『ドラえもん』とコラボした機体を運航した。また、新千歳空港には2025年7月14日まで (E) が営業していた。\n\n問1. 空欄 (A) 〜 (E) にそれぞれ当てはまる語句を答えよ。\n\n問2. 下線部①について、サイコロの出目で行き先を決定するとあるが、実際にジャイアンが行った場所を、以下から選んで記号で答えよ。\n\n1. 札幌 2. 大阪 3. 博多 4. 岡山 \n問3. 下線部②について、2005年のリニューアル以降、アニメにおいてのび太の部屋は基本的にカーペット敷となっている一方、『映画ドラえもん 新・のび太の宇宙開拓史』では畳に戻っていた。この変化を正当化するために、作中で提示されていた理由を述べよ。\n\n問4. 下線部③に関連して、「大予告「地球の滅びる日」に登場する暗号文中の「ゴリラ、キツネより機能の長をえらぼう」という一部について、スネ夫は「飛行機ハイジャック事件の犯人と機長がそれぞれゴリラ、キツネに似ている」と解釈した。この暗号文について、後の問いに答えよ。\n\n(i) 「ター屋を開く 無音バス贈る」という一部について、スネ夫の解釈と暗号文の著者の意図に沿った解釈を、暗号文の著者の名前についても言及しながら述べよ。 (ii) この暗号文の正体について作中でのび太たちが議論していたが、そこでジャイアンはどのようなタイトルの本だと言っていたか。そのタイトルをジャイアンのセリフと一致するように答えよ。\n\n問5. 下線部④について、「100%ドラえもん＆フレンズ展」は香港で初めて開催されたのち、世界中の各都市を巡回している。2025年7月までに香港以外に巡回した都市をすべて答えよ。都市名は正式名称でなくても、採点者に通じるものであればよい。\n\n問6. 下線部⑥について、このプレゼントはどのような記念日に送られたものか、漫画版における設定に準拠し、以下から選んで記号で答えよ。\n\n1. パパの誕生日 2. 父の日 3. 勤労感謝の日 4. クリスマス \n問7. 下線部⑦について、藤子・F・不二雄ミュージアム本館の館、2019年に竣工した増築棟「ドラと機」の意匠は、あるエピソード中の数頁分のコマ割りと一致している。そのエピソードのタイトルを答えよ。\n\n問8. 下線部⑦について、富山県高岡市と『ドラえもん』に関する以下の問いに答えよ。\n\n(i) 高岡駅前広場には、ドラえもんの形をした巨大なポストが設置されている。このポストに用いられた高岡の伝統工芸を答えよ。 (ii) 高岡古城公園の動物園にある絵筆塔には数々の著名な漫画家の絵が載せられているが、藤子・F・不二雄の担当した面において、ドラえもんはどのような姿で描かれているか。一語で答えよ。","Ⅲ 次の文章を読んで、後の問いに答えよ。\n\nてんとう虫コミックス『ドラえもん』第11巻「からだの部品とりかえっこ」は、①【のび太がしずかを、行き先を裏山と告げずに誘う】場面から始まる。②【しずかは嫌がるも、しぶしぶついていく】。のび太と裏山に到着すると、ドラえもんは既に (A) という道具を出していた。この道具を使うと、ほかの人と体の部品を取り替えることができるようだ。この道具を使い、のび太としずかの (B) を交換した。のび太は (B) を交換した後、ドラえもん・スネ夫・ジャイアンの順に体の部品を交換することになり、最終的に登場人物たちも、③【自分の体のどの部品が誰のものかわからず混乱】してしまう。オチのコマの下では、(B) だけが入れ替わった状態で (C) が (D) を追いかけまわしている絵がある。また、『ドラえもん』には、(A) 以外にも④【体の一部や全部を“交換”するようなひみつ道具】が多く登場する。\n\n問1. 空欄 (A) 〜 (D) にそれぞれ当てはまる語句や登場人物名を答えよ。\n\n問2. 下線部①について、のび太は「ある目的」があってしずかを裏山に誘い、(B) を交換した。しかし、「ある目的」は達成できなかった。そこで、 (1) 「ある目的」とは何か、のび太の発言に即して答えよ。 (2) 「ある目的」が達成できなかったのはなぜか、ドラえもんの発言に即して答えよ。\n\n問3. 下線部②について、しずかが裏山に行くのを嫌がった理由を、以下から選んで記号で答えよ。\n\n1. 宿題をしていたから 2. ピアノのおけいこがあるから \n2. テレビを観ていたから 4. 読書していたから \n問4. 下線部③の交換された部品について、エピソード終了時点の状態を考え、次の問いに答えよ。 (1) 「しずかの手」は誰についているか。 (2) 次の文が正しければ〇、誤りなら×と解答しなさい。 (i) ドラえもんを元に戻すことだけを考えるとのび太と足を交換すればよい。 (ii) のび太は、自身含め3人以上の部品がついている。\n\n問5. 下線部④について、相手を写すと1分間だけ体を取り替えられるひみつ道具は何か。","Ⅳ テレビアニメ『ドラえもん』は2005年4月に声優やスタッフを一新した大幅なリニューアルが行われ、今年で20周年を迎えた（ドラえもん研究会も今年で20周年である）。2005年4月以降に放映されたエピソードに関する以下の問題について、解答として最も適切な選択肢を一つ選びなさい。\n\n問1. 「ピノキオの花」（2007年11月2日放送）にて、しずかが出木杉と行こうとしていたのはどこか。\n\n1. 空き地 2. 裏山 3. 図書館 4. 美術館 \n問2. 「スネ夫、美容院へ行く」（2008年2月1日放送）にて、スネ夫の髪型をアレンジした美容師が最近ハマっていると言ったのは何か。\n\n1. サンバ 2. フラメンコ 3. コサックダンス 4. 阿波踊り \n問3. 「いそうろうジャイアン」（2009年6月12日放送）にて、ジャイアンが野比家で食べたものに当てはまらないものは何か。\n\n1. どら焼き 2. おせんべい 3. シュークリーム 4. カステラ \n問4. 「激突お菓子ランド」（2010年10月15日放送）に登場するお菓子の国の川には、何が流れているか。\n\n1. オレンジジュース 2. サイダー 3. 水飴 4. かき氷のシロップ \n問5. 「あなたの良い所もらいます」（2011年10月7日放送）にて、ドラえもんの脚が短いとバカにしたタロはどこでどの頭か。\n\n1. 2丁目の鈴木さんち 2. 3丁目の佐々木さんち \n2. 4丁目の松本さんち 4. 5丁目の田中さんち \n問6. 「参上！ムシムシヒーロー！！」（2012年7月6日放送）にて、のび太が最初に変身したのは何色のヒーローか。\n\n1. 蚊 2. カマキリ 3. クモ 4. バッタ \n問7. 「怪盗のび太参上！」（2013年2月15日放送）にて、ジャイアンが当てたのは何の恐竜のカードか。\n\n1. ティラノサウルス 2. トリケラトプス 3. プテラノドン 4. ヴェロキラプトル \n問8. 「ふつうの交換機」（2014年6月20日放送）にて、のび太はゴロゴロコミックを野球のチケットと交換したが、その試合の日は別の予定が入っていた。それは何の予定か。\n\n1. しずかと遊ぶ 2. 新発売のゲームを買いに行く \n2. ママの買い物についていく 4. パパと釣りに行く \n問9. 「大人になりたい」（2015年5月22日放送）にて、のび太が変装服を使って変装した青年の名前は何か。\n\n1. みちお 2. しげる 3. ひろし 4. かずや \n問10. 「熱血！ドッジボール」（2016年11月4日放送）にて行われたドッジボール大会でのジャイアンツの最初の対戦相手は何というチームか。\n\n1. アタッカーZ 2. ジョンソン8 3. ファイヤーX 4. ブルーハワイアンズ \n問11. 「地球エレベーター」（2017年1月13日放送）にて、のび太がアマゾンから日本に持ち帰った魚は何か。\n\n1. オキシドラス 2. ダンバキー 3. ピーコックバス 4. ピライーバ \n問12. 「裏山危険生物パーク」（2018年4月27日放送）のラストで、ジャイアンはほんもの図鑑の中に入ってしまうが、何の動物と同じページに入ったか。\n\n1. ヒグマ 2. ライオン 3. クーガー 4. ワニ \n問13. 「シャボン玉宅配便」（2019年5月31日放送）にて、のび太たちが出会った迷子の犬の名前は何か。\n\n1. コロ 2. モカ 3. ポチ 4. ラン \n問14. 「記念日シール」（2020年2月29日放送）にて、のび太たちは日本代表としてワールドカップに出場したが、その決勝戦での対戦相手国はどこか。\n\n1. アメリカ 2. アルゼンチン 3. オーストラリア 4. ブラジル \n問15. 「アマガエール」（2022年6月18日放送）にて、のび太がママに頼まれたお買い物の品物に当てはまらないものは何か。\n\n1. ティッシュ 2. カレー粉 3. マヨネーズ 4. フランスパン \n問16. 「しずかの焼きイモ交響楽」（2024年3月16日放送）に登場する世界的ヴァイオリニストの名前は何か。\n\n1. はかせ太郎 2. ひかせ太郎 3. さかせ太郎 4. たかせ太郎","Ⅴ 2025年9月6日、2026年に公開予定の『映画ドラえもん』のタイトルが「新・のび太の海底鬼岩城」であることが発表された。その原作となる大長編ドラえもん『のび太の海底鬼岩城』について、以下の問いに答えよ。\n\n問1. バミューダ諸島の沖で発見された沈没船には、およそ何億円の宝が積み込まれていたか。\n\n問2. のび太が夏休みの宿題を全て終わらせたのは何日目のいつか。\n\n問3. のび太が宿題を終わらせた日の夜に、ブラジル沖で「ある船」が謎の航行を目撃した。「ある船」の名称を答えよ。\n\n問4. ドラえもんが1日目のキャンプ場所にて、景色を綺麗にするために出したひみつ道具を正確に答えよ。\n\n問5. ドラえもんたちは海底をドライブ中、サンキャクウオに出会った。このサンキャクウオが見つけたエサは何という生き物か。\n\n問6. 魔の三角海域と呼ばれる海域を構成している3点は、フロリダ半島の先とバミューダ島とあと一つは何か。\n\n問7. スネ夫のママによると、スネ夫は本来この夏休みにどこへ避暑に行くはずだったか。\n\n問8. しずかがマリアナ海溝の底で最初に見つけた生物は何か。\n\n問9. ドラえもんたちが見つけた幽霊船が出航したのは何年何月のことか。\n\n問10. のび太はバティスフィアを「何ほどある怪魚」と形容したか。\n\n問11. ドラえもんたちがキャンプ2日目に夕食として食べた料理をすべて答えよ。\n\n問12. スネ夫とジャイアンは海底人による精神鑑定の結果、凶悪性と何性が幸いしたか。\n\n問13. ムー連邦の国境に植えられているものは何か。\n\n問14. 鬼岩城へ乗り込む際に、ジャイアンが武器として持っていったひみつ道具は何か。","Ⅵ \n\n2025-advancedVI.webp","Ⅶ 『てんとう虫コミックス『ドラえもん』』第1〜45巻に収録されているエピソードのうち、「のび太のおよめさん」のように、タイトルが「のび太の」から始まるものをできるだけ多く答えなさい。"];
const sections=[

sections[0].reading=`Ⅰ ミオさんとサクラさんは、クラスに「『ドラえもん』という作品の魅力」というテーマでアンケートを取った。以下の＜資料A＞＜資料B＞はそのアンケートに対する回答の一部である。これらを読んで、後の問いに答えよ。なお、「TC」は「てんとう虫コミックス『ドラえもん』」を表す。

＜資料A＞ 『ドラえもん』にはたびたび、「自然」をテーマにした話が登場します。例えば、①【TC26巻に掲載されている】②【「森は生きている」】では、のび太は (A) によってうら山と心をかよわせ、TC33巻③【「さらばキー坊」】ではうら山から持って来た木に (B) をかけて自由に動けるようにする描写があります。 このように、今から50年以上前に連載が開始されたにもかかわらず、今でも十分に通用するメッセージ性を有していることが、『ドラえもん』という作品のもつ深さだと感じます。

＜資料B＞ ドラえもんとのび太たちが織り成す独特の世界に魅力があると感じる。例えば、TC3巻「ゆめの町、ノビタランド」では、遊び場に困ったのび太たちが (C) によってのび太の家の庭に小さな夢の町をつくる。のび太たちはガリバートンネルで小さくなり、その街で存分に楽しむことができた。このような、子どもたちの④【「〜したい」】をかなえてくれるような無邪気な世界観こそが『ドラえもん』の魅力だと感じる。`;

sections[0].items[1].q=`問2. 下線部①について、ミオさんとサクラさんが26巻に収録されている作品について会話をしている。次の会話文中の (a)、(b) に入る語句の組み合わせとして最も適切なものを選択肢①〜④のうちから一つ選べ。

ミオ：サクラちゃん、サクラちゃん、TC26巻には他にもいろんな魅力的な作品が収録されているね！ サクラ：そうだね、ミオちゃん。「自然」という観点からみると、他にも「水はみていた」という作品も収録されているね。 ミオ：ドラえもんが「水ビデオ」というひみつ道具を使って、水が過去に見てきた風景を見る話だね！ サクラ：まず、ドラえもんが映画館の天井に水をつくって、水ビデオでのび太と一緒に (a) という映画を見るよね。 ミオ：そうそう！その次にのび太が取ってきた (b) の水が見てきた映像を見るんだよね！ サクラ：そうだね。これらの映像を見て面白がったのび太は、どこでもドアを使って色んな所の水を取りに行くんだよね。 ミオ：最終的にとっても感動的な結末になる、心温まる話だよね！`;

sections[0].items[3].q=`問4. 下線部③について、後の選択肢ア〜ウのうち、「さらばキー坊」の作品内で起こったこととして当てはまるものをすべて選び、その組み合わせとして最も適切なものを後の①〜⑦のうちから1つ選び、記号で答えよ。

sections[1].reading=`Ⅱ 次の文章を読んで、後の問いに答えよ。

『ドラえもん』には移動の描写が多く登場する。移動の様子は、一瞬で移動をするものから比較的現代の乗り物に近いものまであり、幅が広い。一瞬で移動をするものとしては、どこでもドアが有名であるが、ほかにも『百年後のフロク』では①【サイコロの出目に合わせて行き先を決定し】、一瞬で目的地に移動するという描写がある。また、『のび太の宇宙開拓史』では②【のび太の部屋の畳がロップルの宇宙船の扉とつながってしまう】ということが話の展開において非常に重要である。 現在までに実現している交通機関をモデルとしたひみつ道具や話もある。「のび太航空」は、ひみつ道具「三輪飛行機」で航空会社を始めるという話であり、多彩な利用者がいる中、ジャイアンは飛行機を③【ハイジャック】し、④【香港に向かうよう】にのび太に要求する。「ブルートレインはぼくの家」では、ひみつ道具「ブルートレインセット」を使用していたが、この時に掲げられたヘッドマークから列車名は (A) ということがわかる。「地下鉄をつくっちゃえ」では、のび太とドラえもんが、⑤【パパへのプレゼントとして】、野比家から会社まで直通の地下鉄を建設しようとする。 現実世界でも『ドラえもん』は乗り物と大きくかわっている。ドラえもんのデザインを取り入れた乗り物も少なくない。例えば、『映画ドラえもんのび太とふしぎ風使い』で登場するひみつ道具 (B) がプロモーションのため現実でも制作された。また、ラッピング車両も数多く登場している。⑥【藤子・F・不二雄ミュージアム】運行バスは藤子・F・不二雄のキャラクターがあしらわれたバス車両（ナンバーは2112である）が使用されている。2025年7月現在走行中のバスは、川崎市のホームページによると「ドラえもん号」、「エスパー魔魔号」、「キテレツ大百科号」、「パーマン号」の4種類である。鉄道においても、様々なラッピング車両がある。小田急電鉄は以前「F-Train」「F-Train Ⅱ」を、西武鉄道は以前「DORAEMON-GO!」を、JR北海道においても (C) を運行していた。JR北海道では、これに合わせて、車内放送をドラえもんとのび太が担当し、(D) 駅では観光用に駅構内に「ドラえもん海底ワールド」という施設がもうけられていた。さらに⑦【富山県高岡市】と射水市を結ぶ万葉線にはドラえもんのLRTが走っている。飛行機や空港ともドラえもんはコラボしてきている。例えば、JALは「JAL ドラえもんジェット」など、『ドラえもん』とコラボした機体を運航した。また、新千歳空港には2025年7月14日まで (E) が営業していた。`;

sections[1].items[3].q=`問4. 下線部③に関連して、「大予告「地球の滅びる日」に登場する暗号文中の「ゴリラ、キツネより機能の長をえらぼう」という一部について、スネ夫は「飛行機ハイジャック事件の犯人と機長がそれぞれゴリラ、キツネに似ている」と解釈した。この暗号文について、後の問いに答えよ。

(i) 「ター屋を開く 無音バス贈る」という一部について、スネ夫の解釈と暗号文の著者の意図に沿った解釈を、暗号文の著者の名前についても言及しながら述べよ。
(ii) この暗号文の正体について作中でのび太たちが議論していたが、そこでジャイアンはどのようなタイトルの本だと言っていたか。そのタイトルをジャイアンのセリフと一致するように答えよ。`;

sections[1].items[7].q=`問8. 下線部⑦について、富山県高岡市と『ドラえもん』に関する以下の問いに答えよ。

(i) 高岡駅前広場には、ドラえもんの形をした巨大なポストが設置されている。このポストに用いられた高岡の伝統工芸を答えよ。

sections[2].reading=`Ⅲ 次の文章を読んで、後の問いに答えよ。

てんとう虫コミックス『ドラえもん』第11巻「からだの部品とりかえっこ」は、①【のび太がしずかを、行き先を裏山と告げずに誘う】場面から始まる。②【しずかは嫌がるも、しぶしぶついていく】。のび太と裏山に到着すると、ドラえもんは既に (A) という道具を出していた。この道具を使うと、ほかの人と体の部品を取り替えることができるようだ。この道具を使い、のび太としずかの (B) を交換した。のび太は (B) を交換した後、ドラえもん・スネ夫・ジャイアンの順に体の部品を交換することになり、最終的に登場人物たちも、③【自分の体のどの部品が誰のものかわからず混乱】してしまう。オチのコマの下では、(B) だけが入れ替わった状態で (C) が (D) を追いかけまわしている絵がある。また、『ドラえもん』には、(A) 以外にも④【体の一部や全部を“交換”するようなひみつ道具】が多く登場する。`;

// 問題文（reading）と設問（各 item.q）を分離し、各入力欄の直前に設問を表示する。
function separateReadingAndQuestions(block){
  const starts=[...block.matchAll(/(?:^|\n\n)(問\d+\.)/g)].map(m=>m.index+m[0].lastIndexOf('問'));
  if(!starts.length)return{reading:block.trim(),questions:[]};
  const reading=block.slice(0,starts[0]).trim();
  const questions=starts.map((start,i)=>block.slice(start,starts[i+1]??block.length).trim().split(/\n\n(?=(?:[1-4][.．]|①|A[.．]))/)[0].trim());
  return{reading,questions};
}
const separated=sourceBlocks.map(separateReadingAndQuestions);

  const q=separated[1].questions;
  const splitSub=(text,marker)=>{const at=text.indexOf(marker);return at<0?[text,'']: [text.slice(0,at).trim(),text.slice(at+marker.length).trim()]};
  const q4=splitSub(q[3],'(ii)'),q8=splitSub(q[7],'(ii)');
  item.q=i===3?q4[0]:i===4?`問4(ii). ${q4[1]}`:i===8?q8[0]:i===9?`問8(ii). ${q8[1]}`:q[i<3?i:i-1<7?i-1:i-2];
});

});

const state=sections.map(()=>({answers:{},choices:{},manual:{},score:0}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・]/g,'');

function renderQuestion(si){document.querySelectorAll('.screen').forEach(x=>x.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${labels[si]} <span class="points">（${s.max}点満点）</span></h2>${s.reading?`<div class="reading">${esc(s.reading)}</div>`:''}${s.image?`<div class="image-container"><img src="${esc(s.image)}" alt="大問Ⅵの問題画像"></div>`:''}`;s.items.forEach((it,ii)=>{const b=document.createElement('div');b.className='question-block';let html=`<div class="q-title">${esc(it.q)}</div>`;it.fields.forEach((f,fi)=>{const id=`${ii}_${fi}`;if(f.kind==='choice'){html+=`<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[id]===j?'selected':''}" data-choice="${id}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`}else{html+=`${f.label?`<strong>${esc(f.label)}</strong>`:''}<input class="text-input" type="text" data-answer="${id}" value="${esc(st.answers[id]||'')}" placeholder="${f.kind==='list'?'回答を区切って入力':'回答を入力'}">`}});b.innerHTML=html;card.appendChild(b)});const nav=document.createElement('div');nav.className='nav-row';if(si>0){const prev=document.createElement('button');prev.className='btn';prev.textContent='← 前の大問';prev.onclick=()=>renderQuestion(si-1);nav.append(prev)}else{const spacer=document.createElement('span');spacer.className='nav-placeholder';nav.append(spacer)}const submit=document.createElement('button');submit.className='btn';submit.textContent='回答を採点する →';submit.onclick=()=>gradeSection(si);nav.append(submit);card.append(nav);document.getElementById('quiz').append(card);card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[x.dataset.answer]=x.value);card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.choices[x.dataset.choice]=Number(x.dataset.value);x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))})}
function resultItem(si,ii){const it=sections[si].items[ii],st=state[si],out=[];let earned=0,max=0;it.fields.forEach((f,fi)=>{const id=`${ii}_${fi}`;if(f.kind==='choice'){const ok=st.choices[id]===f.key,pts=ok?f.pts:0;earned+=pts;max+=f.pts;out.push({id,label:'',user:st.choices[id]===undefined?'未選択':f.options[st.choices[id]],answer:f.options[f.key],pts,max:f.pts,ok})}else if(f.kind==='multi'){const chosen=f.answers.filter(a=>norm(st.answers[id]||'').includes(norm(a)));const uniq=[...new Set(chosen)];const pts=Math.min(f.max,uniq.length*f.ptsEach);earned+=pts;max+=f.max;out.push({id,label:'',user:st.answers[id]||'未入力',answer:f.answers.join('、'),pts,max:f.max,ok:pts===f.max})}else if(f.kind==='list'){const values=(st.answers[id]||'').split(/[、,，\n\r;；]+/).map(x=>norm(x).replace(/^のび太の/,'' )).filter(Boolean);const accepted=new Set(f.answers.map(norm));const good=[...new Set(values.filter(x=>accepted.has(x)))];const pts=Math.min(f.max,good.length*f.ptsEach);earned+=pts;max+=f.max;out.push({id,label:'',user:st.answers[id]||'未入力',answer:f.answers.join('、'),pts,max:f.max,ok:pts===f.max})}else{const value=st.answers[id]||'',ok=correct(value,f.answer,f.aliases);const pts=f.manual?Number(st.manual[id]||0):(ok?f.pts:0);earned+=pts;max+=f.pts;out.push({id,label:'',user:value||'未入力',answer:f.answer,pts,max:f.pts,ok:pts===f.pts,manual:!!f.manual})}});return{earned,max,out,q:it.q}}
function gradeSection(si){const s=sections[si],st=state[si];st.score=s.items.reduce((n,it,ii)=>n+resultItem(si,ii).earned,0);renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(x=>x.remove());const s=sections[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>大問 ${labels[si]} 採点結果</h2>`;s.items.forEach((it,ii)=>{const r=resultItem(si,ii),row=document.createElement('div');row.className='result-item';row.classList.add(r.earned===r.max?'result-correct':r.out.some(x=>x.manual)?'result-pending':'result-wrong');let html=`<span class="badge">${r.earned===r.max?'✓ 正解':r.out.some(x=>x.manual)?'自己採点':'× 不正解'}（${r.earned}/${r.max}点）</span><div><strong>${esc(it.q)}</strong></div>`;r.out.forEach(x=>{html+=`<div class="answer-key">あなたの回答：${esc(x.user||'未入力')}<br>模範解答：${esc(x.answer)}</div>`;if(x.manual)html+=`<label class="self-check"><input type="checkbox" data-manual="${x.id}" data-max="${x.max}" ${state[si].manual[x.id]>=x.max?'checked':''}> 模範解答と同等の内容を書けていた（${x.max}点）</label>`});row.innerHTML=html;card.appendChild(row);row.querySelectorAll('[data-manual]').forEach(box=>box.onchange=()=>{state[si].manual[box.dataset.manual]=box.checked?Number(box.dataset.max):0;state[si].score=s.items.reduce((n,_,j)=>n+resultItem(si,j).earned,0);const totalElement=document.getElementById('section-total');if(totalElement)totalElement.textContent=`大問得点：${state[si].score} / ${s.max}点`;renderResult(si)})});card.insertAdjacentHTML('beforeend',`<div class="score-banner">大問得点：<span id="section-total">${state[si].score}</span> / ${s.max}点</div>`);const nav=document.createElement('div');nav.className='nav-row';const edit=document.createElement('button');edit.className='btn';edit.textContent='← 回答を修正';edit.onclick=()=>renderQuestion(si);nav.append(edit);const next=document.createElement('button');next.className='btn';next.textContent=si<sections.length-1?'次の大問 →':'最終結果を見る →';next.onclick=()=>si<sections.length-1?renderQuestion(si+1):renderFinal();nav.append(next);card.append(nav);document.getElementById('quiz').append(card)}

function renderFinal(){document.querySelectorAll('.screen').forEach(x=>x.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner ${total>=129.3?'pass':''}">総合得点：${total} / 200点<div style="font-size:1.1rem;margin-top:8px">${total>=129.3?'合格':'不合格'}</div><div style="font-size:.85rem">合格ライン：129.3点以上</div></div>`;sections.forEach((s,i)=>{const x=document.createElement('div');x.className='result-section-title';x.textContent=`${labels[i]}：${state[i].score} / ${s.max}点`;card.appendChild(x)});const account=document.createElement('section');account.className='account-card';account.innerHTML=`<h2 id="account-heading">ログイン・新規登録</h2><p id="account-status" class="account-status" role="status" aria-live="polite">ログイン状態を確認しています…</p><div id="signed-out-panel" hidden><form id="account-form" class="account-form" novalidate><label for="account-email">メールアドレス<input id="account-email" type="email" autocomplete="email" required></label><label for="account-password">パスワード（6文字以上）<input id="account-password" type="password" autocomplete="current-password" minlength="6" required></label><div class="account-actions"><button id="submit-account" class="account-button primary" type="submit">ログイン</button></div></form><p class="account-switch"><span id="switch-prompt">初めての方はこちら：</span><button id="switch-mode" type="button">新規アカウント作成</button></p></div><div id="signed-in-panel" class="account-signed-in" hidden><p>ログイン中：<strong id="account-user-email"></strong></p><div class="account-actions"><button id="logout-button" class="account-button secondary" type="button">ログアウト</button></div></div><p id="score-save-status" class="account-status" role="status" aria-live="polite">ログインすると、この検定の点数と解答を自動で記録します。</p><button id="retry-score-save" class="account-button secondary" type="button" hidden>保存を再試行</button>`;card.append(account);const home=document.createElement('a');home.className='btn-submit';home.href='https://hena-choco.github.io/index.html';home.textContent='問題一覧へ戻る';card.append(home);document.getElementById('quiz').append(card);setupAccount(total)}
function setupAccount(total){const $=id=>document.getElementById(id),status=$('account-status'),saveStatus=$('score-save-status'),form=$('account-form'),submit=$('submit-account'),retry=$('retry-score-save');let mode='login';const setStatus=(m,k='')=>{status.textContent=m;status.dataset.kind=k};const save=async()=>{if(finalScoreSaved){saveStatus.textContent='点数と解答は保存済みです。';saveStatus.dataset.kind='success';return}if(finalScoreSavePromise)return finalScoreSavePromise;saveStatus.textContent='点数と解答を自動保存しています…';const answers=sections.map((s,si)=>({section:labels[si],score:state[si].score,answers:s.items.map((it,ii)=>{const r=resultItem(si,ii);return{question:it.q,earned:r.earned,maxPoints:r.max,answer:r.out.map(o=>o.user).join(' / '),correctAnswer:r.out.map(o=>o.answer).join(' / '),correct:r.earned===r.max}})}));finalScoreSavePromise=window.DoraemonAuth.saveScore({quizId:'2025-advanced',quizTitle:'ドラえもん検定 2025年度 上級',score:total,total:200,passThreshold:129.3,answers}).then(()=>{finalScoreSaved=true;retry.hidden=true;saveStatus.textContent='点数と解答を保存しました。';saveStatus.dataset.kind='success'}).catch(e=>{finalScoreSavePromise=null;retry.hidden=false;saveStatus.textContent='点数を保存できませんでした。通信状態やFirestoreの設定を確認してください。';saveStatus.dataset.kind='error';console.error('Score save failed',e)});return finalScoreSavePromise};const setMode=m=>{mode=m;const reg=m==='register';submit.textContent=reg?'アカウントを作成':'ログイン';$('switch-prompt').textContent=reg?'すでにアカウントをお持ちの方はこちら：':'初めての方はこちら：';$('switch-mode').textContent=reg?'ログイン':'新規アカウント作成';$('account-password').autocomplete=reg?'new-password':'current-password';setStatus(reg?'メールアドレスと6文字以上のパスワードで登録できます。':'ログインすると点数を保存できます。')};$('switch-mode').onclick=()=>setMode(mode==='login'?'register':'login');form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;setStatus(mode==='register'?'アカウントを作成しています…':'ログインしています…');try{await window.DoraemonAuth[mode==='register'?'register':'login']($('account-email').value.trim(),$('account-password').value);form.reset();setStatus('ログインしました。','success')}catch(error){setStatus(error.code==='auth/invalid-credential'?'メールアドレスまたはパスワードを確認してください。':'処理に失敗しました。入力内容とFirebaseの設定を確認してください。','error')}finally{submit.disabled=false}};$('logout-button').onclick=async()=>{try{await window.DoraemonAuth.logout();setStatus('ログアウトしました。','success')}catch{setStatus('ログアウトできませんでした。','error')}};retry.onclick=save;window.DoraemonAuth.onAuthStateChanged(user=>{$('signed-out-panel').hidden=!!user;$('signed-in-panel').hidden=!user;$('account-user-email').textContent=user?.email||'';if(user){setStatus('ログイン中です。','success');save()}else{setMode(mode);saveStatus.textContent='ログインすると、この検定の点数と解答を自動で記録します。';saveStatus.dataset.kind=''}},()=>setStatus('ログイン状態を確認できません。ページを再読み込みしてください。','error'))}
