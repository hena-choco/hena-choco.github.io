{title:'「のび太の」から始まるエピソード',max:30,reading:'Ⅶ てんとう虫コミックス『ドラえもん』第1〜45巻に収録されているエピソードのうち、「のび太のおよめさん」のように、タイトルが「のび太の」から始まるものをできるだけ多く答えなさい。各1作品2点（最大30点）。「のび太の」の表記は省略できます。「のび太のおよめさん」は例示のため採点対象外です。',items:[{q:'作品名を入力（複数ある場合は、読点・カンマ・改行で区切ってください）',fields:[{kind:'list',answers:['恐竜','結婚前夜','スペースシャトル','地底国','調教師','なが〜い家出','のび太','秘密トンネル','部屋でロードショー','ブラックホール','ヘリコプター','息子が家出した','名場面','模型鉄道','0点脱出作戦'],ptsEach:2,max:30}]}]}
];
const state=sections.map(()=>({answers:{},choices:{},manual:{},score:0}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s。、,，.！!「」『』（）()・]/g,'');
const correct=(v,a,aliases=[])=>[a,...aliases].some(x=>norm(v)===norm(x));
const maxPts=s=>s.items.reduce((n,it)=>n+it.fields.reduce((m,f)=>m+(f.max||((f.ptsEach&&f.answers)?f.ptsEach*f.answers.length:0)||f.pts||0),0),0);
function renderQuestion(si){document.querySelectorAll('.screen').forEach(x=>x.remove());const s=sections[si],st=state[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${labels[si]} ${esc(s.title)}</h2><p class="muted">大問 ${si+1} / 7　（${s.max}点満点）</p>${s.reading?`<div class="reading-text">${esc(s.reading)}</div>`:''}${s.image?`<div class="image-container"><img src="${esc(s.image)}" alt="大問Ⅵの問題画像"></div>`:''}`;s.items.forEach((it,ii)=>{const b=document.createElement('div');b.className='question-block';let h=`<div class="q-title">${esc(it.q)}</div>`;it.fields.forEach((f,fi)=>{const id=`${ii}_${fi}`;if(f.kind==='choice'){h+=`<div class="options-vertical">${f.options.map((o,j)=>`<button type="button" class="opt-btn-v ${st.choices[id]===j?'selected':''}" data-choice="${id}" data-value="${j}">${esc(o)}</button>`).join('')}</div>`}else h+=`<input class="text-input" data-answer="${id}" value="${esc(st.answers[id]||'')}" placeholder="回答を入力">`});b.innerHTML=h;card.appendChild(b)});const submit=document.createElement('button');submit.className='btn-submit';submit.textContent=`${labels[si]}を採点する`;submit.onclick=()=>gradeSection(si);card.appendChild(submit);if(si>0){const back=document.createElement('button');back.className='btn-submit';back.textContent='前の大問に戻る';back.onclick=()=>renderResult(si-1);card.appendChild(back)}document.getElementById('quiz').appendChild(card);card.querySelectorAll('[data-answer]').forEach(x=>x.oninput=()=>st.answers[x.dataset.answer]=x.value);card.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{st.choices[x.dataset.choice]=Number(x.dataset.value);x.parentElement.querySelectorAll('button').forEach(y=>y.classList.toggle('selected',y===x))})}
function resultItem(si,ii){const it=sections[si].items[ii],st=state[si],out=[];let earned=0,max=0;it.fields.forEach((f,fi)=>{const id=`${ii}_${fi}`;if(f.kind==='choice'){const ok=st.choices[id]===f.key,pts=ok?f.pts:0;earned+=pts;max+=f.pts;out.push({id,label:'',user:st.choices[id]===undefined?'未選択':f.options[st.choices[id]],answer:f.options[f.key],pts,max:f.pts,ok})}else if(f.kind==='multi'){const chosen=f.answers.filter(a=>norm(st.answers[id]||'').includes(norm(a)));const uniq=[...new Set(chosen)];const pts=Math.min(f.max,uniq.length*f.ptsEach);earned+=pts;max+=f.max;out.push({id,label:'',user:st.answers[id]||'未入力',answer:f.answers.join('、'),pts,max:f.max,ok:pts===f.max})}else if(f.kind==='list'){const values=(st.answers[id]||'').split(/[、,，\n\r;；]+/).map(x=>norm(x).replace(/^のび太の/,'' )).filter(Boolean);const accepted=new Set(f.answers.map(norm));const good=[...new Set(values.filter(x=>accepted.has(x)))];const pts=Math.min(f.max,good.length*f.ptsEach);earned+=pts;max+=f.max;out.push({id,label:'',user:st.answers[id]||'未入力',answer:f.answers.join('、'),pts,max:f.max,ok:pts===f.max})}else{const value=st.answers[id]||'',ok=correct(value,f.answer,f.aliases);const pts=f.manual?Number(st.manual[id]||0):(ok?f.pts:0);earned+=pts;max+=f.pts;out.push({id,label:'',user:value||'未入力',answer:f.answer,pts,max:f.pts,ok:pts===f.pts,manual:!!f.manual})}});return{earned,max,out,q:it.q}}
function gradeSection(si){const s=sections[si],st=state[si];st.score=s.items.reduce((n,it,ii)=>n+resultItem(si,ii).earned,0);renderResult(si)}
function renderResult(si){document.querySelectorAll('.screen').forEach(x=>x.remove());const s=sections[si],card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>${labels[si]} 採点結果</h2>`;s.items.forEach((it,ii)=>{const r=resultItem(si,ii),row=document.createElement('div');row.className=`result-item ${r.earned===r.max?'result-correct':'result-incorrect'}`;let h=`<span class="res-badge">${r.earned} / ${r.max}点</span><div><strong>${esc(r.q)}</strong></div>`;r.out.forEach(x=>{h+=`<div>あなたの回答：${esc(x.user||'未入力')}</div><div>正解例：${esc(x.answer)}</div>`;if(x.manual)h+=`<label>自己採点（${x.max}点満点）<select class="text-input" data-manual="${x.id}">${Array.from({length:x.max+1},(_,p)=>`<option value="${p}" ${x.pts===p?'selected':''}>${p}点</option>`).join('')}</select></label>`});row.innerHTML=h;card.appendChild(row)});card.insertAdjacentHTML('beforeend',`<div id="section-total" class="score-banner">大問得点：${state[si].score} / ${s.max}点</div>`);card.querySelectorAll('[data-manual]').forEach(sel=>sel.onchange=()=>{state[si].manual[sel.dataset.manual]=Number(sel.value);state[si].score=s.items.reduce((n,it,ii)=>n+resultItem(si,ii).earned,0);document.getElementById('section-total').textContent=`大問得点：${state[si].score} / ${s.max}点`});const back=document.createElement('button');back.className='btn-submit';back.textContent='回答に戻る';back.onclick=()=>renderQuestion(si);card.appendChild(back);if(si<sections.length-1){const next=document.createElement('button');next.className='btn-submit';next.textContent=`${labels[si+1]}へ進む`;next.onclick=()=>renderQuestion(si+1);card.appendChild(next)}else{const end=document.createElement('button');end.className='btn-submit';end.textContent='最終結果を見る';end.onclick=renderFinal;card.appendChild(end)}document.getElementById('quiz').appendChild(card)}
function renderFinal(){document.querySelectorAll('.screen').forEach(x=>x.remove());const total=state.reduce((n,x)=>n+x.score,0),card=document.createElement('section');card.className='card screen';card.innerHTML=`<h2>最終結果</h2><div class="score-banner ${total>=129.3?'pass':''}">総合得点：${total} / 200点<div style="font-size:1.1rem;margin-top:8px">${total>=129.3?'合格':'不合格'}</div><div style="font-size:.85rem">合格ライン：129.3点以上</div></div>`;sections.forEach((s,i)=>{const x=document.createElement('div');x.className='result-section-title';x.textContent=`${labels[i]}：${state[i].score} / ${s.max}点`;card.appendChild(x)});const home=document.createElement('a');home.className='btn-submit';home.href='https://hena-choco.github.io';home.textContent='問題一覧へ戻る';card.appendChild(home);document.getElementById('quiz').appendChild(card)}
renderQuestion(0);
</script></body></html>
